ącą równinę.", "img": null}, {"id": "c4m9", "c": 4, "ct": "Ziemia Obiecana", "n": "Źródło Charod", "lat": 32.55, "lon": 35.33, "ref": "Sdz 6–7", "sub": "Gedeon z trzystoma wojownikami wyrusza przeciw Madianitom.", "s": "Przy źródle Charod Gedeon zmniejszył wojsko z trzydziestu dwóch tysięcy do trzystu. Nocą ci wojownicy rozbili obóz Madianitów dźwiękiem trąb i płonących pochodni.", "k": ["Madianici i ich sprzymierzeńcy najeżdżali kraj każdego roku w porze żniw, pozostawiając Izraelitów w ubóstwie. Gedeon z Ofra został powołany na sędziego. Zebrał wojsko, lecz Pan polecił je zmniejszyć. Najpierw odprawiono lękliwych, potem sprawdzano, jak kto pije wodę ze źródła, aż pozostało trzystu mężczyzn. W nocy Gedeon podzielił ich na trzy oddziały, dał im trąby, puste dzbany i pochodnie. Na umówiony znak rozbili dzbany i zadąli w trąby, a wróg w panice zaczął uciekać.", "Źródło Charod leży u stóp góry Gilboa, na skraju Doliny Jizreel, a obóz Madianitów stał na północ od niego, w dolinie pod wzgórzem More. Z tego miejsca uciekającym otwierała się droga ku Jordanowi, ok. 15 km na wschód. Gedeon wykorzystał nocną ciemność, rozległość doliny i echo, by sprawić wrażenie ogromnej armii. Wąskie wejścia i krawędzie wzgórz sprawiły, że uciekinierzy zostali zepchnięci w stronę brodów rzeki."], "j": "Zobacz cichą noc nad doliną. U stóp skalistego zbocza wypływa źródło, a w oddali, w dolinie, mrugają setki ognisk obozu Madianitów, z wielbłądami rozłożonymi jak ciemne plamy. Na wzgórzach pojawiają się nagłe światła pochodni. Rekonstrukcja artystyczna, oparta na opisie nocy i terenu.", "d": "Odległość od źródła Charod do Jordanu wynosi ok. 15 km, a obóz Madianitów liczył według tekstu setki tysięcy ludzi i wielbłądów.", "img": "img/c4m9.webp"}, {"id": "c4m10", "c": 4, "ct": "Ziemia Obiecana", "n": "Timna", "lat": 31.78, "lon": 34.92, "ref": "Sdz 14", "sub": "Miasto Filistynów, gdzie Samson zakochał się w kobiecie i ułożył zagadkę.", "s": "Samson z Sorea zszedł do Timny, aby poślubić młodą Filistynkę. Podczas uczty zadał gościom zagadkę, co zapoczątkowało serię konfliktów z Filistynami.", "k": ["Samson pochodził z pokolenia Dan, z miasta Sorea. Gdy dorósł, zobaczył w Timnie młodą Filistynkę i poprosił rodziców, by ją dla niego wzięli za żonę. Idąc do Timny, zabił lwa gołymi rękoma, a później znalazł w jego szczątkach miód. Na uczcie weselnej ułożył z tego zagadkę dla trzydziestu gości, zakładając się o szaty. Gdy rozwiązanie wyszło na jaw dzięki żonie, Samson wpadł w gniew i zaczął serię czynów, które rozpętały otwartą wojnę z Filistynami.", "Timna leżała w dolinie Sorek, ok. 5 km od Sorea, na granicy między wzgórzami Judei a nadmorską niziną. Był to teren pogranicza, gdzie spotykali się Izraelici i Filistyni, wymieniali towary i zawierali małżeństwa. Dolina Sorek stanowiła naturalny korytarz z wybrzeża w głąb gór. Dlatego wszystkie napięcia między dwoma narodami rozgrywały się właśnie w takich miejscach, a historia Samsona dobrze pokazuje ten świat granic."], "j": "Wyobraź sobie szeroką dolinę o łagodnych stokach, z polami zboża, winnicami i niewielkim miastem na wzgórzu. Wokół stoją gospodarstwa, a na drogach widać pasterzy i wozy. W oddali, na wschodzie, wznoszą się skaliste wzgórza Judei. To rekonstrukcja artystyczna, oparta na opisie pogranicza.", "d": "Timna (Tel Batash) leży ok. 5 km od Sorea i ok. 25 km od morza.", "img": null}, {"id": "c4m11", "c": 4, "ct": "Ziemia Obiecana", "n": "Gaza", "lat": 31.5, "lon": 34.467, "ref": "Sdz 16", "sub": "Miasto Filistynów, z którego Samson wyniósł bramy na wzgórze.", "s": "Gdy Filistyni zamknęli bramy Gazy, by schwytać Samsona, ten wyrwał je wraz ze słupami i wyniósł w stronę Hebronu. Później w Gazie został schwytany i uwięziony.", "k": ["Samson przybył do Gazy, gdzie Filistyni zamknęli bramy miasta, planując schwytać go o świcie. W środku nocy wstał, wyrwał bramy wraz ze słupami i zaniósł je na wzgórze naprzeciw Hebronu. Później Delila, kobieta z doliny Sorek, wydała jego tajemnicę, a Filistyni pojmali go, oślepili i zawiedli do Gazy. Uwięziony pracował przy młynie, aż w świątyni Dagona, podczas święta, poprosił Pana o ostatnie wzmocnienie sił i obalił filary, ginąc razem z wrogami.", "Gaza leżała na południowym krańcu nadmorskiej równiny, ok. 5 km od morza, przy wielkim szlaku łączącym Egipt z Syrią i Mezopotamią. To jedno z największych miast filistyńskich, bogate dzięki handlowi. Odległość z Gazy do Hebronu wynosi ok. 60 km, w tym ostatnie dwadzieścia kilka stromo pod górę. Wyczyn Samsona był więc nie tylko cudem siły, ale też symbolem upokorzenia miasta, którego bramy wyniesiono pod same wzgórza Judei."], "j": "Zobacz obwarowane miasto na piaszczystym wzgórzu, otoczone gajami palm i ogrodami. Mury z cegły i kamienia są szerokie, a w nich masywna brama z drewnianymi skrzydłami. Za miastem rozciąga się równina i dalekie morze, a w dali wznoszą się łagodne wzgórza. To rekonstrukcja artystyczna na podstawie wiedzy o miastach filistyńskich.", "d": "Gaza leży ok. 5 km od Morza Śródziemnego i ok. 60 km od Hebronu.", "img": "img/c4m11.webp"}, {"id": "c4m12", "c": 4, "ct": "Ziemia Obiecana", "n": "Betlejem", "lat": 31.704, "lon": 35.2, "ref": "Rt 1–4", "sub": "Pola jęczmienia, na których Rut spotkała Booza, i początek rodu Dawida.", "s": "Rut, Moabitka, wróciła z teściową Noemi do Betlejem w czasie żniw jęczmienia. Zbierała kłosy na polu Booza, który ją poślubił i stał się dziadkiem Jessego.", "k": ["Z powodu głodu Elimelech z rodziną opuścił Betlejem i zamieszkał w Moabie. Po śmierci męża i synów Noemi postanowiła wrócić, a jej synowa Rut poszła z nią. W Betlejem zaczynały się żniwa jęczmienia. Rut wyszła na pola, by zbierać kłosy, i trafiła na pole Booza, krewnego Noemi. Booz zadbał o jej bezpieczeństwo, a po dopełnieniu przepisów prawa poślubił ją. Z ich rodziny narodził się Obed, ojciec Jessego, a więc dziadek króla Dawida.", "Betlejem leży na grzbiecie wzgórz Judei, ok. 8 km na południe od Jerozolimy, na wysokości ok. 770 m n.p.m. Okolica jest żyzna, ale przejście od pól do pustyni jest tu krótkie, co tłumaczy zarówno okresowe głody, jak i tradycję pasterską. Stoki wzgórz tworzą tarasy z jęczmieniem i pszenicą, a niżej, w kierunku Morza Martwego, zaczyna się pustynia Judzka. Przez Betlejem biegła droga z Hebronu do Jerozolimy."], "j": "Wyobraź sobie złociste pola jęczmienia na tarasach, zbierane ręcznie przez żniwiarzy. Kobiety zbierają kłosy, niosąc je w tobołkach, a w tle widać małe kamienne domy miasteczka na wzgórzu. Wokół rosną oliwki i figowce, a dalej wznoszą się jasne zbocza. Rekonstrukcja artystyczna, oparta na dzisiejszym krajobrazie okolicy.", "d": "Betlejem leży ok. 770 m n.p.m. i ok. 8 km od Jerozolimy.", "img": null}, {"id": "c5m1", "c": 5, "ct": "Królestwo Izraela", "n": "Gibea Saula", "lat": 31.8283, "lon": 35.2269, "ref": "1 Sm 10; 1 Sm 13–15; 1 Sm 22", "sub": "Skromna siedziba pierwszego króla Izraela na wzgórzu Beniamina.", "s": "Gibea była rodzinnym miastem Saula i jego pierwszą stolicą. Stąd rządził, stąd też wyruszał do walk z Filistynami i Amalekitami.", "k": ["Księga Samuela opowiada, że Saul, syn Kisza z plemienia Beniamina, został namaszczony przez proroka Samuela i obwołany królem. Nie zamieszkał jednak w pałacu: wrócił do Gibea, gdzie prowadził rządy wśród pasterzy i rolników. Jego dwór był skromny, a władza opierała się na stałej gotowości do wojny. Gdy Filistyni zagrażali krajowi, zbierał ochotników spod Gibea i Michmas. Z czasem relacje z Samuelem i z młodym Dawidem się psuły, co biblijni autorzy przedstawiają jako dramat odrzuconego władcy. Dla czytelnika ważne jest, że Księga Samuela nie ukrywa napięć: król bywał niepewny, lękliwy, a jego decyzje wywoływały spory z prorokiem.", "Gibea leżała na górskim grzbiecie ok. 5 km na północ od późniejszej Jerozolimy, przy drodze biegnącej wzdłuż centralnych gór z południa na północ. To wzgórze Beniamina było punktem obserwacyjnym: stąd widać było Jerozolimę, doliny schodzące ku Jordanowi i ruchy wojsk idących od zachodu. Wąskie przełęcze, takie jak sąsiednie Michmas, pozwalały małej armii zatrzymać dużo liczniejszego przeciwnika. To wyjaśnia, dlaczego pierwszy król wybrał miejsce obronne, a nie centrum handlowe. Miejsce takie jak to dobrze tłumaczy styl pierwszego rządu: mała stolica, bliskość pól i stała czujność wobec zagrożenia, które mogło nadejść z każdej strony."], "j": "Lokalizacja tradycyjna wskazuje na Tell el-Ful, kopiec o płaskim szczycie nad dzisiejszą Jerozolimą. Rekonstrukcja artystyczna przedstawia niewielką warownię z grubym murem z nieociosanych kamieni, wieżą narożną i kilkoma domami z gliny. Wokół rozciągają się tarasy z jęczmieniem, drzewa oliwne i stada owiec. Nad całością unosi się kurz górskiej drogi, a w oddali widać grzbiety Judei. Nad wszystkim czuć surową prostotę: żadnych kolumn, żadnego marmuru, tylko solidność i dym z palenisk.", "d": "Wysokość wzgórza ok. 840 m n.p.m.; odległość do Jerozolimy ok. 5 km.", "img": null}, {"id": "c5m2", "c": 5, "ct": "Królestwo Izraela", "n": "Dolina Terebintu", "lat": 31.6963, "lon": 35.0392, "ref": "1 Sm 17", "sub": "Pole starcia Dawida z Goliatem między Soko a Azeką.", "s": "W dolinie Terebintu zebrały się wojska Filistynów i Izraelitów. Młody pasterz Dawid podjął tu pojedynek, który stał się symbolem odwagi wobec silniejszego przeciwnika.", "k": ["Według Księgi Samuela Filistyni zgromadzili wojska pod Soko w Judzie, a Saul ustawił Izraelitów po drugiej stronie doliny Terebintu. Przez wiele dni z obozu wroga wychodził olbrzym Goliat, wyzywając Izraelitów do walki. Dawid, który przyniósł braciom żywność, nie chciał dłużej patrzeć na to upokorzenie. Odrzucił zbroję Saula, wziął kij, procę i kilka gładkich kamieni z potoku. Pokonał przeciwnika, a Filistyni uciekli w stronę Gat i Ekronu, ścigani przez Izraelitów. Opowieść ma też wymiar symboliczny, ale jej tło jest bardzo konkretne: dwa wojska, jedna dolina i lokalny potok, od którego wzięły się kamienie.", "Dolina Terebintu, dziś Wadi es-Sant, to naturalna granica między Szefelą a górami Judei. Biegnie ze wschodu na zachód i otwiera Filistynom drogę z nadmorskiej równiny ku Betlejem i Hebronowi. Zbocza są łagodne, dno szerokie i wyścielone kamieniami, co tłumaczy motyw procy. Dla Izraelitów kontrola nad tą doliną znaczyła obronę gór. Archeolodzy badają w pobliżu warowne miasto z czasów Dawida, Chirbet Qeijafa, lecz jego związek z samym pojedynkiem pozostaje przedmiotem dyskusji. Geografia podpowiada więc, dlaczego ta dolina powracała w historii: kto stał na wzgórzu, ten widział ruchy przeciwnika, a kto zszedł na dno, narażał się na ostrzał."], "j": "Rekonstrukcja artystyczna ukazuje szeroką dolinę z płytkim, kamienistym potokiem pośrodku. Na jednym zboczu stoi obóz Filistynów z namiotami i brązowymi tarczami, na drugim prostsze obozowisko Izraelitów z oliwnymi gajami. Między nimi, daleko, widać dwie maleńkie sylwetki naprzeciw siebie. Powietrze jest suche, światło ostre, a nad doliną rosną rozłożyste terebinty. Reszta obrazu to cisza przed starciem: stuk metalu, parskanie zwierząt i krótkie okrzyki dowódców niosą się daleko.", "d": "Od Chirbet Qeijafa do Jerozolimy ok. 30 km; dolina ma ok. 2–3 km szerokości.", "img": "img/c5m2.webp"}, {"id": "c5m3", "c": 5, "ct": "Królestwo Izraela", "n": "Hebron", "lat": 31.5326, "lon": 35.0998, "ref": "2 Sm 2–5; Rdz 23", "sub": "Pierwsza stolica Dawida jako króla Judy.", "s": "W Hebronie Dawid został namaszczony na króla Judy, a później także całego Izraela. Rządził stąd przez ok. siedem i pół roku.", "k": ["Po śmierci Saula Dawid pyta Boga, dokąd ma pójść, i wyrusza do Hebronu. Starszyzna Judy namaszcza go tu na króla swojego plemienia, podczas gdy północ pozostaje przy domu Saula. Następują lata wojny domowej, aż do zabójstwa wodza Abnera i króla Iszbaala. Wtedy przedstawiciele plemion przychodzą do Hebronu i uznają Dawida za władcę wszystkich Izraelitów. Księga Samuela podaje, że w Hebronie panował ok. siedem i pół roku, a później przeniósł się do Jerozolimy. Hebron pozostaje ważny także później: to właśnie tu Absalom ogłosi bunt przeciw ojcu, a miasto na długo zachowa znaczenie dla pokolenia Judy.", "Hebron leży ok. 30 km na południe od Jerozolimy, na wysokości ok. 930 m n.p.m., najwyżej ze wszystkich dużych miast Judei. Okolica jest urodzajna: winnice, gaje oliwne i pastwiska dały miastu bogactwo, a pobliska grota Machpela kojarzy się z grobami patriarchów. Z Hebronu prowadziły drogi ku Beer-Szebie i Negebowi oraz ku wybrzeżu. Dla Dawida, wywodzącego się z plemienia Judy, było to naturalne zaplecze, ale zbyt odległe od plemion północnych, by rządzić całym krajem. Wybór miejsca pokazuje pierwszą fazę rządów Dawida, gdy opierał się na własnym plemieniu i przyjaciołach z południa, zanim zbudował państwo obejmujące cały kraj."], "j": "Rekonstrukcja artystyczna ukazuje miasto na zboczu wzgórza, z domami z kamienia zbliżonymi do siebie, wąskimi uliczkami i placem przy bramie, gdzie zbierała się starszyzna. Wokół kaskady tarasów z winoroślą, gaje oliwne i stada kóz. Tło wyznaczają jasne wapienne wzgórza Judei, a powietrze jest chłodniejsze niż na pustyni na wschodzie. Wieczorem z kominów wznosi się dym, a z dołu dochodzą głosy pasterzy wołających stada do zagród.", "d": "Odległość do Jerozolimy ok. 30 km; wysokość ok. 930 m n.p.m.", "img": null}, {"id": "c5m4", "c": 5, "ct": "Królestwo Izraela", "n": "Miasto Dawida w Jerozolimie", "lat": 31.774, "lon": 35.2352, "ref": "2 Sm 5–6; 1 Krn 11", "sub": "Twierdza Jebusytów, która stała się stolicą całego Izraela.", "s": "Dawid zdobył Syjon, warownię Jebusytów, i nazwał ją swoim miastem. Przeniósł tam Arkę Przymierza, czyniąc z Jerozolimy centrum polityczne i religijne.", "k": ["Po koronacji nad całym Izraelem Dawid zwraca się przeciw Jerozolimie, którą jeszcze zajmowali Jebusyci. Mieszkańcy czuli się bezpieczni za swoimi murami, lecz wojska Dawida weszły do miasta przez tak zwany szyb wodny, tekst hebrajski używa tu rzadkiego słowa, którego znaczenia badacze dyskutują. Dawid obsadza twierdzę, buduje wokół niej mury i nazywa ją Miastem Dawida. Następnie sprowadza tu Arkę Przymierza z wielką radością, tańcząc przed nią. Jerozolima staje się stolicą polityczną i religijną. Przeniesienie Arki łączy w tej opowieści władzę i kult: król nie tylko zdobywa miasto, lecz czyni z niego miejsce, do którego zmierza cały lud.", "Wybór był przemyślany. Jerozolima leży na pograniczu Judy i Beniamina, więc nie faworyzowała żadnej ze stron. Wąski wzgórek między dolinami Cedronu i Tyropeonu był łatwy do obrony, a źródło Gihon u podnóża dawało stałą wodę. Miasto stało z dala od głównych szlaków handlowych, co chroniło je przed zagrożeniem, lecz wymagało dróg dojazdowych. Dawid zyskał stolicę neutralną plemiennie i bezpieczną militarnie. Zwróć uwagę na kolejność: najpierw warownia i mury, potem sanktuarium, a dopiero po latach świątynia, co pokazuje stopniowe dojrzewanie stolicy."], "j": "Rekonstrukcja artystyczna przedstawia ciasno zabudowany grzbiet wzgórza, schodzący tarasami ku dolinie Cedronu. Domy z kamienia wznoszą się jedne nad drugimi, a nad nimi stoi umocniona cytadela. Od strony wschodniej biegnie ścieżka do źródła Gihon, gdzie kobiety napełniają dzbany. W tle, na północy, widać pusty jeszcze płaskowyż, na którym wzniesiono później świątynię. Całość sprawia wrażenie gęstej, rozciągniętej wzdłuż grzbietu osady, pełnej zapachów dymu, ziół i nagrzanego kamienia.", "d": "Powierzchnia dawnego miasta ok. 5 ha; źródło Gihon ok. 100 m od szczytu wzgórza.", "img": "img/c5m4.webp"}, {"id": "c5m5", "c": 5, "ct": "Królestwo Izraela", "n": "Rabba Ammonitów", "lat": 31.9522, "lon": 35.9338, "ref": "2 Sm 10–12", "sub": "Miasto oblężone przez Joaba, gdzie rozegrał się dramat Dawida.", "s": "Podczas oblężenia Rabby, stolicy Ammonitów, Dawid zostaje w Jerozolimie i popełnia grzech wobec Uriasza. Prorok Natan wskazuje mu winę.", "k": ["Gdy król Ammonitów obrażał posłów Dawida, wybuchła wojna. Joab, dowódca wojsk, oblegał Rabbę, stolicę Ammonitów, a Dawid pozostał w Jerozolimie. Tam doszło do zdarzeń z Batszebą i Uriaszem Hetytą, którego król skierował na pierwszą linię walki, aby zginął. Prorok Natan opowiada przypowieść i obwinia króla. Dawid przyznaje się do winy. Tymczasem Joab zdobywa część miasta, tak zwane miasto wód, i wzywa króla, by sam zdobył resztę. Sceny te zestawiają dwa światy: pole bitwy, gdzie żołnierze wykonują rozkazy, oraz pałac, w którym władca zapomina o odpowiedzialności za własne czyny.", "Rabba leżała na wzgórzach dzisiejszego Ammanu, po drugiej stronie Jordanu, ok. 65 km w linii prostej od Jerozolimy. Droga wiodła w dół do doliny Jordanu, a potem stromo w górę przez zbocza Zajordania, co oznaczało dwa-trzy dni marszu dla wojska. Przy źródłach rzeki Jabbok miasto miało stałą wodę, więc oblężenie było długie. Ta odległość wyjaśnia, dlaczego król mógł pozostać w stolicy, a wojna toczyła się daleko od jego oczu. Autorzy biblijni nie ukrywają cienia nad najsłynniejszym królem, a opis geograficzny pomaga zrozumieć, jak wielki dystans dzielił decyzje od ich skutków."], "j": "Rekonstrukcja artystyczna ukazuje obwarowane wzgórze nad suchą doliną, z rzędem domów przyklejonych do zbocza i szeroką bramą. U podnóża, wzdłuż potoku, stoją namioty oblegających, a na murach błyszczą hełmy obrońców. Okolica jest otwarta, jałowa, pokryta niskimi krzewami i wapiennymi głazami. Powietrze jest pełne kurzu i dźwięku sygnałów rogów, a w oddali pasą się stada ammonickich pasterzy.", "d": "Odległość do Jerozolimy ok. 65 km w linii prostej; wysokość ok. 800–850 m n.p.m.", "img": null}, {"id": "c5m6", "c": 5, "ct": "Królestwo Izraela", "n": "Świątynia Salomona", "lat": 31.778, "lon": 35.2354, "ref": "1 Krl 5–8; 2 Krn 2–7", "sub": "Pierwsza świątynia na wzgórzu Moria, wzniesiona w ok. siedem lat.", "s": "Salomon zbudował świątynię na północ od Miasta Dawida, sprowadzając cedry z Libanu i rzemieślników z Tyru. Jej poświęcenie stało się wydarzeniem całego narodu.", "k": ["Księga Królewska opowiada, że Salomon zawarł umowę z Hiramem, królem Tyru, który dostarczył drewno cedrowe i cyprysowe oraz rzemieślników. Prace trwały ok. siedem lat. Świątynia składała się z przedsionka, głównej sali i najświętszego miejsca, gdzie stanęła Arka Przymierza. Wnętrze pokryto drewnem i złotem, ozdobiono rzeźbionymi cherubami, palmami i kwiatami. Podczas poświęcenia Salomon modlił się nad ludem, prosząc, by Bóg wysłuchiwał tych, którzy zwracają się ku temu miejscu. Opis w Księdze Kronik podkreśla przygotowania Dawida, który zebrał materiały i plany, choć sam nie dostał pozwolenia, by świątynię zbudować.", "Budowla stanęła na północ od starego miasta, na wzgórzu, które tradycja łączy z górą Moria. Salomon musiał poszerzyć płaskowyż, wznosząc wokół murów podtrzymujących. Kamień wydobywano w pobliżu, a drewno spławiano z Libanu morzem do Jafy i dalej wiodło się je na wzgórza Judei, co oznaczało marsz ok. 60 km pod górę. Samo położenie wyróżniało świątynię: stała wyżej niż pałace i miasto, było widoczne z każdej strony. Archeologia nie odnalazła samej budowli, bo na jej miejscu stały później kolejne świątynie, dlatego każdy obraz jest rekonstrukcją opartą na tekście i na porównaniach z podobnymi budowlami regionu."], "j": "Rekonstrukcja artystyczna ukazuje prostokątną budowlę z jasnego kamienia, z dwoma wolno stojącymi kolumnami przy wejściu i niskimi komnatami po bokach. Przed nią stoi dziedziniec z wielkim ołtarzem i brązowym basenem na grzbietach figur wołów. Wnętrze pozostaje niewidoczne, osłonięte cedrowymi drzwiami. Pracownicy w tle dokładają ostatnie bloki muru. Złote elementy wnętrza odbijają światło lamp, a zapach cedru i kadzidła przenika cały dziedziniec.", "d": "Wymiary głównej sali według tekstu: 60 × 20 × 30 łokci, czyli ok. 27 × 9 × 13,5 m.", "img": "img/c5m6.webp"}, {"id": "c5m7", "c": 5, "ct": "Królestwo Izraela", "n": "Megiddo", "lat": 32.5847, "lon": 35.1847, "ref": "1 Krl 9,15; 1 Krl 4,12; 2 Krl 23,29", "sub": "Warowny węzeł dróg u wejścia do doliny Jizreel.", "s": "Salomon ufortyfikował Megiddo, które strzegło szlaku z Egiptu do Mezopotamii. Miasto wielokrotnie zmieniało właścicieli i stało się symbolem decydujących bitew.", "k": ["Księga Królewska wymienia Megiddo wśród miast, które Salomon rozbudował razem z Chasorem i Gezer. Miało to zapewnić panowanie nad najważniejszą arterią handlową. Obok koszar i magazynów wznoszono bramy, a w tradycji badaczy pojawia się opis wielokomorowej bramy z czasów Salomona, choć jej datowanie bywa dyskutowane. Później niedaleko miasta zginął król Jozjasz w starciu z faraonem Necho (2 Krl 23). Dlatego Megiddo przeszło do historii jako miejsce bitew. Z biblijnej perspektywy fortyfikacje nie służyły tylko wojnie: pozwalały pobierać opłaty od karawan, zapewniały zaopatrzenie i wzmacniały prestiż władcy wobec sąsiadów.", "Tel Megiddo wznosi się na krawędzi doliny Jizreel, przy wąskim przejściu przez wzgórza Karmelu, ok. 30 km od wybrzeża. Przez tę przełęcz biegł szlak morski, Via Maris, łączący Egipt z Syrią i dalej z Mezopotamią. Kto trzymał tę przełęcz, mógł pobierać cła i zatrzymywać armie. Odkrycia archeologiczne potwierdzają, że miasto istniało nieprzerwanie przez tysiąclecia, a ślady zniszczeń i odbudowy pojawiają się warstwa po warstwie. Nazwa Har-Magedon z Księgi Apokalipsy, zapisana w greckim brzmieniu, odwołuje się do tego wzgórza, choć jej dokładne rozumienie pozostaje przedmiotem badań egzegetów."], "j": "Rekonstrukcja artystyczna ukazuje wysoki, owalny kopiec nad zieloną równiną, otoczony murami z kamienia i bramą z kilkoma komorami wartowniczymi. Wewnątrz widać koszary i duże obiekty, które badacze interpretują jako stajnie lub magazyny. Na drodze u podnóża idzie karawana osłów i wielbłądów, a w oddali błyszczy pas Karmelu. Drogi biegną u stóp muru jak szerokie wstęgi, a wśród pól widać drobne wsie zależne od miasta.", "d": "Wysokość kopca ok. 60 m ponad otoczeniem; ok. 30 odrębnych warstw osadniczych.", "img": "img/c5m7.webp"}, {"id": "c5m8", "c": 5, "ct": "Królestwo Izraela", "n": "Chasor i Gezer", "lat": 33.0178, "lon": 35.5681, "ref": "1 Krl 9,15–17; Joz 11,10", "sub": "Największe miasto Kanaanu i jego odpowiednik na zachodzie.", "s": "Salomon odbudował Chasor na północy i Gezer na zachodzie jako strażnice królestwa. Gezer zdobył faraon i oddał córce, żonie Salomona.", "k": ["Tekst z Pierwszej Księgi Królewskiej łączy trzy miasta: Chasor, Megiddo i Gezer. Wszystkie Salomon odbudował jako część programu umocnień. Gezer, według narracji, został zdobyty przez faraona, który spalił miasto i oddał je córce jako wiano. Salomon odbudował je na nowo. Te trzy punkty tworzyły system obronny i podatkowy, a jednocześnie pokazywały, że królestwo nawiązało związki z potęgami sąsiednimi, w tym z Egiptem. Warto pamiętać, że jest to obraz całościowy: Biblia opisuje tu plan budowlany króla, a archeolodzy porównują go z odkrytymi warstwami murów i bram w trzech miastach.", "Chasor leżał na północy, nad doliną Hula, ok. 15 km na północ od jeziora Genezaret. Był to wielki węzeł, w którym schodziły się drogi z Damaszku, Fenicji i Egiptu. Miasto górne zajmowało niecałe 10 ha, ale dolne, według badań, ok. 70 ha, czyli było największym ośrodkiem Kanaanu. Gezer natomiast strzegł zachodniej drogi do Jerozolimy, biegnącej przez Szefelę. Oba miasta leżały na krawędziach królestwa, tam, gdzie rozstrzygała się sprawa granic. Gezer pokazuje też stosunki z Egiptem: małżeństwo z córką faraona uznawano za zaszczyt, a jej wiano było realnym gestem politycznym wobec młodego królestwa."], "j": "Rekonstrukcja artystyczna ukazuje płaski kopiec nad doliną, z masywnym murem otaczającym miasto górne. Na tle ciemnych wzgórz Galilei widać bramę z wieżami, a dalej rozległe pola pszenicy. Przed bramą kręcą się kupcy z ciężkimi workami, żołnierze pilnują wejścia, a z kominów unosi się dym. Gdy zachodzi słońce, mury nabierają rudego koloru, a straże zapalają pochodnie na wieżach.", "d": "Miasto dolne Chasoru ok. 70 ha; odległość do Dan ok. 20 km.", "img": null}, {"id": "c5m9", "c": 5, "ct": "Królestwo Izraela", "n": "Dan i Betel", "lat": 33.2487, "lon": 35.6522, "ref": "1 Krl 12,25–33", "sub": "Dwa sanktuaria Jeroboama na krańcach północnego królestwa.", "s": "Po podziale królestwa Jeroboam ustawił złote cielce w Dan i w Betel, aby lud nie chodził do Jerozolimy. Biblia ocenia to jako grzech.", "k": ["Po śmierci Salomona jego syn Roboam odrzucił prośbę o lżejsze podatki, a plemiona północne wybrały Jeroboama na króla. Obawiał się on, że pielgrzymki do Jerozolimy skłonią lud do powrotu pod władzę Judy. Dlatego wyznaczył dwa ośrodki kultu, Betel na południowej granicy i Dan na północnej, oraz ustawił w nich złote cielce. Autor Księgi Królewskiej uznaje ten krok za grzech, który przez wieki ciążył na królach Izraela. Podział królestwa nie był tylko sprawą polityki. Wiązał się z pamięcią o dawnych sanktuariach i z pytaniem, gdzie lud ma składać ofiary i święta obchodzić.", "Wybór miejsc miał sens geograficzny. Betel leży ok. 17 km na północ od Jerozolimy, przy głównej drodze gór, i był świętym miejscem już w czasach patriarchów. Dan znajduje się daleko na północy, przy źródłach Jordanu, ok. 150 km od Jerozolimy. Dwa sanktuaria obejmowały cały kraj i dawały pielgrzymom namiastkę jerozolimskiego kultu bliżej domu. Z politycznego punktu widzenia był to sprytny ruch, który ukazuje, jak religia i granice są ze sobą powiązane. Prorocy późniejszych wieków będą wracać do tych dwóch miejsc jako przykładu zmieszania prawdziwego kultu z politycznym rachunkiem, a Księgi Królewskie powtarzają tę ocenę wielokrotnie."], "j": "Rekonstrukcja artystyczna ukazuje sanktuarium na wzniesieniu przy źródłach, z podwyższonym placem kultowym i ołtarzem z ciosanego kamienia. Wokół rosną wysokie drzewa i szemrze woda, co odróżnia Dan od suchych terenów południa. Kapłani i pielgrzymi w prostych szatach zbliżają się po schodach, a w tle widać śnieżną czapę góry Hermon. Nawet bez rzeźb i ozdób miejsce wygląda poważnie, a szum źródeł wypełnia cały teren.", "d": "Dan: ok. 150 km w linii prostej od Jerozolimy; Betel: ok. 17 km.", "img": null}, {"id": "c5m10", "c": 5, "ct": "Królestwo Izraela", "n": "Samaria", "lat": 32.2761, "lon": 35.1914, "ref": "1 Krl 16,23–28; 1 Krl 20; 2 Krl 6–7", "sub": "Stolica północnego królestwa, założona przez Omriego.", "s": "Omri kupił wzgórze od Szemera i zbudował na nim nową stolicę. Samaria stała się siedzibą Achaba i Jezabel oraz celem oblężeń.", "k": ["Księga Królewska podaje, że Omri kupił górę od Szemera za dwa talenty srebra i zbudował na niej miasto, które nazwał Samarią. Jego syn Achab ożenił się z Jezabel, córką króla Sydonu, i wzniósł w stolicy świątynię Baala. Miasto było kilkakrotnie oblegane przez Aramejczyków. Opowieści o Elizeuszu i głodzie w Samarii pokazują, jak mocno surowe warunki wpływały na życie mieszkańców. W końcu Samaria padła w 722 r. p.n.e. wobec Asyrii. Samaria dała później nazwę całej krainie i jej mieszkańcom, a jej rola w Nowym Testamencie, gdzie występuje w spotkaniach Jezusa i apostołów, sięga o wiele wieków dalej.", "Wybór wzgórza był przemyślany. Leży ono w centralnych górach, ok. 10 km na północny zachód od Sychem, na wysokości ok. 430 m n.p.m., z płaską, szeroką doliną dookoła. Miasto stało na własnym wzniesieniu, bez konkurencji ze strony starych ośrodków plemiennych, a blisko drogi do wybrzeża i doliny Jizreel. Archeolodzy odkryli tam monumentalne mury i kości słoniowe zdobiące meble, co zgadza się z wzmianką o domu z kości słoniowej (1 Krl 22,39). Tekst Biblii opisuje tu nie tylko politykę, lecz i konflikt wartości: królowie szukali sojuszy z sąsiadami, a prorocy upominali się o wierność przymierzu."], "j": "Rekonstrukcja artystyczna ukazuje okrągłe wzgórze otoczone podwójnym murem z dobrze ociosanych bloków. Na szczycie stoi pałac z dziedzińcem, a od strony pól prowadzi do niego brukowana droga. Poniżej rozciągają się pola jęczmienia i winnice, a w tle widać łagodne wzgórza Samarii. Atmosfera jest bardziej wystawna niż w Gibea. Z murów widać szerokie okolice, a w dolinie rolnicy pracują wśród tarasów i gajów oliwnych.", "d": "Wysokość wzgórza ok. 430 m n.p.m.; cena zakupu według tekstu: 2 talenty srebra.", "img": "img/c5m10.webp"}, {"id": "c5m11", "c": 5, "ct": "Królestwo Izraela", "n": "Góra Karmel", "lat": 32.741, "lon": 35.045, "ref": "1 Krl 18", "sub": "Miejsce pojedynku Eliasza z prorokami Baala.", "s": "Na Karmelu prorok Eliasz stanął wobec króla Achaba i proroków Baala. Po wielu latach suszy na kraj spadł deszcz.", "k": ["Po trzech latach suszy Eliasz wzywa króla Achaba, by zebrał lud i proroków Baala na górze Karmel. Ma tu paść rozstrzygnięcie: który Bóg jest prawdziwy. Prorocy Baala wołają od rana do południa, lecz nikt nie odpowiada. Eliasz odbudowuje ołtarz, układa ofiarę i polewa ją wodą. Dopiero wtedy się modli, a ogień spada z nieba. Lud wyznaje wiarę w Boga Izraela. Potem prorok wspina się i modli o deszcz, a sługa wypatruje chmury nad morzem. Opowieść zawiera też moment ciszy: po huku i ogniu prorok jest zmęczony i zniechęcony, a historia prowadzi go dalej na pustynię i aż do góry Horeb (1 Krl 19).", "Karmel to wapienny grzbiet o długości ok. 25 km, biegnący od wybrzeża w stronę doliny Jizreel. Jego szczyty sięgają ok. 550 m n.p.m. Od zachodu dochodzi wilgotne powietrze znad morza, które nawet w czasie suszy daje tu rosę i bujną roślinność, dlatego Karmel kojarzył się z urodzajem. Z górnych partii widać zarówno Morze Śródziemne, jak i dolinę Kiszonu, gdzie później wykonano wyrok. To tłumaczy, dlaczego wybrano akurat ten teren. Jest to jedna z najsłynniejszych scen Starego Testamentu, w której geografia, pogoda i wiara tworzą jedną spójną opowieść o zaufaniu."], "j": "Rekonstrukcja artystyczna ukazuje skalisty szczyt pokryty dębami, krzewami i dzikimi ziołami. Na płaskim miejscu stoi ołtarz z dwunastu kamieni, a wokół zbiera się tłum wieśniaków i żołnierzy. Daleko za nimi lśni pas morza, a na horyzoncie pojawia się pierwsza mała chmura. Wiatr niesie zapach żywicy i wilgoci znad morza, a cienie chmur przesuwają się po zboczach.", "d": "Grzbiet o długości ok. 25 km; najwyższy punkt ok. 550 m n.p.m.", "img": "img/c5m11.webp"}, {"id": "c5m12", "c": 5, "ct": "Królestwo Izraela", "n": "Jizreel", "lat": 32.5586, "lon": 35.3247, "ref": "1 Krl 21; 2 Krl 9–10", "sub": "Letnia rezydencja Achaba i winnica Nabota.", "s": "W Jizreel dokonano zbrodni na Nabocie, a później spełniła się przepowiednia Eliasza. Tu zginęli Joram i Jezabel.", "k": ["W Jizreel Achab miał pałac obok winnicy Nabota. Gdy król chciał ją nabyć, Nabot odmówił, powołując się na dziedzictwo przodków. Jezabel sfałszowała dokumenty, a Nabota skazano na śmierć. Eliasz oznajmił Achabowi karę. Po latach przepowiednia się spełniła: Jehu, namaszczony na króla, wjechał do Jizreel i zabił Jorama, a Jezabel wyrzucono z okna. Tak skończyła się dynastia Omriego. Ta scena domyka cykl opowieści o Eliaszu i Achabie. Prorok zapowiedział upadek dynastii, a wydarzenia w Jizreel pokazują, jak surowo oceniono naruszenie praw prostego człowieka.", "Jizreel leży na wschodnim krańcu doliny Jizreel, ok. 20 km od Megiddo, na niewielkim wzniesieniu z widokiem na szeroką, żyzną równinę. Dolina jest najurodzajniejszą okolicą Izraela: biegnie od Karmelu aż do Jordanu na długości ok. 40 km. To tu przecinały się drogi wojskowe i handlowe, więc władca mieszkający w Jizreel mógł z wyprzedzeniem dostrzec nadchodzące wojsko. Z wieży było widać Jehu zbliżającego się z Ramot Gilead. Dolina Jizreel pojawia się w Biblii wielokrotnie, od czasów Gedeona po Jozjasza, i zawsze jako miejsce, gdzie ważą się losy kraju."], "j": "Rekonstrukcja artystyczna ukazuje obwarowany pałac na niewielkim wzniesieniu, z wieżą strażniczą wyższą od murów. U jego stóp rozciągają się winnice i pola pszenicy, a dalej szeroka zielona dolina aż po góry Gilboa. Droga biegnie prosto przez równinę, pozwalając dostrzec nadjeżdżających jeźdźców z daleka. Wieczorem dolina pokrywa się złotym światłem, a drogi znikają w mgle unoszącej się nad polami.", "d": "Długość doliny Jizreel ok. 40 km; odległość do Megiddo ok. 20 km.", "img": null}, {"id": "c6m1", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Niniwa", "lat": 36.359, "lon": 43.153, "ref": "Jon 1–4; Na 1–3", "sub": "Wielka stolica Asyrii, do której Bóg posyła niechętnego proroka.", "s": "Jonasz dostaje polecenie, by ostrzec Niniwę, ale ucieka w przeciwną stronę. Gdy wreszcie głosi, miasto się nawraca, a księga uczy, że Boże miłosierdzie sięga także obcych narodów.", "k": ["Księga Jonasza opowiada o proroku, który ma pójść do Niniwy i ostrzec jej mieszkańców przed sądem. Jonasz wsiada jednak na statek płynący w przeciwną stronę, a burza i pobyt we wnętrzu wielkiej ryby sprawiają, że ostatecznie posłusznie rusza w drogę. Jego krótkie wezwanie wywołuje u mieszkańców pokutę, od króla po zwierzęta. Prorok jest zaskoczony, a nawet rozżalony Bożym przebaczeniem. Księga kończy się pytaniem Boga, skierowanym także do czytelnika, czy nie ma On prawa litować się nad tak wielkim miastem.", "Niniwa leżała nad wschodnim brzegiem Tygrysu, naprzeciw dzisiejszego Mosulu w Iraku, ok. 800 km w linii prostej od Jerozolimy. Pieszo oznaczało to wiele tygodni marszu przez Syrię i północną Mezopotamię. Żyzne równiny, nawadniane wodą z gór Taurus i Zagros, pozwalały wyżywić ogromną ludność. Stąd armie Asyrii wyruszały na zachód, ku wybrzeżu Morza Śródziemnego. Idąc do Niniwy, Jonasz szedł więc do serca potęgi, która zagrażała jego własnemu narodowi. Wzmianka o „trzech dniach drogi” oznacza zapewne rozległość miasta wraz z okolicznymi osadami."], "j": "Rekonstrukcja artystyczna ukazuje miasto otoczone potężnymi murami z wielkimi bramami, nad którymi wznoszą się tarasy pałaców i świątyń. Ściany budowli, wykonane z cegły suszonej i oblicowane kamiennymi płytami, zdobiły reliefy ze scenami polowań i wypraw wojennych. Przed bramą kręcą się karawany z osłami, a nad rzeką widać kanały i ogrody. W oddali, na pagórku, stoi maleńka postać wędrowca, patrzącego na ogrom miasta.", "d": "Mury Niniwy z czasów Sennacheryba miały ok. 12 km obwodu.", "img": "img/c6m1.webp"}, {"id": "c6m2", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Samaria", "lat": 32.2778, "lon": 35.1903, "ref": "1 Krl 16,24; 2 Krl 17; Am 3–6", "sub": "Stolica Królestwa Północnego, zdobyta przez Asyrię w 722 r. przed Chr.", "s": "Samaria była stolicą Izraela na wzgórzu w sercu żyznego kraju. Po trzech latach oblężenia padła przed Asyryjczykami, a znaczna część jej mieszkańców została wysiedlona.", "k": ["Król Omri założył Samarię jako nową stolicę, a jego następcy, Achab i kolejni władcy, rozbudowali ją w okazałe miasto. Prorocy tacy jak Amos i Ozeasz upominali jednak mieszkańców za niesprawiedliwość wobec ubogich i za kult obcych bóstw. Według 2 Krl 17 Salmanasar V oblegał miasto przez trzy lata, a jego następca, Sargon II, według asyryjskich źródeł zakończył dzieło w 722 lub 721 r. przed Chr. Część ludności wywieziono do Asyrii i Medii, a w kraju osiedlono przybyszów z innych regionów. Królestwo Północne przestało istnieć jako państwo.", "Samaria stała na samotnym, owalnym wzgórzu wznoszącym się ok. 100 m nad otaczającymi dolinami, w centralnych górach Efraima. Stroma, łatwa do obrony pozycja i żyzne pola wokół tłumaczą, dlaczego miasto wytrzymało tak długie oblężenie. Jednocześnie leżała blisko ważnych szlaków wiodących od wybrzeża ku Dolinie Jordanu, co czyniło ją kuszącym celem. Dla Asyrii zdobycie Samarii otwierało drogę na południe, ku Judzie, i zabezpieczało tyły wypraw skierowanych ku Egiptowi. Dziś pozostałości leżą w pobliżu arabskiej wsi Sebastia."], "j": "Rekonstrukcja artystyczna ukazuje wzgórze zwieńczone akropolem z pałacem królewskim, otoczonym podwójnym murem z kamiennych ciosów. Poniżej, na tarasach, stoją domy z kamienia i drewna, a wokół widać pola pszenicy, winnice i gaje oliwne. Na bocznej drodze wije się kolumna jeńców, strzeżona przez żołnierzy: symbol dramatu z 722 r. Na szczycie wzgórza błyszczą jasne ciosy kamienne pałacu, a z bram wychodzą kupcy z osłami ku dolinie.", "d": "Wzgórze Samarii wznosi się ok. 100 m nad okoliczną doliną; oblężenie trwało ok. 3 lat.", "img": null}, {"id": "c6m3", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Lachisz", "lat": 31.5646, "lon": 34.8478, "ref": "2 Krl 18,13–17; 2 Krn 32,9; Mi 1,13; Iz 36,1–2", "sub": "Druga co do ważności twierdza Judy, zdobyta przez Sennacheryba w 701 r.", "s": "Gdy Sennacheryb najechał Judę, jego obozem dowodzenia stało się oblężone Lachisz. Zdobycie tej twierdzy otworzyło Asyryjczykom drogę ku Jerozolimie.", "k": ["W czternastym roku panowania króla Ezechiasza Sennacheryb, władca Asyrii, najechał Judę i zdobył wiele jej warownych miast. Księgi Królewskie i Kronik opisują, że jego sztab zatrzymał się właśnie pod Lachisz, skąd wysyłano posłów do Jerozolimy z żądaniem poddania. Ezechiasz próbował kupić pokój, wysyłając ciężki trybut, lecz Asyryjczycy nie zrezygnowali. Prorok Izajasz uspokajał króla, a Bóg obiecał ocalić miasto. Księga Micheasza wspomina Lachisz w gorzkim wyliczeniu miejscowości, które poniosą skutki grzechu.", "Lachisz leżało w Szefeli, pogórzu między górami Judei a nadmorską równiną, ok. 40 km na południowy zachód od Jerozolimy. Takie położenie czyniło je strażnikiem dróg prowadzących od wybrzeża i z Egiptu w górę, ku stolicy. Kto je zajął, kontrolował dostęp do wzgórz. Asyryjczycy nie szturmowali muru z marszu: wznieśli wielką rampę oblężniczą z ziemi i kamieni, a obrońcy odpowiedzieli własną przeciwrampą. Archeologia potwierdza oba te elementy. Scenę zdobycia miasta przedstawiały też reliefy w pałacu Sennacheryba w Niniwie."], "j": "Rekonstrukcja artystyczna pokazuje wzgórze miasta opasane potężnymi murami i bramą, a na jego stoku rampę oblężniczą, po której wspinają się wieże oblężnicze z taranami. Łucznicy ostrzeliwują mury, obrońcy zrzucają płonące pochodnie, a nad polem bitwy unosi się dym. W tle widać asyryjski obóz z namiotami dowódców. Sceny widać z oddali, bez rozpoznawalnych twarzy. Pod murami widać stosy kamieni, drewniane drabiny i nieliczne ocalałe drzewa oliwne.", "d": "Odległość Lachisz–Jerozolima: ok. 40 km w linii prostej; oblężenie miało miejsce w 701 r. przed Chr.", "img": "img/c6m3.webp"}, {"id": "c6m4", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Tunel Ezechiasza i Jerozolima w 701 r.", "lat": 31.771, "lon": 35.2355, "ref": "2 Krl 18–20; 2 Krn 32,2–8.30; Iz 36–37", "sub": "Jerozolima przygotowuje się do oblężenia, a woda trafia pod ziemię.", "s": "Ezechiasz umocnił mury i poprowadził wodę ze źródła Gichon do wnętrza miasta. Jerozolima przetrwała oblężenie Sennacheryba, a Biblia opisuje to jako Boże ocalenie.", "k": ["Gdy Ezechiasz zobaczył, że Asyria zbliża się do Jerozolimy, przystąpił do umacniania miasta. Według 2 Krn 32 naprawił mury, wzniósł dodatkowe obwarowania i zadbał o zapasy. Zasłonił też źródła poza miastem, by wróg nie miał wody, a wodę poprowadził do wnętrza obwarowań. Asyryjski wysłannik wzywał mieszkańców do kapitulacji, szydząc z ich Boga, lecz Ezechiasz modlił się w Świątyni. Biblia mówi, że Asyryjczycy odstąpili od miasta, a Sennacheryb wrócił do Niniwy.", "Jerozolima leżała na wąskim grzbiecie Miasta Dawida, ok. 700 m n.p.m. Jedyne stałe źródło, Gichon, wypływało poza murami, w Dolinie Cedronu, i było narażone na przejęcie przez wroga. Dlatego wykuto tunel długości ok. 530 m, który skalnym korytem kieruje wodę do sadzawki Siloam wewnątrz murów. Wykuwano go z obu stron jednocześnie i ekipy spotkały się pośrodku. Kamienna inskrypcja z Siloam, odkryta w XIX wieku, opowiada o tym wydarzeniu. Dziś tunel jest dostępny dla zwiedzających; bywa w nim wysoki poziom wody."], "j": "Rekonstrukcja artystyczna pokazuje wąski, ciasny korytarz wykuty w skale, z wodą po kostki i śladami dłut na ścianach. W świetle lamp oliwnych widać ciemny strumień płynący w stronę sadzawki, a na powierzchni wzgórza wznoszą się mury i wieże Jerozolimy. U wylotu tunelu mieszkańcy czerpią wodę dzbanami, nie wiedząc jeszcze, co przyniesie następny dzień. Skała pachnie wilgocią, a chłód tunelu kontrastuje z upałem na górze.", "d": "Tunel Ezechiasza ma ok. 530 m długości, a różnica poziomów na jego końcach to zaledwie ok. 30 cm.", "img": null}, {"id": "c6m5", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Jerozolima w 587 r. przed Chr.", "lat": 31.778, "lon": 35.2354, "ref": "2 Krl 25; 2 Krn 36,17–21; Jr 39; 52; Lm 1–2", "sub": "Zniszczenie miasta i pierwszej Świątyni przez wojska Nabuchodonozora.", "s": "Po długim oblężeniu Babilończycy zdobyli Jerozolimę, spalili Świątynię i wywieźli znaczną część mieszkańców. Prorok Jeremiasz widział w tym skutek niewierności, ale też zapowiadał nadzieję.", "k": ["Ostatni król Judy, Sedekiasz, zbuntował się przeciw Babilonowi, więc Nabuchodonozor ruszył z armią i obległ Jerozolimę. Według 2 Krl 25 w mieście zapanował głód, a po przełamaniu muru król próbował uciec ku Jerychu, lecz został schwytany. Babilończycy spalili Świątynię, pałac i domy, a mury rozebrali. Wielu mieszkańców wywieziono do Babilonii. Jeremiasz, który wcześniej ostrzegał przed taką katastrofą, nie przestał mówić o przyszłości: zapowiadał nowe przymierze i powrót. Księga Lamentacji wyraża ból tych dni.", "Jerozolima leżała na górskim grzbiecie, otoczona głębokimi dolinami, więc podbić ją można było głównie przez zagłodzenie. Dlatego oblężenie trwało ok. 18 miesięcy. Babilońska armia przeszła z Mezopotamii wzdłuż Eufratu przez Syrię i dotarła do ziemi Judy po marszu liczonym w tygodniach. Ucieczka Sedekiasza biegła ku Dolinie Jordanu, ok. 25 km na wschód, szlakiem opadającym o ok. 1000 m do doliny Jerycha. Tam, na równinie, Babilończycy dopadli uciekających. Rozmiar upadku najlepiej obrazuje różnica wysokości między stolicą a pustynią."], "j": "Rekonstrukcja artystyczna ukazuje płonącą Jerozolimę o zmierzchu: dym wznosi się nad zrujnowaną świątynią na wzgórzu, a w murach ziejają wyłomy. Na stoku żołnierze babilońscy poruszają się wśród drabin i wież oblężniczych, a z miasta wychodzi długi, powolny pochód ludzi niosących tobołki. Całość widać z dystansu, w czerwonawym świetle pożaru. Przez wyłomy w murach widać ciemną, opuszczoną dolinę Cedronu.", "d": "Oblężenie trwało ok. 18 miesięcy; zniszczenie nastąpiło w 587 lub 586 r. przed Chr.", "img": "img/c6m5.webp"}, {"id": "c6m6", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Babilon", "lat": 32.5355, "lon": 44.4275, "ref": "Dn 1–6; Iz 13–14; Jr 29; Ps 137", "sub": "Miasto wygnania, w którym Daniel i jego towarzysze zachowali wierność swojej wierze.", "s": "W Babilonie Judejczycy żyli jako wygnańcy, a Daniel i jego przyjaciele pełnili służbę na dworze królewskim. Jeremiasz radził wspólnocie, by budowała domy i szukała dobra miasta.", "k": ["Księga Daniela opowiada o młodych Judejczykach, którzy w Babilonie przeszli kształcenie w pałacowej szkole, lecz zachowali wierność swojej wierze. Daniel tłumaczy sny królów, trzej przyjaciele odmawiają oddania czci posągowi, a późniejsza opowieść wspomina jaskinię lwów. Jeremiasz w liście do wygnańców zachęcał ich, by budowali domy, zakładali ogrody i szukali pomyślności miasta, w którym mieszkają. Ps 137 oddaje natomiast tęsknotę nad rzekami Babilonu. Wspólnota uczyła się trwać w obcym świecie.", "Babilon leżał nad Eufratem, ok. 90 km na południe od dzisiejszego Bagdadu, na płaskiej, żyznej równinie przeciętej siecią kanałów. Wygnańców dzieliło od Jerozolimy ok. 900 km w linii prostej, czyli kilka miesięcy marszu. Eufrat zapewniał wodę dla pól i ogrodów, a równocześnie umożliwiał handel łodziami po całej Mezopotamii. Nabuchodonozor II rozbudował miasto: wzniósł Bramę Isztar i procesyjną drogę prowadzącą do świątyni Marduka. Dla przybyszów z gór Judei płaski, rzeczny krajobraz musiał być zupełnie obcy."], "j": "Rekonstrukcja artystyczna przedstawia Bramę Isztar pokrytą błyszczącymi niebieskimi cegłami glazurowanymi, ozdobioną rzędami lwów, smoków i byków. Przed nią wiedzie procesyjna droga, a w tle wznosi się schodkowa wieża świątynna, zikkurat. Po ulicach idą kupcy, kapłani i urzędnicy, a nad kanałem stoją palmy. Postaci widać z oddali, bez szczegółów twarzy. Wszystko tonie w ciepłym, kurzawym świetle południa.", "d": "Odległość Babilonu od Jerozolimy: ok. 900 km w linii prostej; od dzisiejszego Bagdadu: ok. 90 km.", "img": "img/c6m6.webp"}, {"id": "c6m7", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Rzeka Kebar", "lat": 32.1267, "lon": 45.2347, "ref": "Ez 1–3; 10; 37; 40–48", "sub": "Kanał w Babilonii, nad którym prorok Ezechiel zobaczył wizje Bożej chwały.", "s": "Ezechiel mieszkał wśród wygnańców nad kanałem Kebar i tam otrzymał powołanie prorockie. Jego wizje mówią o Bożej obecności, która nie jest ograniczona do jednego miejsca.", "k": ["Ezechiel, kapłan wywieziony do Babilonii razem z królem Jojakinem w 597 r. przed Chr., rozpoczyna swoją księgę od wizji nad rzeką Kebar. Zobaczył tam otwarte niebo, wiatr, obłok i niezwykły tron, który wskazywał na obecność Boga pośród wygnańców. Otrzymuje polecenie, by być stróżem swojego narodu, i głosi najpierw słowa sądu, a potem nadziei. Wizja doliny pełnej kości, które ożywają, jest obrazem odrodzenia wspólnoty. Księga kończy się opisem nowej Świątyni i miasta, w którym Bóg zamieszka.", "Kebar nie był rzeką w naszym rozumieniu, lecz kanałem nawadniającym odchodzącym od Eufratu. Tradycyjnie szuka się go w okolicy dawnego miasta Nippur, ok. 100 km na południowy wschód od Babilonu; lokalizacja nie jest pewna. Wygnańcy zakładali tu osady rolnicze, uprawiając pola nawadniane siecią kanałów. Dla narodu przywiązanego do Świątyni w Jerozolimie, odległej o ok. 1000 km, było to doświadczenie przełomowe: Bóg objawia się także w obcej ziemi, nad wodą, wśród zwykłych ludzi, a nie tylko w jednym miejscu."], "j": "Rekonstrukcja artystyczna przedstawia szeroki kanał z glinianymi brzegami, wysadzany palmami i wierzbami. Na brzegu stoją niskie domy z cegły suszonej i szałasy, a ludzie w prostych szatach czerpią wodę lub pracują na polach. W oddali widać zarys wielkiego miasta. Niebo jest rozległe i płaskie, co wzmacnia poczucie oddalenia od rodzinnych gór.", "d": "Kanał Kebar leżał ok. 100 km na południowy wschód od Babilonu; Jerozolima była oddalona o ok. 1000 km.", "img": null}, {"id": "c6m8", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Odbudowa Świątyni w Jerozolimie", "lat": 31.778, "lon": 35.2354, "ref": "Ezd 1–6; Ag 1–2; Za 1–8", "sub": "Pierwsi powracający stawiają ołtarz, a po latach przeszkód kończą drugą Świątynię.", "s": "Po edykcie Cyrusa wygnańcy wrócili do Jerozolimy i zaczęli odbudowę Świątyni pod wodzą Zorobabela i Jozuego. Mimo oporu sąsiadów budowa została ukończona w 516 lub 515 r. przed Chr.", "k": ["W 538 r. przed Chr. Cyrus, król Persji, pozwolił wygnańcom wrócić do Jerozolimy i odbudować Świątynię. Według Ezd 2 wyruszyło ok. 42 tysięcy ludzi pod przewodnictwem Zorobabela i arcykapłana Jozuego. Najpierw odbudowano ołtarz, potem położono fundamenty. Sąsiedzi utrudniali prace, więc budowa zamarła na lata. Prorocy Aggeusz i Zachariasz zachęcili lud do wznowienia robót za panowania Dariusza I. Świątynię ukończono i poświęcono w 516 lub 515 r. przed Chr., a wspólnota radosnie obchodziła Paschę.", "Droga powrotna z Babilonii wiodła zwykle łukiem Żyznego Półksiężyca: wzdłuż Eufratu na północny zachód, potem przez Syrię na południe, razem ok. 1400 km. Ezdrasz, który wracał kilkadziesiąt lat później, szedł według Ezd 7 około czterech miesięcy. Wracający zastali miasto w ruinie, skurczone do grzbietu Miasta Dawida i Wzgórza Świątynnego. Nowa Świątynia była skromniejsza od poprzedniej; starsi, którzy pamiętali dawny przybytek, płakali. Mimo to stała się ośrodkiem wspólnoty, która przetrwała kolejne pięć wieków."], "j": "Rekonstrukcja artystyczna ukazuje wzgórze pełne rusztowań, stosów ciosanych kamieni i bali cedrowych. Robotnicy przenoszą bloki, w tle widać ołtarz pod gołym niebem, a obok niego niski, jeszcze niedokończony budynek. Kapłani w białych szatach i lewici z instrumentami stoją przy fundamentach. Całość widać z oddali, w ciepłym świetle poranka.", "d": "Droga powrotna z Babilonii liczyła ok. 1400 km; druga Świątynia została ukończona w 516 lub 515 r. przed Chr.", "img": null}, {"id": "c6m9", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Suza", "lat": 32.19, "lon": 48.258, "ref": "Est 1–10; Ne 1,1; Dn 8,2", "sub": "Zimowa stolica perskich królów i miejsce opowieści o Esterze.", "s": "W Suzie dzieje się historia Estery, młodej Żydówki, która zostaje królową i ratuje swój lud przed zagładą. Z Suzy pochodził też Nehemiasz, podczaszy królewski.", "k": ["Księga Estery opowiada o Żydówce, która zostaje żoną króla Aswerusa, czyli zapewne Kserksesa I. Dzięki radom swojego krewnego Mordechaja odkrywa spisek wymierzony w jej lud i z odwagą staje przed królem. Plan dworzanina Hamana zostaje odwrócony, a wspólnota obchodzi to wydarzenie jako święto Purim. W Suzie rozgrywa się także początek księgi Nehemiasza: tu młody Żyd, podczaszy króla, dowiaduje się o upadku murów Jerozolimy i prosi władcę o pozwolenie na wyjazd.", "Suza leżała w żyznej równinie Chuzestanu, u stóp gór Zagros, ok. 350 km na wschód od Babilonu. Persowie uczynili z niej jedną z czterech stolic i zimową rezydencję królów, bo klimat miasta był łagodniejszy niż na wyżynie. Stąd wyruszała Droga Królewska, która łączyła Suzę z Sardes, ok. 2700 km na zachód. Dzięki niej poselstwa i rozkazy dochodziły do całego imperium. Suza leżała blisko Persepolis (ok. 500 km), a jednocześnie wystarczająco blisko Mezopotamii, aby kontrolować ruchliwe, bogate prowincje."], "j": "Rekonstrukcja artystyczna ukazuje pałac z potężnymi kolumnami o kapitelach w kształcie byków, wysokimi tarasami i ścianami z glazurowanej cegły, na której widnieją procesje gwardzistów. Na dziedzińcu stoją dworzanie w długich szatach, a w tle ciągną się ogrody i mury cytadeli. Postaci widać z oddali lub od tyłu, w ciepłym, złotym świetle popołudnia.", "d": "Suza leżała ok. 350 km na wschód od Babilonu; Droga Królewska z Sardes miała ok. 2700 km długości.", "img": "img/c6m9.webp"}, {"id": "c6m10", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Persepolis", "lat": 29.9355, "lon": 52.8916, "ref": "Ezd 1,1–4; 6,1–12; Est 1,1–3", "sub": "Uroczysta stolica imperium perskiego, które pozwoliło Żydom wrócić.", "s": "Biblia nie wymienia Persepolis z nazwy, lecz opisuje państwo, którego było ono symbolem. Dzięki polityce perskich królów wygnańcy mogli wrócić do ojczyzny.", "k": ["Persepolis nie występuje w tekście biblijnym, ale pokazuje świat, w którym działają Ezdrasz, Nehemiasz i Estera. Perscy królowie, od Cyrusa po Artakserksesa, rządzili ogromnym imperium od Indii po Egipt. Ezd 1 i 6 opisują dekrety, które pozwoliły na odbudowę Świątyni i pokrycie kosztów z kasy królewskiej. Historycy dyskutują, jak daleko sięgała perska polityka tolerancji, lecz dokumenty z epoki wskazują, że władcy zwykle szanowali lokalne kulty. Dzięki temu Judejczycy mogli odtworzyć swoją wspólnotę wokół Świątyni.", "Persepolis założył około 518 r. przed Chr. Dariusz I na równinie Marvdasht w górach Zagros, ok. 500 km na południowy wschód od Suzy, w sercu perskiej prowincji Parsa. Było to miasto uroczyste, nie handlowe: tu witano poselstwa z całego imperium w święto nowego roku. Schody Apadany zdobią reliefy przedstawiające delegacje składające dary. Dzięki sieci dróg, w tym Drogi Królewskiej, namiestnicy z odległych prowincji, także z Judei, mogli utrzymywać łączność z władcą. Pałace spłonęły w 330 r. przed Chr., po najeździe Aleksandra Wielkiego."], "j": "Rekonstrukcja artystyczna pokazuje wysoki taras z kamienia, na który prowadzą szerokie schody dekorowane płaskorzeźbami procesji. Na platformie wznosi się las smukłych kolumn zwieńczonych głowami byków i lwów, a przed Bramą Wszystkich Narodów stoją potężne skrzydlate byki. W tle widać równinę i skaliste zbocza, a delegaci w różnorodnych strojach zmierzają ku schodom.", "d": "Persepolis leżało ok. 500 km na południowy wschód od Suzy; pałace spalono w 330 r. przed Chr.", "img": null}, {"id": "c6m11", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Mury Nehemiasza", "lat": 31.7745, "lon": 35.234, "ref": "Ne 1–7; 12,27–43", "sub": "Odbudowa murów Jerozolimy w ciągu zaledwie kilkudziesięciu dni.", "s": "Nehemiasz wrócił z Suzy do Jerozolimy i zorganizował odbudowę murów, dzieląc pracę na odcinki. Mimo wrogości sąsiadów zadanie ukończono w 52 dni.", "k": ["Nehemiasz, podczaszy króla Artakserksesa, usłyszał w Suzie o zrujnowanych murach Jerozolimy i poprosił króla o zgodę na wyjazd. Około 445 r. przed Chr. dotarł do miasta, nocą objechał ruiny i wezwał mieszkańców do odbudowy. Księga wylicza, kto budował który odcinek i która brama przypadła której rodzinie. Wrogowie, Sanballat, Tobiasz i Geszem, szydzili, grozili i układali spiski, więc robotnicy pracowali z narzędziem w jednej ręce i orężem w drugiej. Według Ne 6,15 mury ukończono w 52 dni.", "Jerozolima tej epoki była mniejsza niż za czasów Ezechiasza. Mury obejmowały głównie grzbiet Miasta Dawida i Wzgórze Świątynne, na których mieszkała garstka rodzin. Nehemiasz musiał łatać wyłomy w starych linach obronnych, korzystając z leżących wszędzie kamieni. Księga wylicza ok. dziesięciu bram: Owczą, Rybną, Starą, Dolinną, Gnojną, Źródlaną, Wodną i Końską. Podział pracy według odcinków, z każdą grupą budującą przy swoim domu, pozwolił zakończyć dzieło szybko. Zadanie osłabiał ciągły lęk przed atakiem ze strony sąsiadów."], "j": "Rekonstrukcja artystyczna ukazuje stok wzgórza, na którym tłum ludzi układa kamienne bloki w nowym murze. Jedni niosą kosze z gruzem, inni wspinają się po drewnianych rusztowaniach, a na wieżyczkach stoją strażnicy z włóczniami. Z tyłu widać ruiny starych domów, a w oddali zarys Wzgórza Świątynnego. Postaci przedstawiono z daleka, w świetle wczesnego poranka.", "d": "Odbudowa murów trwała 52 dni (Ne 6,15); dzieło ukończono około 445 r. przed Chr.", "img": "img/c6m11.webp"}, {"id": "c6m12", "c": 6, "ct": "Prorocy, wygnanie i powrót", "n": "Brama Wodna i czytanie Prawa", "lat": 31.7725, "lon": 35.237, "ref": "Ne 8–10; Ezd 7–10", "sub": "Wspólnota gromadzi się na placu, by słuchać Prawa i odnowić przymierze.", "s": "Ezdrasz odczytał Prawo wobec całego ludu zebranego na placu przed Bramą Wodną. Wspólnota świętowała Święto Namiotów i potwierdziła przymierze z Bogiem.", "k": ["Gdy mury były gotowe, cały lud zgromadził się na placu przed Bramą Wodną i poprosił Ezdrasza o odczytanie księgi Prawa. Ezdrasz stanął na drewnianym podwyższeniu, a lewici tłumaczyli i wyjaśniali tekst, by wszyscy rozumieli. Słuchacze płakali, ale Nehemiasz i Ezdrasz przypomnieli im, że ten dzień jest świętem. Następnie obchodzono Święto Namiotów, mieszkając w szałasach z gałęzi. Potem wspólnota publicznie odnowiła przymierze i zobowiązała się do wierności, w tym do wspierania Świątyni.", "Brama Wodna prowadziła w stronę źródła Gichon, jedynego stałego źródła Jerozolimy, w dolnej części Miasta Dawida. Obszar przed nią był otwartym placem, na którym mogły się zebrać tysiące osób, w tym mężczyźni, kobiety i dzieci zdolne rozumieć. Ezdrasz przybył do Jerozolimy ok. czterech miesięcy po wyjściu z Babilonii, najprawdopodobniej w 458 r. przed Chr., choć niektórzy badacze proponują inną datę. Czytanie trwało od świtu do południa i przekształciło odbudowane miasto w wspólnotę ukształtowaną przez słuchanie słowa."], "j": "Rekonstrukcja artystyczna pokazuje szeroki plac pod gołym niebem, zapełniony tłumem w prostych szatach. Na drewnianym podium stoi postać z rozwiniętym zwojem, a obok niej lewici i kapłani. W tle wznosi się nowo odbudowany mur z bramą, a dachy domów pokrywają gałęzie przygotowane na Święto Namiotów. Całość oświetla jasne, poranne światło.", "d": "Czytanie Prawa trwało od świtu do południa (Ne 8,3); Ezdrasz podróżował do Jerozolimy ok. 4 miesięcy.", "img": null}, {"id": "c7m1", "c": 7, "ct": "Świat Jezusa", "n": "Betlejem", "lat": 31.7054, "lon": 35.2024, "ref": "Mt 2; Łk 2,1–20", "sub": "Miasto Dawida, w którym narodził się Jezus.", "s": "Z powodu spisu ludności Józef i Maryja przybywają do Betlejem, gdzie rodzi się Jezus. Pasterze z okolicy pierwsi słyszą radosną nowinę, a później do dziecka przybywają mędrcy ze Wschodu.", "k": ["Ewangelie opowiadają, że Józef, potomek rodu Dawida, wyruszył z Nazaretu do Betlejem, aby dać się zapisać w spisie ludności. Tam Maryja urodziła Syna i położyła Go w żłobie, bo dla nich nie było miejsca w gospodzie. Noc tę usłyszeli pasterze strzegący stad na okolicznych polach i poszli zobaczyć dziecko. Później, według Mateusza, przybyli mędrcy ze Wschodu, kierowani gwiazdą, i złożyli dary. Śmiertelne zagrożenie ze strony króla Heroda zmusiło rodzinę do ucieczki do Egiptu.", "Betlejem leży ok. 8 km na południe od Jerozolimy, na grzbiecie wzgórz wznoszącym się ok. 770 m n.p.m. Wokół rozciągają się pastwiska schodzące ku pustyni Judzkiej, idealne dla stad owiec, co dobrze tłumaczy obecność pasterzy. Droga z Galilei trwała zwykle kilka dni i prowadziła doliną Jordanu lub przez Samarię. Bliskość stolicy tłumaczy, dlaczego wieść o narodzinach dotarła do Heroda. Starożytna tradycja wskazuje grotę pod dzisiejszą Bazyliką Narodzenia jako miejsce narodzin Jezusa, czczone od wczesnych wieków chrześcijaństwa."], "j": "Za czasów Jezusa Betlejem było niewielką osadą rolniczą o kamiennych domach z płaskimi dachami. Wiele z nich opierało się o naturalne groty, używane jako stajnie i spiżarnie. Na zboczach pasły się stada, a wieczorem powietrze szybko stawało się chłodne. Był to raczej cichy zakątek niż tętniące życiem miasto (rekonstrukcja artystyczna).", "d": "Odległość z Betlejem do Jerozolimy: ok. 8 km; wysokość ok. 770 m n.p.m.", "img": "img/c7m1.webp"}, {"id": "c7m2", "c": 7, "ct": "Świat Jezusa", "n": "Nazaret", "lat": 32.6996, "lon": 35.3035, "ref": "Łk 1,26–38; 2,39–52; Mt 2,23", "sub": "Miasteczko dzieciństwa i młodości Jezusa.", "s": "W Nazarecie Maryja usłyszała zwiastowanie, a Jezus dorastał w rodzinie Józefa. Tutaj rozpoczął też publiczne nauczanie w synagodze.", "k": ["Według Łukasza to właśnie w Nazarecie anioł Gabriel zwiastował Maryi, że pocznie Syna. Po powrocie z Egiptu rodzina osiadła w tym miasteczku i tam Jezus dorastał, wzrastając w mądrości, jak podaje Łukasz. Józef pracował jako cieśla, a Jezus znany był mieszkańcom jako syn cieśli. Gdy po latach wrócił do Nazaretu już jako nauczyciel, przemówił w synagodze, odczytując fragment proroka Izajasza, ale spotkał się z niedowierzaniem współziomków (Łk 4,16–30).", "Nazaret leży w dolnej Galilei, w niecce otoczonej wzgórzami, na wysokości ok. 350 m n.p.m. Nie było to ważne miasto, a Stary Testament w ogóle o nim nie wspomina, co tłumaczy sceptyczne pytanie o to, czy z Nazaretu może wyjść coś dobrego (J 1,46). Mimo to miasteczko leżało blisko ruchliwych szlaków. Zaledwie kilka kilometrów dalej znajdowało się Seforis, wówczas odbudowywana stolica regionu, gdzie rzemieślnicy mogli znaleźć pracę. Dzięki temu Jezus dorastał w środowisku otwartym na świat."], "j": "Nazaret w I wieku był niewielką wsią liczącą zapewne kilkaset mieszkańców. Domy z nieoszlifowanego kamienia i gliny stały wśród tarasów z oliwkami, winoroślą i zbożem. Wąskie uliczki prowadziły do studni i do prostej synagogi. Dzieci pomagały przy zwierzętach i w polu (rekonstrukcja artystyczna).", "d": "Wysokość: ok. 350 m n.p.m.; odległość do Jeziora Galilejskiego: ok. 30 km.", "img": null}, {"id": "c7m3", "c": 7, "ct": "Świat Jezusa", "n": "Jordan i Betania za Jordanem", "lat": 31.8372, "lon": 35.5517, "ref": "Mk 1,1–11; J 1,28; Mt 3,13–17", "sub": "Miejsce chrztu Jezusa i początek Jego publicznej działalności.", "s": "Nad Jordanem Jan Chrzciciel wzywał do nawrócenia, a Jezus przyjął od niego chrzest. Ewangelie opisują otwarte niebo i głos Ojca.", "k": ["Jan Chrzciciel głosił nad Jordanem nawrócenie, a ludzie z całej Judei i Jerozolimy przychodzili, by wyznać grzechy i przyjąć chrzest. Wśród nich przyszedł Jezus z Nazaretu. Ewangelie zgodnie opowiadają, że po chrzcie otworzyło się niebo, Duch zstąpił na Niego jak gołębica, a głos Ojca potwierdził, że jest umiłowanym Synem. Ewangelia Jana wymienia miejsce chrztu jako Betanię za Jordanem, czyli po wschodniej stronie rzeki. Był to początek publicznej misji Jezusa.", "Jordan płynie w głębokim rowie tektonicznym, a okolice Jerycha leżą ponad 250 m poniżej poziomu morza, w jednym z najgłębszych miejsc na ziemi. Rzeka w dolnym biegu jest wąska, kręta, otoczona gęstą roślinnością, co sprzyjało zgromadzeniom na odludziu, z dala od miast. Miejsce było dogodne także dlatego, że niedaleko przebiegała ważna droga z Jerycha do wschodnich krain. Dzisiejsze stanowisko Al-Maghtas, uznawane tradycyjnie za Betanię za Jordanem, leży ok. 9 km od Morza Martwego."], "j": "Rzeka miała wówczas kolor mętnej zieleni, a brzegi porastały trzciny, wierzby i tamaryszki. Wśród roślinności siedzieli ludzie czekający na swoją kolej, z dala od hałasu miasta. Powietrze było gorące i wilgotne, a w tle widać było pustynne wzgórza (rekonstrukcja artystyczna).", "d": "Wysokość: ok. 250–400 m poniżej poziomu morza; do Morza Martwego: ok. 9 km.", "img": null}, {"id": "c7m4", "c": 7, "ct": "Świat Jezusa", "n": "Pustynia Judzka", "lat": 31.8737, "lon": 35.4283, "ref": "Mt 4,1–11; Mk 1,12–13; Łk 4,1–13", "sub": "Czterdzieści dni postu i pokusy na pustkowiu.", "s": "Po chrzcie Duch wyprowadził Jezusa na pustynię, gdzie przez czterdzieści dni pościł i został poddany pokusom. Tradycja wskazuje górę Kuruntul nad Jerychem.", "k": ["Zaraz po chrzcie Jezus został pokierowany przez Ducha na pustynię. Ewangelie mówią o czterdziestu dniach postu i trzech pokusach: chleba, cudownego znaku i władzy nad królestwami świata. Za każdym razem Jezus odpowiada, odwołując się do Pisma. Czterdzieści dni przywołuje czterdzieści lat wędrówki Izraela po pustyni, ale tam, gdzie lud zawiódł, Jezus pozostaje wierny. Dla chrześcijan ta scena jest do dziś wzorem Wielkiego Postu.", "Pustynia Judzka zajmuje wąski pas między grzbietem Judei a Morzem Martwym. Rozciąga się na ok. 100 km długości i ok. 25 km szerokości, a opady są tu symboliczne. Teren jest poprzecinany głębokimi wąwozami, jaskiniami i klifami, co sprzyjało pustelnikom. Według tradycji miejscem pokus była góra Kuruntul (łac. Quarantana) nad Jerychem, wznosząca się ok. 350 m ponad miastem. To lokalizacja tradycyjna, bo Ewangelie nie wskazują konkretnego szczytu."], "j": "Pustynia to krajobraz z odcieniami beżu i ochry: kamieniste wzgórza, wąwozy i urwiska bez śladu zieleni. W dzień panuje upał, w nocy chłód. Cisza jest niemal całkowita, przerywana tylko szumem wiatru. Z wysokich skał widać błyszczące w dole Morze Martwe (rekonstrukcja artystyczna).", "d": "Długość pustyni Judzkiej: ok. 100 km; góra Kuruntul: ok. 350 m ponad Jerychem.", "img": null}, {"id": "c7m5", "c": 7, "ct": "Świat Jezusa", "n": "Kana Galilejska", "lat": 32.7467, "lon": 35.3397, "ref": "J 2,1–12; J 4,46–54", "sub": "Wesele, na którym Jezus uczynił pierwszy znak.", "s": "Podczas wesela w Kanie Maryja zwróciła uwagę, że zabrakło wina, a Jezus przemienił wodę w wino. Ewangelista nazywa to początkiem Jego znaków.", "k": ["Ewangelia Jana opowiada o weselu w Kanie, na które zaproszono Jezusa, Jego Matkę i uczniów. Gdy zabrakło wina, Maryja zwróciła się do Syna, a sług poleciła słuchać Jego słów. Jezus kazał napełnić wodą sześć kamiennych stągwi, a gdy woda została zaczerpnięta, okazała się winem wybornej jakości. Jan nazywa to początkiem znaków, który objawił chwałę Jezusa i umocnił wiarę uczniów. Do Kany Jezus wrócił później, by uzdrowić syna urzędnika królewskiego.", "Tradycyjnie utożsamia się Kanę z Kafr Kanna, ok. 6 km na północny wschód od Nazaretu, przy drodze prowadzącej do jeziora. Archeolodzy proponowali też stanowisko Chirbet Kana, kilka kilometrów na północ, ale to pozostaje dyskusją specjalistów. Położenie tłumaczy, dlaczego Jezus mógł z łatwością podróżować stąd do Kafarnaum: droga w dół, ku jezioru, prowadziła ok. 25 km i opadała o ponad 500 m. Weselne uroczystości trwały zwykle kilka dni, a wino było ważną częścią gościnności."], "j": "Galilejska wieś z niewielkimi domami z kamienia otaczały tarasowe winnice i gaje oliwne. Na weselnym podwórku stały kamienne stągwie służące do rytualnych obmyć. Goście zasiadali na dywanach, a dzieci biegały między stołami. Wieczorem wnętrze rozświetlały lampy oliwne (rekonstrukcja artystyczna).", "d": "Odległość z Kany do Nazaretu: ok. 6 km; do Kafarnaum: ok. 25 km.", "img": null}, {"id": "c7m6", "c": 7, "ct": "Świat Jezusa", "n": "Kafarnaum", "lat": 32.8808, "lon": 35.575, "ref": "Mk 1,21–34; Mk 2,1–12; Mt 4,13", "sub": "Miasto Jezusa nad północnym brzegiem jeziora.", "s": "Po odejściu z Nazaretu Jezus uczynił Kafarnaum swoim ośrodkiem nauczania. Tutaj przebywał w domu Piotra, nauczał w synagodze i uzdrawiał chorych.", "k": ["Mateusz pisze, że Jezus opuścił Nazaret i zamieszkał w Kafarnaum nad jeziorem. W tym mieście powołał celnika Mateusza, uzdrowił teściową Piotra, nauczał w synagodze, a do jego domu tłumy przychodziły tak licznie, że przyjaciele sparaliżowanego mężczyzny rozebrali dach, by spuścić chorego do środka (Mk 2,1–12). Wielu rybaków, którzy zostali uczniami, mieszkało właśnie tutaj. Dlatego miasto bywa nazywane Jego własnym miastem (Mt 9,1).", "Kafarnaum leżało na północnym brzegu Jeziora Galilejskiego, na skrzyżowaniu dróg łączących Galileę z Syrią i wybrzeżem. Przebiegała tędy Via Maris, więc istniał tam urząd celny i stacjonowali żołnierze, tacy jak setnik z Łk 7. Poziom jeziora znajduje się ok. 210 m poniżej poziomu morza. Wykopaliska odsłoniły czarne bazaltowe domy i późniejszą, białą synagogę z wapienia. Pod nią znaleziono starsze bazaltowe mury, a pod ośmiokątnym kościołem szczątki domu, który tradycja łączy z Piotrem."], "j": "Miasteczko tworzyły niskie domy z ciemnego bazaltu, ciasno ustawione wokół wspólnych dziedzińców. Dachy z gałęzi i gliny były płaskie, a na brzegu suszyły się sieci. Przy przystani stały łodzie rybackie, a nad całością górowały wzgórza Golanu (rekonstrukcja artystyczna).", "d": "Poziom jeziora: ok. 210 m poniżej poziomu morza; liczba mieszkańców w I w.: ok. 1000–1500.", "img": null}, {"id": "c7m7", "c": 7, "ct": "Świat Jezusa", "n": "Jezioro Galilejskie: Magdala, Betsaida i Tyberiada", "lat": 32.82, "lon": 35.58, "ref": "Mk 4,35–41; Mk 6,45–52; J 6,1–21; Łk 8,2", "sub": "Jezioro, na którym Jezus uciszył burzę i nakarmił tłumy.", "s": "Wokół jeziora rozgrywa się wiele scen Ewangelii: powołanie rybaków, uciszenie burzy i chodzenie po wodzie. Na brzegach leżały Magdala, Betsaida i Tyberiada.", "k": ["Nad Jeziorem Galilejskim Jezus powołał pierwszych uczniów, Szymona, Andrzeja, Jakuba i Jana, którzy łowili ryby. Z łodzi nauczał tłumy, a podczas rejsu uciszył gwałtowną burzę, pytając uczniów o ich wiarę. Nad jeziorem miały też miejsce rozmnożenie chleba i ryb oraz kroczenie po wodzie. Magdala była rodzinnym miastem Marii Magdaleny, Betsaida miastem Piotra, Andrzeja i Filipa, a Tyberiada, założona przez Heroda Antypasa, nosiła imię cesarza, o którym Ewangelie wspominają tylko krótko.", "Jezioro ma ok. 21 km długości i ok. 13 km szerokości, a leży ok. 210 m poniżej poziomu morza w otoczeniu wzgórz. Zimne powietrze znad Hermonu potrafi spływać w dół ku wodzie, wywołując nagłe, gwałtowne burze, co dobrze tłumaczy scenę z Ewangelii. Magdala leżała na zachodnim brzegu, Tyberiada nieco na południe, a Betsaida przy ujściu Jordanu na północnym wybrzeżu. Łodzie rybackie pływały w nocy, bo wtedy ryb było więcej, a kilka miast wokół jeziora żyło z połowów."], "j": "Łodzie miały niskie burty i jeden żagiel, a rybacy wyciągali sieci, myli je i naprawiali o świcie. Woda bywała wyjątkowo spokojna i granatowa, ale w kilka chwil mogła pokryć się falami. Za nimi unosiły się szczyty wzgórz Golanu, a wieczorem na brzegach błyskały ogniska (rekonstrukcja artystyczna).", "d": "Długość jeziora: ok. 21 km; szerokość: ok. 13 km; poziom: ok. 210 m poniżej poziomu morza.", "img": null}, {"id": "c7m8", "c": 7, "ct": "Świat Jezusa", "n": "Samaria i Sychar", "lat": 32.2131, "lon": 35.2815, "ref": "J 4,1–42", "sub": "Rozmowa Jezusa z Samarytanką przy studni Jakuba.", "s": "W drodze z Judei do Galilei Jezus zatrzymał się przy studni w Sychar i rozmawiał z Samarytanką. Wiele osób z miasta uwierzyło po tym spotkaniu.", "k": ["Ewangelia Jana opowiada, że Jezus, zmęczony drogą, usiadł przy studni Jakuba w samarytańskim mieście Sychar, w samo południe. Poprosił o wodę kobietę, która przyszła ją zaczerpnąć. To zaskakiwało, ponieważ Żydzi i Samarytanie rzadko się spotykali. Rozmowa dotyczyła wody żywej, prawdziwego kultu i oczekiwania na Mesjasza. Kobieta opowiedziała o Nim mieszkańcom miasta, a wielu z nich uwierzyło i zaprosiło Go, by został dwa dni.", "Samaria leżała między Judeą a Galileą. Najkrótsza droga z Jerozolimy do Nazaretu liczyła ok. 100 km i przecinała właśnie ten region, choć wielu Żydów wybierało dłuższą trasę wzdłuż Jordanu, by unikać wrogości. Sychar utożsamia się zwykle z okolicą dzisiejszego Askaru, u stóp góry Garizim, która dla Samarytan była świętą górą kultu. Studnia Jakuba, głęboka na ok. 35 m, jest do dziś rozpoznawalnym miejscem. To lokalizacja tradycyjna, silnie oparta na przekazie starożytnych pielgrzymów."], "j": "U podnóża góry Garizim rozciągała się żyzna dolina z polami pszenicy. Studnia była otwarta, otoczona kamiennym obmurowaniem, z którego zaczerpywano wodę skórzanym wiadrem. W południe panował upał, a okolica pozostawała niemal pusta. W oddali widać było osadę (rekonstrukcja artystyczna).", "d": "Głębokość studni Jakuba: ok. 35 m; odległość z Jerozolimy do Nazaretu przez Samarię: ok. 100 km.", "img": null}, {"id": "c7m9", "c": 7, "ct": "Świat Jezusa", "n": "Cezarea Filipowa i góra Przemienienia", "lat": 33.2487, "lon": 35.6942, "ref": "Mt 16,13–20; Mt 17,1–9; Mk 9,2–10", "sub": "Wyznanie Piotra u źródeł Jordanu i objawienie chwały na górze.", "s": "Koło Cezarei Filipowej Piotr wyznał, że Jezus jest Mesjaszem. Kilka dni później Jezus przemienił się przed Piotrem, Jakubem i Janem na wysokiej górze.", "k": ["W okolicach Cezarei Filipowej Jezus zapytał uczniów, za kogo uważają Go ludzie, a następnie, za kogo uważają Go oni sami. Piotr odpowiedział, że jest Mesjaszem, Synem Boga żywego, a Jezus powierzył mu szczególną misję w Kościele (Mt 16,13–20). Po kilku dniach zabrał Piotra, Jakuba i Jana na wysoką górę, gdzie jego oblicze zajaśniało, a obok ukazali się Mojżesz i Eliasz. Głos z obłoku wskazał na Jezusa jako umiłowanego Syna.", "Cezarea Filipowa leży u podnóża Hermonu, przy źródłach Banias, jednych z głównych źródeł Jordanu, ok. 350 m n.p.m. Była miastem wzniesionym przez tetrarchę Filipa i poświęconym cesarzowi, z grotą kultu boga Pana. Ewangelie nie podają nazwy góry Przemienienia. Tradycja chrześcijańska od wieków wskazuje Tabor w dolnej Galilei (ok. 588 m n.p.m.), ale część badaczy wymienia Hermon (ok. 2814 m n.p.m.). Ta lokalizacja pozostaje przedmiotem dyskusji, dlatego mówimy o tradycji."], "j": "Przy Banias woda wypływała spod ściany skalnej, w której wykuto nisze dla posągów. Okolicę porastały drzewa i krzewy, a powietrze było chłodniejsze niż nad jeziorem. Tabor wznosi się samotnie nad równiną Jezreel jak kopuła, a ze szczytu widać pola, wzgórza i odległe góry (rekonstrukcja artystyczna).", "d": "Tabor: ok. 588 m n.p.m.; Hermon: ok. 2814 m n.p.m.; Cezarea Filipowa: ok. 350 m n.p.m.", "img": null}, {"id": "c7m10", "c": 7, "ct": "Świat Jezusa", "n": "Jerycho", "lat": 31.8714, "lon": 35.444, "ref": "Mk 10,46–52; Łk 19,1–10", "sub": "Ostatni przystanek przed wejściem na Jerozolimę.", "s": "W Jerychu Jezus uzdrowił niewidomego Bartymeusza i przyjął w swoim domu celnika Zacheusza. Stąd zaczynała się wspinaczka do Jerozolimy.", "k": ["Gdy Jezus zbliżał się do Jerozolimy, w Jerychu spotkał dwie osoby. Niewidomy żebrak Bartymeusz wołał do niego z wiarą i odzyskał wzrok. Zacheusz, zwierzchnik celników, niski wzrostem, wspiął się na sykomorę, by zobaczyć Jezusa, a ten zaprosił się do jego domu. Zacheusz obiecał oddać połowę majątku ubogim i zwrócić poczwórnie to, co wyłudził. Jezus oznajmił, że zbawienie weszło w jego dom, bo przyszedł szukać i zbawiać to, co zginęło.", "Jerycho leży ok. 250 m poniżej poziomu morza i jest jednym z najstarszych miast świata, ale za czasów Jezusa życie koncentrowało się w nowym ośrodku Heroda, kilka kilometrów od starego tellu. Ciepły klimat pozwalał uprawiać palmy i balsam, a miasto było bogate i miało punkt poboru ceł. Stąd do Jerozolimy wiodła kamienista droga długości ok. 27 km, w górę o ok. 1000 m. Była uznawana za niebezpieczną i to w jej okolicy rozgrywa się przypowieść o dobrym Samarytaninie."], "j": "Jerycho było zielonym oazą na pustyni. Wokół wznosiły się gaje palmowe, ogrody i pałace, zasilane wodą z licznych źródeł. Karawany zatrzymywały się tu przed trudną drogą pod górę. Za miastem zaczynały się nagie, brązowe stoki Judei (rekonstrukcja artystyczna).", "d": "Odległość z Jerycha do Jerozolimy: ok. 27 km; różnica wysokości: ok. 1000 m.", "img": null}, {"id": "c7m11", "c": 7, "ct": "Świat Jezusa", "n": "Jerozolima: Świątynia Heroda i sadzawka Betesda", "lat": 31.778, "lon": 35.2354, "ref": "Mk 11,15–17; J 2,13–22; J 5,1–15", "sub": "Serce Izraela: Świątynia i sadzawka, przy której Jezus uzdrowił chorego.", "s": "Jezus często przychodził do Świątyni na święta i nauczał na jej dziedzińcach. W pobliżu, przy sadzawce Betesda, uzdrowił człowieka chorego od trzydziestu ośmiu lat.", "k": ["Jezus przybywał do Jerozolimy na święta pielgrzymie, takie jak Pascha. Nauczał na dziedzińcach Świątyni, a podczas jednej z wizyt wypędził stamtąd handlarzy, mówiąc, że dom Boży ma być domem modlitwy. W pobliżu, przy sadzawce Betesda, spotkał człowieka leżącego tam od trzydziestu ośmiu lat, który nie miał nikogo, kto mógłby go wprowadzić do wody. Jezus kazał mu wstać i iść, co zbiegło się z szabatem i wywołało spór (J 5,1–15).", "Świątynię rozbudował Herod Wielki na ogromnym podwyższonym placu o powierzchni ok. 14 ha, wspartym masywnymi murami. Do dziś zachowała się jej zachodnia ściana, czczona przez Żydów. Plac górował nad doliną Cedronu na wschodzie, więc budowla była widoczna z daleka, także z Góry Oliwnej. Sadzawka Betesda leżała tuż na północ od Świątyni, w pobliżu Bramy Owczej, a wykopaliska odsłoniły dwa duże baseny z portykami. Ta identyfikacja jest dziś szeroko przyjęta."], "j": "Świątynia lśniła kamieniem w kolorze miodu i złotem na frontonie budynku sanktuarium. Dziedzińce wypełniali pielgrzymi, kapłani i kupcy. Szerokie schody prowadziły do bram, a kolumnady dawały cień. Nieopodal sadzawka z portykami tętniła życiem chorych szukających ulgi (rekonstrukcja artystyczna).", "d": "Powierzchnia placu Świątyni: ok. 14 ha; wysokość murów oporowych: ponad 30 m.", "img": null}, {"id": "c7m12", "c": 7, "ct": "Świat Jezusa", "n": "Getsemani, Golgota i droga do Emaus", "lat": 31.7784, "lon": 35.2296, "ref": "Mk 14,32–42; J 19,16–42; Łk 24,13–35", "sub": "Ogród modlitwy, wzgórze krzyża i pusty grób.", "s": "W Ogrodzie Oliwnym Jezus modlił się przed pojmaniem, a na Golgocie został ukrzyżowany i złożony w grobie. W niedzielę zmartwychwstania ukazał się uczniom w drodze do Emaus.", "k": ["Po Ostatniej Wieczerzy Jezus udał się z uczniami do ogrodu zwanego Getsemani u stóp Góry Oliwnej, gdzie modlił się w udręce, prosząc Ojca o wypełnienie Jego woli. Tam został pojmany, osądzony i skazany. Poniósł krzyż na wzgórze zwane Golgotą, gdzie został ukrzyżowany. Józef z Arymatei złożył Jego ciało w nowym grobie w pobliskim ogrodzie. Trzeciego dnia grób okazał się pusty, a Zmartwychwstały ukazał się uczniom, między innymi dwóm wędrowcom w drodze do Emaus.", "Getsemani leży po wschodniej stronie doliny Cedronu, naprzeciw Świątyni, na zboczu Góry Oliwnej wznoszącej się ok. 800 m n.p.m. Golgota znajdowała się w czasach Jezusa poza murami miasta, w dawnym kamieniołomie, dziś w obrębie Bazyliki Grobu Pańskiego. Starożytna tradycja i wykopaliska pozwalają łączyć to miejsce z ukrzyżowaniem i pochowaniem. Lokalizacja Emaus jest sporna, wymienia się m.in. Abu Gosz i Latrun, ok. 11 km od Jerozolimy, wedle opisu Łukasza ok. 60 stadiów."], "j": "Getsemani to gaj starych drzew oliwnych, w którym nocą panuje półmrok rozświetlany tylko pochodniami. Golgota była skalistym wzgórzem przy murach, z którego widać drogę wiodącą do bramy. Ogród z grobem wykutym w skale znajdował się tuż obok, a poranek wielkanocny przyniósł w nim ciszę i światło (rekonstrukcja artystyczna).", "d": "Odległość z Getsemani do Golgoty: ok. 1 km; Emaus (wedle Łukasza): ok. 60 stadiów, czyli ok. 11 km od Jerozolimy.", "img": null}, {"id": "c8m1", "c": 8, "ct": "Pierwotny Kościół", "n": "Góra Oliwna – miejsce pożegnania", "lat": 31.7787, "lon": 35.245, "ref": "Dz 1,1–14", "sub": "Stąd uczniowie obserwują odejście Jezusa i wracają do miasta.", "s": "Po czterdziestu dniach spotkań ze Zmartwychwstałym uczniowie stoją na Górze Oliwnej, gdzie otrzymują obietnicę mocy z wysoka. Potem schodzą do Jerozolimy i trwają razem na modlitwie.", "k": ["Księga Dziejów zaczyna się od krótkiego przypomnienia: przez czterdzieści dni Jezus ukazywał się uczniom i mówił im o królestwie Bożym. Potem zapowiedział, że otrzymają Ducha Świętego i staną się świadkami. Gdy to powiedział, został uniesiony, a obłok zasłonił go przed ich wzrokiem. Dwaj mężowie w bieli przypomnieli, że nie należy stać i wpatrywać się w niebo. Apostołowie wrócili do miasta, weszli do górnej izby i wraz z kobietami, Maryją i krewnymi Jezusa trwali na wspólnej modlitwie.", "Góra Oliwna to wapienny grzbiet na wschód od Jerozolimy, wznoszący się ok. 80–100 m ponad Wzgórze Świątynne i oddzielony od niego głęboką Doliną Cedronu. Łukasz podaje, że do miasta stąd jest tylko tyle, ile wolno przejść w szabat, czyli ok. 1 km według późniejszej miary żydowskiej. Dla uczniów oznaczało to krótki powrót ścieżką wijącą się wśród gajów oliwnych. Widok ze szczytu obejmuje całe miasto z Świątynią, co nadaje scenie wymiar symboliczny: stąd poselstwo wyruszy ku światu."], "j": "Rekonstrukcja artystyczna: łagodne, kamieniste zbocze porośnięte starymi drzewami oliwnymi, poprzecinane tarasami i wąskimi ścieżkami. Poniżej, za Doliną Cedronu, wznosi się jasny kompleks Świątyni z błyszczącymi złoconymi elementami, a w tle zwarta zabudowa Jerozolimy. Powietrze jest suche, światło poranne, a wzgórza Judei rysują się w dali. Pielgrzymi i pasterze z małymi stadami to drobne postacie, które nadają miejscu codzienny rytm.", "d": "Wysokość szczytu Góry Oliwnej: ok. 810 m n.p.m.; do Wzgórza Świątyni w linii prostej ok. 0,6 km.", "img": null}, {"id": "c8m2", "c": 8, "ct": "Pierwotny Kościół", "n": "Wieczernik – Zesłanie Ducha Świętego", "lat": 31.7717, "lon": 35.2296, "ref": "Dz 1,13–2,47", "sub": "W górnej izbie rodzi się wspólnota, która rusza do ludzi ze wszystkich narodów.", "s": "W święto Pięćdziesiątnicy uczniowie zgromadzeni w jednym miejscu doświadczają zstąpienia Ducha Świętego. Przemówienie Piotra przekonuje tysiące pielgrzymów, a nowa wspólnota żyje nauką apostołów, łamaniem chleba i dzieleniem się dobrami.", "k": ["Pięćdziesiąt dni po Paschy Jerozolima znów wypełnia się pielgrzymami, bo przypada święto Tygodni. Uczniowie są razem w jednym miejscu, gdy rozlega się szum jakby gwałtownego wiatru, a nad każdym z nich ukazują się języki jakby z ognia. Zaczynają mówić w różnych językach, a zebrani obcokrajowcy rozumieją głoszone wielkie dzieła Boże. Piotr staje z Jedenastoma i wyjaśnia, co się dzieje, odwołując się do Pisma. Tego dnia dołącza ok. trzech tysięcy osób, a wspólnota trwa na nauce, modlitwie, łamaniu chleba i wzajemnej pomocy.", "Tradycja chrześcijańska wiąże te wydarzenia z Wieczernikiem na Wzgórzu Syjon, w południowo-zachodniej części starożytnej Jerozolimy. Samo miejsce jest identyfikowane tradycyjnie, a obecny budynek pochodzi ze średniowiecza. Wzgórze leży ok. 750 m n.p.m., niewiele ponad kilometr od Świątyni, więc pielgrzymi mogli szybko zebrać się wokół apostołów. Wymienieni przez Łukasza słuchacze, od Partów i Medów po Rzymian, pokazują, jak dalekie szlaki prowadziły do Jerozolimy: z Mezopotamii ok. 1000 km, z Rzymu ponad 2000 km."], "j": "Rekonstrukcja artystyczna: prosty, kamienny dom z płaskim dachem i zewnętrznymi schodami prowadzącymi na górną izbę, osłoniętą drewnianymi okiennicami. W środku skromne stoły, niskie ławy i oliwne lampki. Przed domem wąska, brukowana uliczka, na której gromadzą się ludzie w różny
