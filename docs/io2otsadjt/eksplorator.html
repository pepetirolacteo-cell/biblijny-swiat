ch strojach z odległych krain. Światło poranka wpada przez otwory okienne, a ponad dachami Syjonu rysują się mury miasta.", "d": "Odległość od Świątyni do Wzgórza Syjon: ok. 1 km; wysokość: ok. 765 m n.p.m. (lokalizacja tradycyjna).", "img": null}, {"id": "c8m3", "c": 8, "ct": "Pierwotny Kościół", "n": "Świątynia – Brama Piękna", "lat": 31.778, "lon": 35.2354, "ref": "Dz 3–4", "sub": "Piotr i Jan uzdrawiają żebrzącego człowieka przy bramie Świątyni.", "s": "Piotr i Jan idą na modlitwę do Świątyni i przy Bramie Pięknej uzdrawiają człowieka chromego od urodzenia. Zbiegowisko słucha Piotra, a następnego dnia apostołowie stają przed Sanhedrynem.", "k": ["O godzinie dziewiątej, czyli ok. trzeciej po południu, Piotr i Jan wchodzą do Świątyni na modlitwę. Przy bramie zwanej Piękną codziennie sadzano człowieka chromego od urodzenia, aby prosił o jałmużnę. Piotr patrzy na niego i mówi, że nie ma srebra ani złota, ale daje to, co posiada: w imię Jezusa każe mu wstać. Człowiek podnosi się, wchodzi z nimi do Świątyni i wielbi Boga. Gdy lud się gromadzi, Piotr wyjaśnia, że uzdrowienie jest znakiem mocy Jezusa, i wzywa do nawrócenia.", "Świątynia stała na platformie wzniesionej przez Heroda Wielkiego, o powierzchni ok. 14 hektarów, wokół której biegły kolumnady. Wschodnią część zajmował Portyk Salomona, dokąd lud zbiegł się po uzdrowieniu. Lokalizacja Bramy Pięknej jest dyskutowana, zwykle wskazuje się jedną z bram prowadzących z dziedzińca pogan do dziedzińca kobiet. Taka bliskość miejsca modlitwy i miejsca żebrania pokazuje, jak w jednym kompleksie spotykały się pobożność, handel i ubóstwo. Sanhedryn zasiadał nieopodal, więc aresztowanie apostołów nastąpiło szybko."], "j": "Rekonstrukcja artystyczna: monumentalne kolumnady z jasnego kamienia otaczają ogromny plac, po którym przechodzą pielgrzymi i kapłani. Przy wejściu do wewnętrznego dziedzińca widać okazałą bramę z metalowym okuciem, a pod murem siedzi skulona postać żebraka. Dwie sylwetki w prostych szatach zbliżają się od strony kolumnady, widoczne z oddali lub od tyłu. W tle wznosi się główny gmach Świątyni, a niebo jest pogodne, co podkreśla ogrom budowli.", "d": "Platforma Świątyni herodiańskiej: ok. 480 × 300 m; Portyk Salomona przy wschodnim murze miał ok. 15 m wysokości (oszacowanie).", "img": null}, {"id": "c8m4", "c": 8, "ct": "Pierwotny Kościół", "n": "Jerozolima – męczeństwo Szczepana", "lat": 31.779, "lon": 35.24, "ref": "Dz 6–7; 12,1–19", "sub": "Pierwszy męczennik i prześladowanie, które rozprasza wspólnotę.", "s": "Wspólnota wybiera siedmiu mężów do obsługi ubogich, wśród nich Szczepana, który oskarżony przed Sanhedrynem zostaje ukamienowany. Prześladowanie rozprasza uczniów po Judei i Samarii, a później Herod Agryppa I uwięzi Piotra.", "k": ["Wraz z rozrostem wspólnoty pojawił się spór o codzienną opiekę nad wdowami, więc apostołowie wyznaczyli siedmiu mężów do tej posługi. Jednym z nich był Szczepan, pełen wiary i mocy. Jego nauczanie wywołało sprzeciw, został oskarżony przed Sanhedrynem, a w długiej mowie przypomniał dzieje Izraela. Rozjuszony tłum wyprowadził go za miasto i ukamienował, a młody Szaweł strzegł szat oprawców. Zaczęło się wtedy wielkie prześladowanie, uczniowie rozproszyli się po Judei i Samarii. Późniejsze rozdziały opowiadają też o uwięzieniu Piotra za panowania Heroda Agryppy I.", "Miejsce kamienowania tradycja umieszcza przy bramie północnej, dziś zwanej Bramą Lwów, choć dawniej wskazywano także Bramę Damasceńską. Obie lokalizacje leżą w odległości ok. 1 km od Świątyni, na skraju miasta, gdzie zgodnie z prawem wykonywano egzekucje. Rozproszenie uczniów ukazuje rolę dróg: z Jerozolimy biegły trakty na północ do Samarii i Damaszku, na zachód do Lyddy i Jafy, na południe do Gazy. To właśnie dzięki tym szlakom prześladowanie paradoksalnie przyspieszyło rozprzestrzenianie się Ewangelii."], "j": "Rekonstrukcja artystyczna: północny skraj starożytnej Jerozolimy z masywnym murem obronnym i bramą flankowaną basztami. Przed bramą kamienista droga i otwarta przestrzeń poza murami, na której zbiera się tłum. Zabudowa miejska widoczna za murem jest zwarta, z płaskimi dachami z jasnego kamienia. Nad wszystkim wznosi się szara kopuła nieba, a przy murach rosną pojedyncze drzewa figowe i oliwne.", "d": "Bramy północne Jerozolimy leżały ok. 1 km od Świątyni; mur miejski w tym okresie miał obwód ok. 4 km (oszacowanie).", "img": null}, {"id": "c8m5", "c": 8, "ct": "Pierwotny Kościół", "n": "Samaria – misja Filipa", "lat": 32.2764, "lon": 35.19, "ref": "Dz 8,4–25", "sub": "Ewangelia przekracza dawny podział i trafia do Samarytan.", "s": "Filip głosi Chrystusa w jednym z miast Samarii, a jego nauczanie i znaki otwierają serca mieszkańców. Piotr i Jan przybywają z Jerozolimy, aby modlić się o dary Ducha dla nowych wierzących.", "k": ["Rozproszeni po prześladowaniu uczniowie głoszą słowo tam, dokąd dotarli. Filip, jeden z siedmiu, schodzi do miasta w Samarii i głosi tam Mesjasza. Tłumy słuchają go zgodnie, bo widzą uzdrowienia i wypędzanie duchów nieczystych, a w mieście zapanowała wielka radość. Wielu przyjmuje chrzest, także Szymon zwany Magiem, który wcześniej zadziwiał ludzi swoimi sztukami. Gdy wieść dociera do Jerozolimy, wysłani zostają Piotr i Jan, którzy modlą się o Ducha Świętego dla nowych braci. Szymon próbuje kupić tę moc i zostaje upomniany.", "Samaria leży w środkowej części gór Efraima, na północ od Jerozolimy, ok. 55 km drogi. Dawna stolica Królestwa Północnego została przez Heroda odbudowana jako Sebaste, z wielkim stadionem i świątynią cesarza. Samarytanie byli pogardzani przez wielu Żydów, więc przekroczenie tej granicy było krokiem głęboko znaczącym. Wzgórza okalają żyzne doliny, a szlak z Jerozolimy do Galilei prowadził właśnie przez ten teren. Dlatego wieść rozchodziła się szybko, wzdłuż handlowych traktów."], "j": "Rekonstrukcja artystyczna: monumentalne miasto w stylu hellenistyczno-rzymskim, wzniesione na wzgórzu, z szerokimi ulicami z kolumnadą, świątynią na szczycie i murem obronnym. U stóp wzgórza widoczne tarasy upraw winorośli i figi, a drogą ciągną osły obładowane towarem. Światło jest ciepłe, a w dali majaczą kolejne grzbiety gór Efraima.", "d": "Odległość z Jerozolimy do Samarii: ok. 55 km; wysokość wzgórza miejskiego: ok. 430 m n.p.m.", "img": null}, {"id": "c8m6", "c": 8, "ct": "Pierwotny Kościół", "n": "Droga do Gazy – dworzanin z Etiopii", "lat": 31.6, "lon": 34.95, "ref": "Dz 8,26–40", "sub": "Na pustej drodze Filip tłumaczy proroctwo Izajasza zagranicznemu urzędnikowi.", "s": "Anioł wysyła Filipa na pustynną drogę z Jerozolimy do Gazy, gdzie spotyka dworzanina królowej Etiopii czytającego księgę Izajasza. Filip wyjaśnia mu Pismo, chrzci go i zostaje porwany przez Ducha do Azotu.", "k": ["Polecenie jest zaskakujące: Filip ma opuścić ożywioną Samarię i iść na południe, drogą pustynną. Tam spotyka dostojnika, zarządcę skarbca królowej Etiopii, który wracał z pielgrzymki do Jerozolimy i czytał na głos proroka Izajasza. Filip zadaje proste pytanie o zrozumienie tekstu i zostaje zaproszony na wóz. Opowiada o Jezusie jako o cierpiącym Słudze, a gdy podróżni mijają wodę, dworzanin prosi o chrzest. Potem Filip zostaje uniesiony i odnajduje się w Azocie, skąd wędruje dalej, głosząc Ewangelię aż do Cezarei.", "Droga z Jerozolimy do Gazy liczyła ok. 90 km i wiodła przez wzgórza Judei, a potem przez suchą, pagórkowatą Szefelę, ku nadmorskiej równinie. Dokładne miejsce spotkania jest nieznane, a tradycja wskazuje okolice Bet Sur lub doliny Wadi el-Hesi. Opis, że szlak jest opustoszały, pasuje do półpustynnego charakteru terenu. Spotkanie dowodzi, że Dobra Nowina dotarła daleko poza Palestynę: etiopskie królestwo leżało setki kilometrów na południe, wzdłuż Nilu."], "j": "Rekonstrukcja artystyczna: długa, kamienista droga wijąca się między jasnobrązowymi, niskimi pagórkami, porośniętymi rzadką trawą i kolczastymi krzewami. Na szlaku stoi lekki, dwukołowy wóz zaprzęgnięty w parę koni, a obok niego sylwetka pieszego wędrowca. W tle pojawia się wąski strumień z odrobiną zieleni. Niebo jest szerokie i wypłowiałe, a z oddali widać zarys nadmorskiej równiny.", "d": "Dystans Jerozolima–Gaza: ok. 90 km, czyli ok. 3–4 dni pieszo; wóz mógł pokonać go szybciej.", "img": null}, {"id": "c8m7", "c": 8, "ct": "Pierwotny Kościół", "n": "Damaszek – nawrócenie Szawła", "lat": 33.5116, "lon": 36.3112, "ref": "Dz 9,1–25", "sub": "Prześladowca staje się apostołem i ucieka przez mur w koszu.", "s": "Szaweł zmierza do Damaszku, by pojmać uczniów, lecz na drodze spotyka go Zmartwychwstały i ślepnie. W domu na ulicy Prostej Ananiasz przywraca mu wzrok, a Szaweł zostaje ochrzczony i zaczyna głosić Jezusa.", "k": ["Szaweł z Tarsu, który zgadzał się na śmierć Szczepana, uzyskał od arcykapłana listy do synagog w Damaszku, aby uwięzić wyznawców Jezusa. Pod miastem otoczyło go światło z nieba i usłyszał pytanie, dlaczego go prześladuje. Ślepy został wprowadzony do miasta, gdzie przez trzy dni nie jadł ani nie pił. Ananiasz, posłany przez Pana, położył na niego ręce, a Szaweł przejrzał i przyjął chrzest. Zaczął głosić w synagogach, aż spisek zmusił uczniów, by spuścili go nocą w koszu przez mur.", "Damaszek leży w żyznej oazie u stóp gór Antylibanu, nad rzeką Barada, ok. 220 km na północny wschód od Jerozolimy. Był starożytnym węzłem handlowym łączącym Syrię z Mezopotamią i Arabią, więc znaczna społeczność żydowska miała tam własne synagogi. Podróż pieszo trwała ok. 6–8 dni. Wąska ulica Prosta, wspomniana w narracji, nawiązuje do głównego rzymskiego traktu z kolumnadą, który biegł z zachodu na wschód przez miasto. Słońce w południe, jakie opisuje tekst, bywa tu oślepiające."], "j": "Rekonstrukcja artystyczna: otoczone murem miasto w zielonej oazie, z rzymską ulicą kolumnadową przecinającą zabudowę, domami z płaskimi dachami i wąskimi zaułkami. W dali widać ośnieżone w zimie szczyty gór oraz kamienistą drogę, którą zbliża się mała karawana. Nad bramą miasta unosi się popołudniowa, ostra poświata, a ogrody wzdłuż rzeki Barada kontrastują z surową pustynią za oazą.", "d": "Odległość Jerozolima–Damaszek: ok. 220 km w linii prostej, ok. 6–8 dni pieszo; miasto leży na wysokości ok. 700 m n.p.m.", "img": null}, {"id": "c8m8", "c": 8, "ct": "Pierwotny Kościół", "n": "Lidda – uzdrowienie Eneasza", "lat": 31.9515, "lon": 34.895, "ref": "Dz 9,32–35", "sub": "Na równinie Szaronu Piotr uzdrawia sparaliżowanego od ośmiu lat.", "s": "Piotr odwiedza wspólnotę wiernych w Liddzie i spotyka tam człowieka sparaliżowanego od ośmiu lat. Po jego uzdrowieniu mieszkańcy Lyddy i Szaronu nawracają się do Pana.", "k": ["Po okresie względnego spokoju Kościół w Judei, Galilei i Samarii rozwijał się, a Piotr odwiedzał wspólnoty. W Liddzie zastał sparaliżowanego Eneasza, który od ośmiu lat nie wstawał z łoża. Piotr oznajmił, że uzdrawia go Jezus Chrystus, i polecił mu wstać oraz pościelić posłanie. Eneasz natychmiast się podniósł. Zdarzenie wywołało tak wielki oddźwięk, że mieszkańcy Lyddy i całego Szaronu zwrócili się do Pana. To lakoniczne streszczenie pokazuje, jak jedno wydarzenie mogło poruszyć całą okolicę.", "Lidda, grecko Lydda, leżała na przecięciu ważnych dróg, ok. 40 km na północny zachód od Jerozolimy i ok. 18 km od portu w Jafie. Przez nią biegł główny szlak z wybrzeża do stolicy, więc wieść szybko docierała do wielu miejsc. Równina Szaronu, rozciągająca się wzdłuż wybrzeża między Jafą a Cezareą, była żyzna i gęsto zaludniona, choć miejscami podmokła. To połączenie strategicznej drogi i rolniczej urodzajności tłumaczy, dlaczego wspólnota chrześcijańska mogła tu szybko wzrosnąć."], "j": "Rekonstrukcja artystyczna: duża wieś lub małe miasto na płaskiej równinie, z domami z niewypalanej cegły i kamienia, otoczonymi sadami i polami zbóż. Wąska ulica prowadzi do rynku, gdzie kupcy rozkładają towary. Na horyzoncie widać łagodne wzgórza Judei, a drogę zdobią szeregi palm i sykomor. Pogodny dzień nadaje scenie spokojny, wiejski charakter.", "d": "Odległość Lidda–Jerozolima: ok. 40 km; Lidda–Jafa: ok. 18 km.", "img": null}, {"id": "c8m9", "c": 8, "ct": "Pierwotny Kościół", "n": "Jafa – dom Szymona garbarza", "lat": 32.054, "lon": 34.752, "ref": "Dz 9,36–43; 10,9–23", "sub": "W nadmorskim porcie Piotr wskrzesza Tabitę i na dachu otrzymuje wizję.", "s": "W Jafie Piotr modli się nad zmarłą Tabitą, czyli Dorkas, i przywraca ją do życia. Mieszka u garbarza Szymona, a na jego dachu ma wizję, która przygotowuje go do spotkania z poganami.", "k": ["W Jafie żyła uczennica Tabita, grecko Dorkas, znana z dobrych uczynków i jałmużny. Gdy zmarła, ułożono ją w górnej izbie, a uczniowie wezwali Piotra z pobliskiej Lyddy. Piotr, otoczony płaczącymi wdowami, wyszedł z pokoju, uklęknął i pomodlił się, po czym zwrócił się do zmarłej, by wstała. Otworzyła oczy i usiadła, a wieść rozeszła się po mieście. Piotr pozostał tam wiele dni u garbarza Szymona, a południową porą wszedł na dach, gdzie usłyszał głos i ujrzał naczynie z czystymi i nieczystymi zwierzętami.", "Jafa była jedynym naturalnym portem Judei na Morzu Śródziemnym, ok. 55 km na zachód od Jerozolimy, w linii prostej. Wysoka skała, na której stało miasto, ułatwiała obronę, jednak sam port był niewielki i trudny, z rafami przy wejściu. Garbarz pracował z martwymi zwierzętami, co czyniło go rytualnie nieczystym według wielu Żydów, więc dom Szymona leżał przy brzegu morza, z dala od centrum. Wybór takiego noclegu zapowiada przełamanie granic czystości i nieczystości w kolejnych scenach."], "j": "Rekonstrukcja artystyczna: skalisty cypel opadający ku morzu, a na nim zwarte miasto z płaskimi dachami i wąskimi, stromymi uliczkami. Na brzegu leżą rozłożone skóry i drewniane kadzie garbarni, a w małym porcie kołyszą się drewniane łodzie rybackie. Na jednym z dachów stoi postać w prostej tunice, wpatrzona w niebo. Słońce stoi wysoko, a morze lśni intensywnym błękitem.", "d": "Odległość Jafa–Jerozolima: ok. 55 km w linii prostej (ok. 2 dni pieszo); Jafa–Lidda: ok. 18 km.", "img": null}, {"id": "c8m10", "c": 8, "ct": "Pierwotny Kościół", "n": "Cezarea Nadmorska – dom Korneliusza", "lat": 32.5, "lon": 34.8933, "ref": "Dz 10,1–11,18", "sub": "Pierwszy poganin zostaje włączony do Kościoła bez przechodzenia na judaizm.", "s": "Setnik Korneliusz, bojący się Boga poganin, wzywa Piotra do swojego domu. Piotr głosi mu Ewangelię, a Duch Święty zstępuje na słuchaczy, więc zostają ochrzczeni.", "k": ["Korneliusz był setnikiem kohorty zwanej Italską, człowiekiem pobożnym i hojnym dla ubogich. Anioł polecił mu posłać po Piotra do Jafy. Następnego dnia, gdy posłańcy byli już w drodze, Piotr miał wizję na dachu i zrozumiał, że nie wolno nazywać nieczystym tego, co Bóg oczyścił. Wszedł do domu poganina, wysłuchał jego świadectwa i opowiedział o Jezusie. W trakcie przemówienia Duch Święty zstąpił na wszystkich słuchających, a Piotr polecił ich ochrzcić. Po powrocie do Jerozolimy musiał jeszcze wyjaśnić swoje postępowanie.", "Cezarea Nadmorska była stolicą rzymskiej prowincji Judei, wzniesioną przez Heroda Wielkiego nad Morzem Śródziemnym, ok. 55 km na północ od Jafy i ok. 100 km od Jerozolimy. Miasto miało sztuczny port Sebastos, teatr, hipodrom i akwedukt, a mieszkali tu Rzymianie, Grecy i Żydzi. Korneliusz reprezentował rzymską administrację wojskową. Wizyta Piotra w tym kosmopolitycznym mieście pokazuje przełomowy moment: Kościół przestaje być wyłącznie wspólnotą żydowską i zaczyna otwierać się na świat pogański."], "j": "Rekonstrukcja artystyczna: eleganckie miasto portowe w rzymskim stylu, z białymi budynkami, szerokimi ulicami, półkolistym teatrem skierowanym ku morzu i długim akweduktem na horyzoncie. W porcie cumują duże statki handlowe, a nabrzeże wzmacniają potężne molo. W głębi widać reprezentacyjne domy z dziedzińcami, otoczone ogrodami. Światło jest jasne, a morze lekko sfalowane.", "d": "Cezarea–Jafa: ok. 55 km; Cezarea–Jerozolima: ok. 100 km; port Sebastos zajmował ok. 100 000 m² (oszacowanie).", "img": null}, {"id": "c8m11", "c": 8, "ct": "Pierwotny Kościół", "n": "Antiochia nad Orontesem – nazwa „chrześcijanie”", "lat": 36.202, "lon": 36.16, "ref": "Dz 11,19–30; 13,1–3", "sub": "Wielkie miasto Syrii staje się drugim centrum i bazą misyjną Kościoła.", "s": "Uczniowie rozproszeni po śmierci Szczepana głoszą Ewangelię w Antiochii także Grekom. Barnaba sprowadza z Tarsu Szawła i tam po raz pierwszy uczniów nazwano chrześcijanami.", "k": ["Niektórzy rozproszeni uczniowie z Cypru i Cyreny dotarli do Antiochii i zaczęli głosić Ewangelię także Grekom. Wielu uwierzyło, a Kościół w Jerozolimie wysłał do Antiochii Barnabę. Ten, widząc łaskę Bożą, ucieszył się i zachęcał wszystkich do wierności. Potem udał się do Tarsu, odszukał Szawła i przyprowadził go do miasta, gdzie przez rok nauczali liczne zgromadzenie. Tam po raz pierwszy nazwano uczniów chrześcijanami. Z Antiochii wyruszyła też pomoc dla głodujących w Judei, a później pierwsza wyprawa misyjna.", "Antiochia nad Orontesem, dziś Antakya w Turcji, była trzecim co do wielkości miastem Cesarstwa Rzymskiego po Rzymie i Aleksandrii. Leżała ok. 500 km na północ od Jerozolimy, w pobliżu ujścia rzeki Orontes do morza. Port Seleucja Pierii oddalony był o ok. 25 km. Miasto słynęło z długiej, kolumnadowej ulicy, teatrów i świątyń, a liczyło ok. 250–500 tysięcy mieszkańców (oszacowania historyków). Zróżnicowana ludność i bliskość szlaków morskich oraz lądowych uczyniły je naturalnym ośrodkiem rozchodzenia się nowej wiary."], "j": "Rekonstrukcja artystyczna: ogromne miasto rozłożone u stóp wzgórza Silpios, przecięte długą ulicą z kolumnadą, po której przechodzą kupcy, rzemieślnicy i marynarze. Widoczne są teatry, łaźnie i wspaniałe świątynie z białego kamienia. Rzeka Orontes płynie przez miasto, a nad nią przerzucone są kamienne mosty. Wieczorne światło nadaje murom ciepły, miodowy odcień.", "d": "Odległość Antiochia–Jerozolima: ok. 500 km w linii prostej; Antiochia–Seleucja Pierii: ok. 25 km; Antiochia–Tars: ok. 200 km.", "img": null}, {"id": "c8m12", "c": 8, "ct": "Pierwotny Kościół", "n": "Jerozolima – zgromadzenie apostołów", "lat": 31.7769, "lon": 35.2292, "ref": "Dz 15,1–35", "sub": "Pierwszy sobór rozstrzyga, czy poganie muszą przyjmować Prawo Mojżeszowe.", "s": "Gdy w Antiochii pojawił się spór o obrzezanie nawróconych pogan, Paweł i Barnaba udają się do Jerozolimy. Apostołowie i starsi decydują, by nie nakładać na pogan ciężaru Prawa, i wysyłają list do wspólnot.", "k": ["Do Antiochii przybyli ludzie z Judei, którzy nauczali, że bez obrzezania nikt nie może być zbawiony. Powstał żywy spór, więc Paweł i Barnaba wraz z innymi udali się do Jerozolimy. Tam apostołowie i starsi długo dyskutowali. Piotr przypomniał, że Bóg dał Ducha poganom tak samo jak Żydom, a Paweł i Barnaba opowiedzieli o znakach pośród narodów. Jakub, zabierając głos, powołał się na proroków i zaproponował rozwiązanie. Spisano list z kilkoma zaleceniami i wysłano go do Antiochii z Judaszem i Sylasem.", "Zgromadzenie odbyło się ok. roku 49 po Chrystusie, a droga z Antiochii do Jerozolimy liczyła ok. 500 km i trwała kilka tygodni. Paweł i Barnaba szli przez Fenicję i Samarię, opowiadając po drodze o nawróceniach pogan, co wywoływało radość wspólnot. Jerozolima była nadal duchowym centrum, a spotkanie pokazuje, że ważne decyzje zapadały wspólnie, w dialogu, z odwołaniem do Pisma i doświadczenia. Tradycyjnie uważa się je za wzór kolejnych soborów."], "j": "Rekonstrukcja artystyczna: obszerne wnętrze domu, w którym na niskich ławach siedzą starsi wspólnoty w prostych płaszczach. Pośrodku stoi mówca, a obok leży zwój. Przez wąskie okna wpada światło, oświetlając kamienne ściany i proste kandelabry. Na zewnątrz słychać szum ulicy, a w pomieszczeniu panuje skupienie i uważne słuchanie.", "d": "Antiochia–Jerozolima: ok. 500 km w linii prostej; zgromadzenie datuje się ok. 49 r. po Chr.", "img": null}, {"id": "c9m1", "c": 9, "ct": "Podróże apostolskie", "n": "Antiochia Syryjska – wspólnota, która wysyła", "lat": 36.2, "lon": 36.16, "ref": "Dz 11,19–26; 13,1–3", "sub": "Z wielkiego miasta nad Orontesem wyruszają pierwsi misjonarze.", "s": "W Antiochii wierzący po raz pierwszy zostali nazwani chrześcijanami, a tamtejsza wspólnota stała się bazą misji. Podczas modlitwy i postu Kościół wysłał Barnabę i Szawła w drogę.", "k": ["Antiochia nad Orontesem była jednym z największych miast cesarstwa, obok Rzymu i Aleksandrii. Gdy po śmierci Szczepana uciekinierzy z Jerozolimy dotarli do Syrii, zaczęli głosić Ewangelię także nie-Żydom. Wspólnota szybko rosła, więc z Jerozolimy przybył Barnaba, który następnie sprowadził z Tarsu Szawła. Przez cały rok nauczali tu liczny tłum, a to właśnie w Antiochii uczniowie po raz pierwszy zostali nazwani chrześcijanami. Gdy wspólnota modliła się i pościła, Duch Święty polecił wyłączyć Barnabę i Szawła do nowego dzieła, a po nałożeniu rąk wysłano ich w drogę.", "Położenie miasta tłumaczy jego rolę. Antiochia leżała w dolinie rzeki Orontes, mniej więcej 30 km od morza, a jej port Seleucja Pieria otwierał drogę na Cypr i do Azji Mniejszej. Na wschód prowadziły szlaki karawanowe do Mezopotamii, na południe droga wzdłuż wybrzeża do Palestyny, na północ przejścia przez góry Amanus do Cylicji i rodzinnego Tarsu Pawła. Mieszkała tu duża społeczność żydowska i wielu Greków, więc wspólnota od początku była różnorodna. Ta mieszanka kultur stała się naturalnym punktem startu dla misji do pogan."], "j": "Rekonstrukcja artystyczna ukazuje miasto rozciągnięte między rzeką a zboczami góry Silpios. Główną arterię okalała kolumnada, w której nocą płonęły latarnie. W dzielnicach stały świątynie, łaźnie i teatr, a w domach prywatnych gromadziły się grupy wierzących. Nad portem unosił się zapach żywicy i oliwy, a na bruku mieszały się głosy kupców z Syrii, Grecji i Italii.", "d": "Odległość od Antiochii do Seleucji Pierii: ok. 25–30 km; do Tarsu: ok. 200 km.", "img": null}, {"id": "c9m2", "c": 9, "ct": "Podróże apostolskie", "n": "Cypr – Salamina i Pafos", "lat": 34.756, "lon": 32.41, "ref": "Dz 13,4–12", "sub": "Pierwszy przystanek misji: wyspa Barnaby i spotkanie z prokonsulem.", "s": "Barnaba i Szaweł przepłynęli z Seleucji na Cypr, a Ewangelię głosili w synagogach Salaminy. W Pafos spotkali rzymskiego prokonsula Sergiusza Pawła, który uwierzył.", "k": ["Z Seleucji Pierii misjonarze, razem z Janem Markiem, wypłynęli na Cypr, ojczyznę Barnaby. W Salaminie, wschodnim porcie wyspy, głosili słowo w synagogach. Następnie przeszli całą wyspę aż do Pafos, stolicy rzymskiej prowincji. Prokonsul Sergiusz Paweł, człowiek rozumny, zapragnął usłyszeć słowo Boże, ale sprzeciwiał się mu żydowski mag Bar-Jezus, zwany Elymasem. Szaweł, odtąd nazywany Pawłem, napełniony Duchem Świętym, skarcił maga, który na pewien czas stracił wzrok. Prokonsul, zdumiony nauką, uwierzył. W tym fragmencie po raz pierwszy pojawia się imię Paweł.", "Cypr leży ok. 100 km od wybrzeża Syrii, więc stanowił naturalny pierwszy skok przez morze. Wyspa słynęła z miedzi, której nazwa pochodzi właśnie od jej imienia, oraz z drewna i win. Trasa z Salaminy do Pafos prowadziła wzdłuż południowego wybrzeża i liczyła ok. 150 km. Pafos było stolicą administracyjną i ośrodkiem kultu Afrodyty, dlatego stało się wymownym miejscem pierwszego zderzenia Ewangelii z pogańskim światem i przedstawicielem władzy rzymskiej. Stąd Paweł odpłynął na północ, ku wybrzeżom Pamfilii."], "j": "Rekonstrukcja artystyczna ukazuje pafijską przystań w jasnym świetle śródziemnomorskiego poranka. Drewniane statki handlowe z kwadratowymi żaglami cumują przy kamiennym nabrzeżu, a dokerzy ładują amfory. Na wzgórzu w głębi widać białe fasady rzymskich willi i świątynię. Na pierwszym planie, daleko od widza, grupka podróżnych w płaszczach idzie nabrzeżem.", "d": "Cypr leży ok. 100 km od wybrzeża Syrii; trasa Salamina–Pafos liczy ok. 150 km.", "img": null}, {"id": "c9m3", "c": 9, "ct": "Podróże apostolskie", "n": "Antiochia Pizydyjska – synagoga i odrzucenie", "lat": 38.3, "lon": 31.19, "ref": "Dz 13,13–52", "sub": "W górach Pizydii Paweł wygłasza pierwszą wielką mowę i zwraca się do pogan.", "s": "W synagodze Paweł opowiedział historię Izraela aż do Jezusa, a wielu słuchaczy poprosiło o ciąg dalszy. Gdy część Żydów sprzeciwiła się, misjonarze zwrócili się do pogan.", "k": ["Z Pafos misjonarze przepłynęli do Pamfilii i dotarli do Perge, gdzie Jan Marek wrócił do Jerozolimy. Paweł i Barnaba ruszyli dalej, przez góry, do Antiochii Pizydyjskiej. W szabat weszli do synagogi, a po czytaniu Prawa i Proroków poproszono ich o słowo zachęty. Paweł przedstawił dzieje Izraela od wyjścia z Egiptu po Dawida i ogłosił, że Bóg wzbudził Zbawiciela, Jezusa. Słuchacze prosili o kontynuację, a w następny szabat zebrało się niemal całe miasto. Gdy zazdrośni przeciwnicy się sprzeciwili, Paweł oznajmił, że zwraca się do pogan, i słowo rozchodziło się po całej okolicy, aż do wygnania misjonarzy.", "Droga z Perge w Pamfilii do Antiochii prowadziła przez góry Taurus i liczyła ok. 160 km. Miasto leżało na wysokości ok. 1200 m n.p.m., więc klimat był tu surowszy niż nad morzem, a podróż uciążliwa i niebezpieczna z powodu rozbójników i przełęczy. Antiochia była rzymską kolonią założoną przez Augusta, położoną na ważnej drodze prowadzącej z zachodu do Ikonium, dzięki czemu wieści szybko docierały dalej. Dlatego wygnanie Pawła nie zatrzymało ewangelizacji: poszedł wzdłuż tej samej drogi do kolejnych miast."], "j": "Rekonstrukcja artystyczna przedstawia wysokogórskie miasto o chłodnym, przejrzystym świetle. Na rynku stoją rzymskie budynki z jasnego kamienia, a nad nimi wznosi się wzgórze z sanktuarium boga Men. W oddali, na ścieżce wychodzącej z bramy, widać dwóch wędrowców w podróżnych płaszczach. Za nimi śnieg leży jeszcze na szczytach Taurusu.", "d": "Wysokość miasta: ok. 1200 m n.p.m.; droga z Perge: ok. 160 km przez Taurus.", "img": null}, {"id": "c9m4", "c": 9, "ct": "Podróże apostolskie", "n": "Listra – uzdrowienie i ukamienowanie", "lat": 37.57, "lon": 32.45, "ref": "Dz 14,6–20", "sub": "Uzdrowiony chromy, tłum wołający „bogowie” i kamienie.", "s": "W Listrze Paweł uzdrowił człowieka chromego od urodzenia, a tłum uznał misjonarzy za bogów. Wkrótce przeciwnicy przekonali ludzi i Paweł został ukamienowany.", "k": ["Po wypędzeniu z Ikonium Paweł i Barnaba dotarli do Likaonii, do miasta Listra. Tam Paweł zobaczył człowieka chromego od urodzenia, który słuchał jego nauki, i polecił mu wstać. Gdy ten wstał i zaczął chodzić, tłum zawołał po likaońsku, że bogowie zeszli do ludzi, i nazwał Barnabę Zeusem, a Pawła Hermesem. Kapłan przyniósł już wieńce i woły, ale apostołowie rozdarli szaty i powstrzymali ofiarę. Wkrótce nadeszli Żydzi z Antiochii i Ikonium, nakłonili tłum, ukamienowali Pawła i wywlekli go za miasto. Uczniowie otoczyli go, a on wstał i wrócił do miasta.", "Listra leżała na płaskowyżu środkowej Anatolii, na południowy zachód od Ikonium, w odległości ok. 35–40 km. Była mało znaczącą kolonią rzymską, w której wciąż mówiono miejscowym językiem likaońskim, stąd reakcja tłumu bez zrozumienia greckiej mowy apostołów. Lokalizacja tradycyjna wskazuje na wzgórze koło dzisiejszego Hatunsaray. Z Listry pochodził Tymoteusz, który dołączył do Pawła w drugiej podróży. Następnego dnia Paweł wyruszył do Derbe, co pokazuje, jak blisko siebie leżały tu miasta rzymskiej drogi."], "j": "Rekonstrukcja artystyczna ukazuje skromne miasteczko na stepowym płaskowyżu, z kilkoma kamiennymi budynkami wokół małego rynku. Nad nim wznosi się wzgórze z ruinami starszej osady, a dalej rozciągają się pola pszenicy i pastwiska owiec. Z rynku, przy świątyni Zeusa, unosi się dym ofiarny, a w oddali widać sylwetki górskiego pasma Taurus.", "d": "Dystans Ikonium–Listra: ok. 35–40 km; lokalizacja tradycyjna przy dzisiejszym Hatunsaray.", "img": null}, {"id": "c9m5", "c": 9, "ct": "Podróże apostolskie", "n": "Jerozolima – sobór apostolski", "lat": 31.78, "lon": 35.23, "ref": "Dz 15,1–35", "sub": "Pierwsze zgromadzenie Kościoła rozstrzyga, czy poganie muszą przyjąć Prawo Mojżesza.", "s": "Wspólnota w Jerozolimie, z udziałem Piotra, Jakuba, Pawła i Barnaby, uznała, że poganie nie muszą przyjmować obrzezania. List z decyzją zaniesiono do Antiochii.", "k": ["Po powrocie z pierwszej podróży do Antiochii pojawił się spór: niektórzy przybysze z Judei twierdzili, że bez obrzezania nie ma zbawienia. Paweł i Barnaba udali się więc do Jerozolimy, gdzie apostołowie i starsi zebrali się, aby zbadać sprawę. Piotr przypomniał, że Bóg dał Ducha także poganom, Paweł i Barnaba opowiedzieli o znakach, a Jakub zaproponował rozstrzygnięcie zgodne z Pismem. Zdecydowano nie nakładać na pogan ciężaru Prawa, prosząc jedynie o kilka praktyk ułatwiających wspólnotę. Wysłano list i zaufanych posłańców, Judę i Sylasa, a wspólnota w Antiochii przyjęła go z radością.", "Droga z Antiochii do Jerozolimy liczyła ok. 500 km i prowadziła przez Fenicję i Samarię, więc podróżni mogli po drodze opowiadać o nawróceniu pogan. Miasto Dawida leżało na wysokości ok. 750 m n.p.m. i przyciągało pielgrzymów z całego świata. Tradycyjnie datuje się sobór na ok. 49 r. n.e. Dyskusja pokazuje, że decyzje podejmowano wspólnie, w miejscu zakorzenionym w historii zbawienia, ale z uwagą wobec doświadczeń misji na dalekich terenach. To spotkanie otworzyło drogę dalszym podróżom Pawła."], "j": "Rekonstrukcja artystyczna przedstawia Jerozolimę z połowy I wieku: wapienne domy na wzgórzach, ogromny kompleks Świątyni z błyszczącymi blachami i wąskie uliczki Górnego Miasta. Zgromadzenie odbywa się w skromnej sali domu, w której na ławach siedzą mężczyźni w prostych płaszczach, a przez otwarte okno wpada światło poranka.", "d": "Droga z Antiochii do Jerozolimy: ok. 500 km; datowanie soboru: ok. 49 r. n.e.", "img": null}, {"id": "c9m6", "c": 9, "ct": "Podróże apostolskie", "n": "Filippi – Lidia, więzienie i trzęsienie ziemi", "lat": 41.013, "lon": 24.286, "ref": "Dz 16,8–40", "sub": "Pierwsza wspólnota w Europie rodzi się nad rzeką i w celi.", "s": "Po widzeniu w Troadzie Paweł przeprawił się do Macedonii i w Filippi spotkał Lidię nad rzeką. Po uwięzieniu i trzęsieniu ziemi nawrócił się strażnik więzienny z całym domem.", "k": ["W Troadzie Paweł ujrzał we śnie Macedończyka, który prosił o pomoc, więc grupa, do której należał Łukasz, przepłynęła przez Samotrakę do Neapolis, a stamtąd udała się do Filippi. W szabat wyszli za miasto nad rzekę, gdzie modliły się kobiety. Lidia, sprzedawczyni purpury z Tiatyry, otworzyła serce na słowo i przyjęła chrzest wraz z domem. Później Paweł wypędził ducha z niewolnicy, jej panowie oskarżyli misjonarzy przed urzędnikami, a ci zostali ubiczowani i wtrąceni do więzienia. O północy wstrząs ziemi otworzył drzwi, a strażnik, zamiast się zabić, zapytał o drogę zbawienia i został ochrzczony.", "Filippi leżały na Via Egnatia, głównej rzymskiej drodze łączącej Adriatyk z Bosforem, ok. 15 km od morskiego portu Neapolis. Miasto było kolonią rzymską zasiedloną weteranami wojen domowych, więc jego mieszkańcy dumnie podkreślali obywatelstwo. Okolica słynęła z kopalni złota i z żyznej równiny. Przeprawa przez morze Egejskie z Troady zajęła zaledwie dwa dni, co ułatwiło przejście misji z Azji do Europy. To właśnie tu powstał Kościół, do którego Paweł napisał później list z więzienia."], "j": "Rekonstrukcja artystyczna ukazuje rzymską kolonię u stóp wzgórza, z szerokim traktem Via Egnatia przechodzącym przez środek miasta. Po jednej stronie widać forum z kolumnadą, po drugiej akropol z teatrem wciśniętym w zbocze. Poza murami, nad strumieniem w zieleni, kilka kobiet siedzi w grupie, a w oddali dwie sylwetki wędrowców zbliżają się do nich.", "d": "Odległość Filippi–Neapolis: ok. 15 km; Neapolis–Troada przez Samotrakę: ok. 2 dni żeglugi.", "img": null}, {"id": "c9m7", "c": 9, "ct": "Podróże apostolskie", "n": "Ateny – Areopag", "lat": 37.972, "lon": 23.725, "ref": "Dz 17,16–34", "sub": "W intelektualnym centrum świata Paweł mówi o Bogu nieznanym.", "s": "Na Areopagu Paweł nawiązał do ołtarza „nieznanemu Bogu” i do własnych poetów. Część słuchaczy drwiła, ale kilku uwierzyło, w tym Dionizy Areopagita i Damaris.", "k": ["Po Tesalonice i Berei, skąd Paweł musiał uciekać przed niepokojami, dotarł do Aten sam. Obserwując miasto pełne posągów, rozmawiał w synagodze i na agorze z Żydami, bogobojnymi i filozofami. Epikurejczycy i stoicy zaprowadzili go na Areopag, gdzie przedstawił Boga Stwórcę, który nie mieszka w świątyniach rąk ludzkich. Posłużył się ołtarzem „nieznanemu Bogu” i cytatami z greckich poetów, ale słowo o zmartwychwstaniu wywołało drwiny. Wierzący pozostali nieliczni, jednak wśród nich byli Dionizy z Areopagu i kobieta imieniem Damaris.", "Ateny leżą ok. 80 km na wschód od Koryntu, między zatoką Sarońską a górami Hymettos i Pentelikon. Wzgórze Areopagu wznosi się na wysokość ok. 115 m, tuż obok Akropolu liczącego ok. 156 m, dzięki czemu mówca widział symbole religii miasta: Partenon i świątynie. Choć słynny okres klasyczny minął, Ateny wciąż słynęły jako ośrodek nauki, a ich agora pełniła rolę forum publicznego. To miejsce wymagało od apostoła nowego języka głoszenia: nie zaczynał od Mojżesza, ale od pytań, które nurtowały Greków."], "j": "Rekonstrukcja artystyczna ukazuje skalisty szczyt Areopagu, schody wykute w skale i grupę mężczyzn w płaszczach z plecami do widza, zasłuchaną w mówcę. Za nimi wznosi się Akropol z Partenonem w jasnym świetle, w dole tłoczy się agora z portykami, a nad dachami miasta krąży kilka ptaków.", "d": "Wysokość Areopagu: ok. 115 m n.p.m.; odległość Ateny–Korynt: ok. 80 km.", "img": null}, {"id": "c9m8", "c": 9, "ct": "Podróże apostolskie", "n": "Korynt – miasto dwóch portów", "lat": 37.906, "lon": 22.879, "ref": "Dz 18,1–18", "sub": "Półtora roku w Koryncie, gdzie Paweł pracuje i zakłada wielką wspólnotę.", "s": "W Koryncie Paweł zamieszkał u Akwili i Pryscylli i pracował jako wytwórca namiotów. Mieszkał tu ok. półtora roku, a nad wspólnotą czuwał pomimo sprzeciwu części Żydów.", "k": ["Po Atenach Paweł przybył do Koryntu, gdzie poznał Żydów Akwilę i Pryscyllę, wygnanych z Rzymu, i zamieszkał u nich, ponieważ łączyło ich to samo rzemiosło. Co szabat rozmawiał w synagodze, a gdy po przybyciu Sylasa i Tymoteusza zaczęło przybywać sprzeciwu, zwrócił się do pogan i przeniósł się do domu Tytusa Justusa. Nawrócił się nawet przełożony synagogi, Kryspus. Po widzeniu, które go umocniło, Paweł pozostał tu ok. półtora roku. Oskarżony przed prokonsulem Gallionem, został uwolniony, bo Rzymianin nie widział w sprawie przestępstwa.", "Korynt leżał na przesmyku o szerokości ok. 6 km, który łączył Peloponez z lądem stałym, i miał dwa porty: Lechajon nad Zatoką Koryncką oraz Kenchrea nad Zatoką Sarońską. Statki małych rozmiarów były przeciągane przez przesmyk specjalną drogą, a wszystkie towary przechodziły przez miasto. Dzięki temu był ono bogate, kosmopolityczne i znane z rozwiązłości. Wzgórze Akrokoryntu wznosiło się na ok. 575 m. Z Koryntu Paweł napisał kilka listów, a stąd wypłynął do Efezu, zabierając ze sobą Akwilę i Pryscyllę."], "j": "Rekonstrukcja artystyczna ukazuje bogaty port handlowy o gwarnym rynku. Nad miastem góruje potężna skała Akrokoryntu z ruinami świątyni na szczycie. W warsztatach rzemieślnicy szyją namioty z koziej sierści, a na bruku stoją kramy z miedzianymi naczyniami, owocami i tkaninami z całego Morza Śródziemnego.", "d": "Szerokość Przesmyku Korynckiego: ok. 6 km; pobyt Pawła: ok. 18 miesięcy.", "img": null}, {"id": "c9m9", "c": 9, "ct": "Podróże apostolskie", "n": "Efez – Artemizjon i teatr", "lat": 37.939, "lon": 27.341, "ref": "Dz 19,1–40", "sub": "Najdłuższy pobyt Pawła: nauka w szkole Tyrannosa i bunt złotników.", "s": "W Efezie Paweł nauczał przez ok. dwa–trzy lata, a słowo Boże rozchodziło się po całej Azji. Zamieszki wywołane przez złotnika Demetriusza zakończył urzędnik miejski.", "k": ["Paweł przybył do Efezu w trzeciej podróży, najpierw spotkał uczniów Jana Chrzciciela, których ochrzczono w imię Jezusa, i zstąpił na nich Duch. Przez trzy miesiące mówił w synagodze, a gdy napotkał sprzeciw, przeniósł się do szkoły Tyrannosa, gdzie nauczał codziennie przez dwa lata. Dokonywały się tu uzdrowienia, a nawróceni palili księgi magiczne warte fortunę. Gdy złotnik Demetriusz, wytwarzający niewielkie świątynki Artemidy, zobaczył spadek zysków, wywołał zamieszki. Tłum ruszył do teatru i krzyczał przez ok. dwie godziny, aż pisarz miejski uspokoił ludzi.", "Efez leżał u ujścia rzeki Kaistros, przy morzu, i był stolicą rzymskiej prowincji Azji. Jego Artemizjon liczył się do siedmiu cudów świata antycznego. Teatr na zboczu wzgórza Pion mieścił ok. 25 000 widzów, a prosta ulica portowa, Arkadiana, prowadziła do przystani. Dzięki położeniu na styku dróg lądowych i morskich miasto było doskonałym ośrodkiem rozchodzenia się nauki. Z tego powodu mieszkańcy okolicznych miast, takich jak Kolosy czy Laodycea, słyszeli Ewangelię, choć Paweł sam tam nie dotarł."], "j": "Rekonstrukcja artystyczna ukazuje marmurową ulicę portową z kolumnadą, prowadzącą ku ogromnemu teatrowi wciśniętemu w zbocze wzgórza. Przy ulicy tłoczą się kupcy, pielgrzymi i rzemieślnicy. W oddali, na równinie, błyszczy biała bryła Artemizjonu z lasem kolumn, a za nim ciągnie się linia gór.", "d": "Pojemność teatru: ok. 25 000 widzów; pobyt Pawła: ok. 2–3 lata.", "img": null}, {"id": "c9m10", "c": 9, "ct": "Podróże apostolskie", "n": "Cezarea Nadmorska – więzień przed namiestnikami", "lat": 32.5, "lon": 34.89, "ref": "Dz 23,23–26,32", "sub": "Dwa lata w pałacu Heroda: Feliks, Festus i król Agryppa.", "s": "Aresztowanego w Jerozolimie Pawła przewieziono do Cezarei, gdzie przez dwa lata czekał na proces. Odwołał się do cesarza, co otworzyło mu drogę do Rzymu.", "k": ["Po aresztowaniu w Jerozolimie i spisku, który miał zabić Pawła, rzymski trybun wysłał go pod silną eskortą do Cezarei, siedziby namiestnika Feliksa. Tam Paweł bronił się przed oskarżycielami z Jerozolimy, a Feliks odkładał wyrok, licząc na łapówkę. Po dwóch latach jego następca Festus, pragnąc zjednać sobie Żydów, zaproponował proces w Jerozolimie. Paweł jako obywatel rzymski odwołał się do cesarza. Później przed królem Agryppą II i jego siostrą Berenike opowiedział o swoim nawróceniu, a Agryppa uznał, że niewinny mógłby zostać uwolniony.", "Cezarea Nadmorska, zbudowana przez Heroda Wielkiego ok. 22–10 r. p.n.e., była stolicą rzymskiej prowincji Judei i miała jeden z największych sztucznych portów starożytności, Sebastos. Leżała ok. 100 km od Jerozolimy, więc więźnia można było przewieźć w jedną noc pod eskortą kilkuset żołnierzy. Port pozwalał stąd łatwo dopłynąć do Fenicji, Azji Mniejszej i Italii. Dlatego odwołanie do cesarza oznaczało, że Paweł wyruszy statkiem z tego samego wybrzeża, które Ewangelia opuściła w kierunku świata."], "j": "Rekonstrukcja artystyczna przedstawia pałac namiestnika wzniesiony na cyplu nad Morzem Śródziemnym, z kolumnadami i basenem otwartym na fale. Dalej widać półkolisty hipodrom, teatr i wielki port Sebastos z latarnią. Żołnierze w czerwonych płaszczach pilnują schodów prowadzących do sali przesłuchań.", "d": "Odległość Cezarea–Jerozolima: ok. 100 km; pobyt Pawła w więzieniu: ok. 2 lata.", "img": null}, {"id": "c9m11", "c": 9, "ct": "Podróże apostolskie", "n": "Malta – rozbicie statku", "lat": 35.95, "lon": 14.4, "ref": "Dz 27,1–28,10", "sub": "Po burzy trwającej ok. dwóch tygodni statek rozbija się u brzegów wyspy.", "s": "Statek z Pawłem więźniem po czternastu dniach sztormu osiadł na mieliźnie przy Malcie. Wszyscy ocaleli, a mieszkańcy okazali im życzliwość.", "k": ["Paweł wyruszył do Rzymu w eskorcie setnika Juliusza na statkach z Cezarei, a po przesiadce w Mirze na okręt aleksandryjski wiozący zboże. Przy Krecie, w Dobrych Przystaniach, Paweł ostrzegał przed dalszą żeglugą, ale żeglarze popłynęli, szukając lepszego portu. Uderzył wicher Euroklidon, który przez ok. dwa tygodnie rzucał statkiem po otwartym morzu. Paweł, wsparty widzeniem anioła, zapewnił wszystkich o ocaleniu. Statek osiadł na mieliźnie, a 276 osób dotarło do brzegu wpław lub na deskach. Na Malcie, ogrzewając się przy ognisku, Paweł otrząsnął z ręki żmiję, a później uzdrowił ojca Publiusza.", "Malta leży ok. 90 km od Sycylii i mierzy ok. 27 km długości, zatem odnalezienie jej w sztormie było kwestią szczęścia. Tradycyjnie miejscem rozbicia jest zatoka św. Pawła na północy wyspy. Mieszkańcy, nazwani w tekście barbarzyńcami, bo nie mówili po grecku, podjęli rozbitków serdecznie. Zimą żegluga zazwyczaj ustawała, więc ekipa spędziła tu trzy miesiące, po czym wyruszyła aleksandryjskim statkiem z godłem Dioskurów. Dzięki temu podróż do Rzymu mogła zostać dokończona na wiosnę."], "j": "Rekonstrukcja artystyczna przedstawia skalisty brzeg północnej Malty o świcie po sztormie. Wśród fal tkwi drewniany statek z połamanym masztem, a na plaży rozbitkowie zbierają się wokół ogniska. Z oddali podchodzą ludzie w prostych szatach, niosąc koce i drewno. Niebo jest ciężkie od chmur, a morze wciąż spienione.", "d": "Malta leży ok. 90 km od Sycylii; długość wyspy: ok. 27 km; rozbitków: 276 osób.", "img": null}, {"id": "c9m12", "c": 9, "ct": "Podróże apostolskie", "n": "Rzym – dom na Via Appia i koniec drogi", "lat": 41.89, "lon": 12.48, "ref": "Dz 28,11–31", "sub": "Droga przez Syrakuzy i Puteoli kończy się w stolicy imperium.", "s": "Z Malty statek dotarł przez Syrakuzy i Regium do Puteoli, a stamtąd Paweł szedł Via Appia do Rzymu. Przez dwa lata mieszkał we własnym wynajętym domu, głosząc bez przeszkód.", "k": ["Po trzech miesiącach na Malcie podróżni wypłynęli statkiem aleksandryjskim, zatrzymali się na trzy dni w Syrakuzach, przepłynęli do Regium i po jednym dniu wiatru z południa dotarli do Puteoli. Tam spotkali braci i zostali zaproszeni na tydzień. Z Puteoli droga wiodła ku Rzymowi, a wierzący wyszli naprzeciw Pawła aż do Forum Appiusza i Trzech Gospód. Paweł podziękował Bogu i nabrał otuchy. W Rzymie pozwolono mu mieszkać w wynajętym domu, pod strażą żołnierza. Przez dwa lata przyjmował wszystkich i głosił Królestwo Boże bez przeszkód.", "Puteoli było głównym portem dla zboża z Aleksandrii, a stąd do Rzymu wiodła Via Appia, ok. 230 km szlaku, który wędrowcy pokonywali w ciągu paru dni. Wcześniej wierzący, np. Akwila i Pryscylla, zbudowali w stolicy wspólnotę, do której Paweł adresował List do Rzymian. Miasto liczyło około miliona mieszkańców i było w centrum świata, więc sama obecność Pawła tutaj symbolizuje dotarcie Ewangelii do „krańców ziemi”, o których zapowiadał Jezus. Księga Dziejów kończy się otwartą sceną: nauczanie trwa."], "j": "Rekonstrukcja artystyczna ukazuje bruk Via Appia ocieniony piniami, po którym zmierza grupa podróżnych wśród grobowców i willi. W oddali, nad horyzontem, błyszczą dachy świątyń i akweduktów Rzymu. W jednym z zaułków miasta stoi skromny wynajęty dom, do którego prowadzą wąskie schody, a przed nim czeka kilku gości.", "d": "Droga Puteoli–Rzym przez Via Appia: ok. 230 km; pobyt Pawła w areszcie domowym: ok. 2 lata.", "img": null}],BB=[10, 22, 52, 45.5];const COL=['#c1573f','#4778a8','#5c9668','#a1548f','#c9a038','#3f9797','#d27a3a','#7a63b8','#b04a6c'];
const vp=document.getElementById('vp'),st=document.getElementById('stage'),base=document.getElementById('base'),panel=document.getElementById('panel'),pin=document.getElementById('pin');
let W=0,H=0,sc=1,tx=0,ty=0,sel=0,cur=null;const pins=[];
function px(l){return [(l.lon-BB[0])/(BB[2]-BB[0])*W,(BB[3]-l.lat)/(BB[3]-BB[1])*H]}
function apply(){st.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;document.documentElement.style.setProperty('--s',1/Math.max(sc,0.6));}
function fit(){const vw=innerWidth,vh=innerHeight;const span=vw<760?8:17;sc=vw/(W*span/(BB[2]-BB[0]));const cx=(35.6-BB[0])/(BB[2]-BB[0])*W,cy=(BB[3]-32.4)/(BB[3]-BB[1])*H;tx=vw/2-cx*sc;ty=(vh+90)/2-cy*sc;apply();}
function build(){DATA.forEach((p,i)=>{const [x,y]=px(p);const b=document.createElement('button');b.className='pin';b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--c',COL[p.c-1]);b.title=p.n;b.onclick=e=>{e.stopPropagation();open(i)};st.appendChild(b);const t=document.createElement('div');t.className='lbl';t.style.left=x+'px';t.style.top=y+'px';t.textContent=p.n.split('(')[0].split('/')[0].trim();st.appendChild(t);pins.push([b,t,p]);});}
function filt(){pins.forEach(([b,t,p])=>{const on=!sel||p.c===sel;b.style.display=on?'':'none';t.style.display=on&&(sc>1.15||sel)?'':'none'});}
function chips(){const c=document.getElementById('chips');const names=['Wszystkie'].concat([1,2,3,4,5,6,7,8,9].map(n=>{const x=DATA.find(d=>d.c===n);return n+'. '+(x?x.ct:'')}));names.forEach((nm,i)=>{const e=document.createElement('div');e.className='chip'+(i===0?' on':'');e.textContent=nm;e.onclick=()=>{sel=i;[...c.children].forEach((k,j)=>k.classList.toggle('on',j===i));filt();};c.appendChild(e)});}
function open(i){cur=i;const p=DATA[i];pins.forEach(([b],j)=>b.classList.toggle('act',j===i));
 pin.innerHTML=(p.img?`<img src="${p.img}" alt="${p.n}">`:'')+`<div class="k">Część ${p.c} · ${p.ct} · ${p.ref}</div><h2>${p.n}</h2><div class="sub">${p.sub}</div><p>${p.s}</p>`+p.k.map(x=>`<p>${x}</p>`).join('')+`<div class="box"><b>Jak to wyglądało · rekonstrukcja artystyczna</b><p>${p.j}</p></div><div class="box"><b>Dane</b><p>${p.d}</p></div>`;
 panel.classList.add('open');panel.scrollTop=0;document.getElementById('hint').style.display='none';
 // center
 const [x,y]=px(p);if(innerWidth>760){tx=(innerWidth-420)/2-x*sc;ty=(innerHeight+90)/2-y*sc;}else{tx=innerWidth/2-x*sc;ty=(innerHeight*0.30)-y*sc;}st.style.transition='transform .35s';apply();setTimeout(()=>st.style.transition='',380);}
document.getElementById('cl').onclick=()=>{panel.classList.remove('open');pins.forEach(([b])=>b.classList.remove('act'))};
function zoom(f,cx,cy){const n=Math.min(Math.max(sc*f,fitMin),8);const r=n/sc;tx=cx-(cx-tx)*r;ty=cy-(cy-ty)*r;sc=n;apply();filt();}
let fitMin=0.2;
vp.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.18:1/1.18,e.clientX,e.clientY)},{passive:false});
document.getElementById('zi').onclick=()=>zoom(1.4,innerWidth/2,innerHeight/2);document.getElementById('zo').onclick=()=>zoom(1/1.4,innerWidth/2,innerHeight/2);
const ptr=new Map();let last=null,dist=0;
vp.addEventListener('pointerdown',e=>{vp.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY];if(ptr.size===2){const a=[...ptr.values()];dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}});
vp.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===2){const a=[...ptr.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);zoom(d/dist,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);dist=d;}else{tx+=e.clientX-last[0];ty+=e.clientY-last[1];last=[e.clientX,e.clientY];apply();}});
['pointerup','pointercancel'].forEach(ev=>vp.addEventListener(ev,e=>{ptr.delete(e.pointerId);last=null}));
function init(){W=base.naturalWidth;H=base.naturalHeight;base.style.width=W+'px';base.style.height=H+'px';st.style.width=W+'px';st.style.height=H+'px';build();chips();fit();fitMin=sc*0.7;filt();}
if(base.complete)init();else base.onload=init;addEventListener('resize',()=>{fit();filt()});
</script></body></html>
