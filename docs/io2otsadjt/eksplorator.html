<script>
const DATA=[{"id": "c1m5", "c": 1, "ct": "Początki", "n": "Góry Araratu", "lat": 39.7, "lon": 44.3, "ref": "Rdz 8,4", "sub": "Wyżyna, na której według tradycji osiadła arka po opadnięciu wód.", "s": "Księga Rodzaju mówi, że arka osiadła na górach Araratu, czyli w starożytnym kraju Urartu. Tradycja kojarzy je z masywem nad dzisiejszą granicą Turcji i Armenii.", "k": ["Gdy wody potopu opadają, arka zatrzymuje się na górach Araratu. Noe czeka, wypuszcza kruka, a potem gołębicę, która wraca z gałązką oliwną. Po kolejnym oczekiwaniu rodzina wychodzi z arki i buduje ołtarz. Tekst wskazuje nie pojedynczy szczyt, lecz górski region. Hebrajska nazwa Ararat odpowiada asyryjskiemu Urartu, państwu leżącemu wokół jeziora Wan. Później tradycja związała tę nazwę z wysokim, dwugłowym wulkanem Ararat, który dziś wznosi się nad wschodnią Turcją i widać go także z terenu Armenii. Obecnie okolica jest niemal pustynna na zboczach, a bujna dopiero w dolinach, co ułatwia wyobrażenie sobie, że po ustąpieniu wód człowiek musiał szukać żyznej ziemi niżej.", "Geograficznie jest to wyżyna ormiańska, jeden z najwyższych obszarów Azji Zachodniej. To tutaj biorą początek zarówno Eufrat, jak i Tygrys, więc wody spływają stąd do Mezopotamii. W opowieści o potopie ma to symboliczne znaczenie: nowy świat zaczyna się u źródeł rzek, na wysokości, z której widać nizinę. Droga z Araratu na równiny Szinearu liczy w linii prostej ok. 800 km. Lokalizacja szczytu z arką pozostaje sprawą wiary i tradycji, a nie wynikiem naukowych odkryć. Dla czytelnika to dobry przykład tego, jak tradycja i geografia splatają się w jedną opowieść, bez konieczności rozstrzygania każdego szczegółu."], "j": "Rekonstrukcja artystyczna: miejsce można sobie wyobrazić jako surowy, wulkaniczny masyw: śnieg na szczytach, kamieniste zbocza i chłodne, rzadkie powietrze. Poniżej rozciągają się doliny z polami i pastwiskami. To dzisiejszy krajobraz, który pozwala odczuć, jak odległa i wysoka musiała wydawać się ta kraina mieszkańcom nizin Mezopotamii.", "d": "Masyw Ararat wznosi się na ok. 5137 m n.p.m., lokalizacja tradycyjna.", "img": null}, {"id": "c1m6", "c": 1, "ct": "Początki", "n": "Nil i kraj Micraim", "lat": 29.85, "lon": 31.25, "ref": "Rdz 10,6–14", "sub": "Egipt w Tablicy ludów: kraj wielkiej rzeki i jednego z pierwszych państw świata.", "s": "W Tablicy ludów Egipt występuje pod hebrajską nazwą Micraim, jako potomek Chama. Nil był osią życia tego kraju, a okolice Memfis symbolizują początek państwa faraonów.", "k": ["Rozdział 10 Księgi Rodzaju to Tablica ludów: lista narodów, które rozeszły się po potopie. Autor porządkuje je według rodzin Sema, Chama i Jafeta, nie według dzisiejszej etnografii, lecz według powiązań politycznych i kulturowych swojej epoki. Wśród potomków Chama wymieniony jest Micraim, czyli Egipt, oraz ludy związane z wybrzeżem Morza Śródziemnego. Tekst pokazuje, że Izrael żył wśród sąsiadów, których znał z handlu, wojen i podróży, i uważał ich za część jednej rodziny ludzkiej. Na tej mapie widać, że Egipt i Mezopotamia były dwoma biegunami starożytnego świata, połączonymi szlakami przez Kanaan, dokąd później trafią patriarchowie.", "Dla Egiptu najważniejszy był Nil, który płynie z południa na północ przez pustynię i zasila żyzną dolinę o szerokości zaledwie kilkunastu kilometrów. Coroczna powódź nanosiła muł i pozwalała zbierać plony, więc Egipt był spichlerzem regionu. Okolice Memfis, na styku doliny i delty, były miejscem zjednoczenia kraju około 3000 r. p.n.e. Odległość od Memfis do Morza Śródziemnego wynosi ok. 160 km, a od Memfis do Jerozolimy droga lądowa liczy ok. 450 km, co tłumaczy częste kontakty obu krain. Dlatego Biblia opisuje Egipt często jako miejsce ucieczki przed głodem, a zarazem miejsce próby dla Izraela."], "j": "Rekonstrukcja artystyczna: można sobie wyobrazić szeroką rzekę w wąskim pasie zieleni. Po obu stronach wznoszą się żółtawe klify pustyni, a wzdłuż brzegu stoją pola, palmy i niskie domy z cegły. Na wodzie płyną drewniane łodzie z żaglem. Kontrast między zielenią a piaskiem pozwala zrozumieć, dlaczego dla Egipcjan Nil był darem.", "d": "Nil ma ok. 6650 km długości, a dolina w Egipcie ma często zaledwie ok. 10–20 km szerokości.", "img": null}, {"id": "c1m7", "c": 1, "ct": "Początki", "n": "Niniwa", "lat": 36.36, "lon": 43.15, "ref": "Rdz 10,11–12", "sub": "Miasto nad górnym Tygrysem, później stolica Asyrii.", "s": "Tablica ludów wymienia Niniwę wśród miast założonych w krainie Aszur. Jej ruiny leżą przy dzisiejszym Mosulu w Iraku.", "k": ["Księga Rodzaju wspomina Niniwę w kontekście Nimroda, legendarnego myśliwego i władcy, o którym mówi się, że z krainy Szinear poszedł do Aszuru i tam budował miasta. Wśród nich wymieniona jest Niniwa. W dalszej części Biblii miasto jeszcze wróci: prorok Jonasz zostanie posłany, aby wezwać jego mieszkańców do nawrócenia, a Nahum zapowie jego upadek. Tekst z Księgi Rodzaju jest więc krótką wzmianką, ale wyznacza geograficzny kierunek: od równin południowych ku północnej Asyrii. Za sprawą Księgi Jonasza Niniwa stała się też symbolem miasta wezwanego do nawrócenia, co nadaje tej wzmiance z Księgi Rodzaju dodatkowy ciężar.", "Niniwa leżała nad wschodnim brzegiem Tygrysu, w miejscu, gdzie rzeka opuszcza górzyste tereny i wpływa na bardziej płaską nizinę. To położenie dawało dostęp do wody, żyznej ziemi i szlaków prowadzących do Anatolii oraz Syrii. Za Sennacheryba, ok. 700 r. p.n.e., miasto stało się stolicą imperium, otoczone murami o długości kilkunastu kilometrów. Odkryto tam bibliotekę Aszurbanipala z tysiącami glinianych tabliczek. Lokalizacja Niniwy jest pewna i potwierdzona wykopaliskami na wzgórzach Kujundżik i Nabi Junus. Dziś część ruin znajduje się w sąsiedztwie wielkiego miasta, co utrudnia pracę archeologów, a jednak nadal przynosi nowe odkrycia."], "j": "Rekonstrukcja artystyczna ukazuje potężne miasto z murami z cegły, wielkimi bramami i pałacami na wzgórzu. Przed bramą kręcą się kupcy z osłami i wozami. W tle płynie szeroki Tygrys, a ogrody dają cień wokół pałaców. Całość jest wyobrażeniem opartym na odkryciach archeologicznych i reliefach asyryjskich, a nie dokładnym obrazem jednego momentu.", "d": "Mury Niniwy miały według badań ok. 12 km obwodu; miasto leży ok. 400 km od Babilonu.", "img": null}, {"id": "c1m8", "c": 1, "ct": "Początki", "n": "Uruk (Erek)", "lat": 31.32, "lon": 45.64, "ref": "Rdz 10,10", "sub": "Jedno z pierwszych wielkich miast świata, kolebka pisma.", "s": "Uruk, w Biblii Erek, wymieniony jest wśród początków królestwa Nimroda. Archeologia pokazuje w nim jedno z najstarszych miast i miejsce narodzin pisma.", "k": ["Księga Rodzaju mówi, że początek królestwa Nimroda stanowiły Babel, Erek, Akkad i Kalne w krainie Szinear. Erek to Uruk, miasto o niezwykłej roli w historii ludzkości. Tutaj około 3300 r. p.n.e. powstały pierwsze znaki pisma, początkowo służące zapisom gospodarczym. Wśród legendarnych władców Uruk wymienia się Gilgamesza, bohatera słynnego eposu. Biblijny autor wspomina o miastach Szinearu, aby pokazać, że ludzie bardzo wcześnie zaczęli budować państwa i prowadzić politykę. Dzięki tym informacjom Uruk jest dla nas dowodem, że miejska cywilizacja Biblii nie jest bajką, lecz realnym tłem opowieści o początkach państw i władzy.", "Uruk leżał przy dawnym biegu Eufratu, w niskiej, żyznej, ale pozbawionej kamienia i drewna Mezopotamii południowej. Mieszkańcy budowali z cegły z gliny i opierali się na systemie kanałów nawadniających. Miasto mogło liczyć dziesiątki tysięcy mieszkańców, a mury, według tradycji sumeryjskiej, miały ok. 9 km długości. Dziś ruiny, zwane Warka, leżą na pustyni, ponieważ Eufrat zmienił bieg, co pokazuje, jak bardzo życie miast zależało od wody. Epos o Gilgameszu, związany z tym miastem, pokazuje zarazem, jak starożytni ludzie szukali odpowiedzi na pytania o śmierć i sens życia."], "j": "Rekonstrukcja artystyczna przedstawia gęsto zabudowane miasto z cegły mułowej, z wysokim tarasem świątynnym nad dachami. Ulice są wąskie, a wokół widać zielone pasy ogrodów przy kanałach. Na dalszym planie płyną trzcinowe łodzie, a rolnicy prowadzą osły z koszami zboża. Kolory ziemi i błękit kanałów dają wrażenie ciepłego, suchego klimatu.", "d": "Uruk liczył według badań ok. 5 km² powierzchni i ok. 40 tys. mieszkańców w apogeum, ok. 3000 r. p.n.e.", "img": null}, {"id": "c1m9", "c": 1, "ct": "Początki", "n": "Eridu", "lat": 30.82, "lon": 45.99, "ref": "Rdz 10,10; 11,2", "sub": "Jedno z najstarszych miast Sumeru, nad dawną lagunę Zatoki Perskiej.", "s": "Eridu uchodzi według tradycji sumeryjskiej za najstarsze miasto świata. Leżało w krainie Szinear, o której mówi Księga Rodzaju w opowieści o osadnikach na równinie.", "k": ["Gdy Księga Rodzaju opisuje potomków Noego, mówi, że ludzie wędrujący ze wschodu znaleźli równinę w krainie Szinear i tam zamieszkali. Szinear to biblijne określenie południowej Mezopotamii, czyli Sumeru i Akadu. Jednym z pierwszych tamtejszych ośrodków było Eridu, dziś ruiny Abu Szahrajn. Sumerowie uważali je za miasto, w którym po raz pierwszy rozpoczęto życie osiadłe i wzniesiono świątynię boga Enki. Biblijny tekst nie wymienia go z nazwy, ale opisuje środowisko, w którym takie miasta powstały. Ta zmiana linii brzegowej pokazuje, że krajobraz opisany w Biblii był dynamiczny, a rzeki potrafiły tworzyć i zamieniać całe krainy w ciągu kilku tysiącleci.", "Eridu leżało wtedy blisko linii brzegowej Zatoki Perskiej, wśród bagien i lagun, które wypełniały ujście Eufratu. Dziś linia brzegowa jest o ok. 200 km dalej na południe, bo rzeki naniosły ogromne ilości mułu. Okolice były żyzne, ale pozbawione kamienia i drewna, dlatego mieszkańcy handlowali z górami na północy i wschodzie. Archeolodzy odkryli tu warstwy świątyni budowanej kolejno przez wiele stuleci, począwszy od ok. 5000 r. p.n.e. Nie ma pewności, czy autor biblijny znał Eridu z nazwy, lecz znał niewątpliwie cały krąg kulturowy, do którego należało."], "j": "Rekonstrukcja artystyczna ukazuje małe miasto na skraju bagien: domy z trzciny i cegły, niewielka świątynia na podwyższeniu i wąskie łodzie pływające między trzcinowiskami. Rano nad wodą unosi się mgła, a na brzegu suszą się sieci. Obraz jest wyobrażeniem opartym na odkryciach z Abu Szahrajn i na krajobrazie bagien południowego Iraku.", "d": "Warstwy świątyni w Eridu sięgają ok. 5000 r. p.n.e., a obecne ruiny leżą ok. 200 km od morza.", "img": null}, {"id": "c1m10", "c": 1, "ct": "Początki", "n": "Wieża Babel w Babilonie", "lat": 32.54, "lon": 44.42, "ref": "Rdz 11,1–9", "sub": "Miasto z cegły i smoły, wieża sięgająca nieba i rozproszenie języków.", "s": "Ludzie osiadli w Szinearze postanawiają zbudować miasto i wieżę, aby zdobyć sławę. Bóg miesza ich języki, a ludzie rozchodzą się po ziemi.", "k": ["Opowieść mówi, że wszyscy ludzie mieli jeden język i jedne słowa. Przybywszy na równinę Szinear, postanowili wypalić cegły, użyć smoły zamiast zaprawy i zbudować miasto z wieżą sięgającą nieba, aby zdobyć sobie imię i nie rozproszyć się po ziemi. Bóg zstępuje, aby zobaczyć ich dzieło, i miesza ich mowę. Budowa zostaje przerwana, a miasto otrzymuje nazwę Babel. Tekst jest przestrogą przed pychą wspólnoty, która chce zastąpić Boga własnym dziełem. Później prorocy i psalmiści będą nawiązywać do Babilonu jako do symbolu potęgi wrogiej Bogu, ale także miejsca, gdzie lud Izraela przeżyje wygnanie.", "Gra słów w tekście łączy hebrajskie słowo oznaczające pomieszanie z nazwą Babel, czyli Babilon. Miasto leżało nad Eufratem, ok. 85 km na południe od dzisiejszego Bagdadu. Wieża przypomina ziggurat Etemenanki, świątynię schodkową wzniesioną w Babilonie z wypalanych cegieł, z użyciem bitumenu, naturalnej smoły z tamtejszych źródeł. Tak wyglądało budownictwo całej równiny: brak kamienia wymuszał stosowanie cegły. Dzięki temu autor biblijny, znając babilońskie realia, nadał opowieści wyraźny koloryt lokalny. Dla czytelników chrześcijańskich opowieść o pomieszaniu języków jest dopełniona przez wydarzenie Pięćdziesiątnicy, w którym ludzie różnych narodów rozumieją jedno przesłanie."], "j": "Rekonstrukcja artystyczna przedstawia ogromną wieżę schodkową z cegły, wznoszącą się nad miastem, z szerokimi rampami i rusztowaniami z bali. U jej stóp widać tłum robotników, wozy z cegłami i kanały. Nad brzegiem płynie Eufrat. Całość jest interpretacją opartą na wykopaliskach ziguratów i opisach starożytnych źródeł, a nie fotografią jednej konkretnej budowli.", "d": "Ziguraty Mezopotamii miały zwykle od 3 do 7 pięter, a ruiny Babilonu leżą ok. 85 km od Bagdadu.", "img": "img/c1m10.webp"}, {"id": "c1m11", "c": 1, "ct": "Początki", "n": "Ur Chaldejskie", "lat": 30.96, "lon": 46.1, "ref": "Rdz 11,27–31", "sub": "Rodzinne miasto Abrama, nad Eufratem, z wielką świątynią księżyca.", "s": "Terach, ojciec Abrama, mieszka w Urze Chaldejskim i stamtąd wyrusza w stronę Kanaanu. Ur był bogatym miastem handlowym i religijnym z ziguratem boga księżyca.", "k": ["Rozdział 11 przechodzi od opowieści o ludach do historii jednej rodziny. Terach, jego synowie Abram, Nachor i Haran oraz żona Abrama, Saraj, mieszkają w Urze Chaldejskim. Haran umiera w rodzinnym mieście, a Terach wyrusza z częścią rodziny w stronę Kanaanu, lecz zatrzymuje się w Charanie i tam umiera. Dla czytelnika to ważny moment: od uniwersalnej opowieści o ludzkości Biblia schodzi do jednego rodu, z którego rozwinie się lud Izraela. Dzięki temu możemy uznać, że wezwanie Abrama oznaczało rezygnację z pewnego, zamożnego życia w jednym z najbardziej rozwiniętych miast świata.", "Ur leżał nad Eufratem na południu Mezopotamii i był jednym z największych ośrodków miejskich epoki. Wykopaliska ujawniły ziggurat boga księżyca Nanny, zasobne groby królewskie i tabliczki z zapisami handlowymi. Mieszkańcy handlowali wełną, zbożem i metalami z oddalonymi krainami. Według zapisów Ur przeżywał rozkwit około 2100 r. p.n.e., więc przypuszczalny czas Abrama odpowiada okresowi wielkości miasta. Sama nazwa Chaldejczyków pojawia się później, co autorzy tłumaczą jako uaktualnienie nazwy dla czytelnika. To nadaje jego wędrówce wiarygodny i ludzki wymiar: opuszczał dom, który dawał bezpieczeństwo, a nie ruiny czy wieś."], "j": "Rekonstrukcja artystyczna ukazuje miasto z szerokim ziguratem na wzgórzu, otoczone zwartą zabudową z cegły i palmami daktylowymi. Ulicą przechodzi kupiec z osłem, a w tle świeci słońce nad Eufratem. Obraz opiera się na wykopaliskach Ur, w tym na zachowanej podstawie ziguratu. Postacie są niewielkie i widoczne z oddali, a detale ubiorów są przypuszczalne.", "d": "Ziggurat w Ur miał podstawę ok. 64 × 45 m, a miasto leży ok. 300 km od Zatoki Perskiej wzdłuż dawnej linii brzegowej.", "img": "img/c1m11.webp"}, {"id": "c1m12", "c": 1, "ct": "Początki", "n": "Charan", "lat": 36.87, "lon": 39.03, "ref": "Rdz 11,31–32; 12,4", "sub": "Miasto na szlaku handlowym, w którym zatrzymuje się rodzina Teracha.", "s": "Terach z rodziną osiada w Charanie i tam umiera. Z tego miasta Abram, według dalszego tekstu, wyruszy do Kanaanu.", "k": ["Po wyjściu z Ur rodzina Teracha dociera do Charanu i tam postanawia pozostać. Terach umiera w wieku dwustu pięciu lat. W następnym rozdziale Bóg wzywa Abrama, aby opuścił swoją ziemię i dom ojca, i obiecuje mu błogosławieństwo oraz potomstwo. Abram, mając siedemdziesiąt pięć lat, wyrusza z żoną Saraj, bratankiem Lotem i dobytkiem. Charan staje się więc ostatnim przystankiem przed właściwą wędrówką do Kanaanu i początkiem historii przymierza. Tradycja izraelska zapamiętała Charan jako dom rodziny Nachora i miejsce, skąd Izaak i Jakub będą szukać żon, co pokazuje trwałość więzi rodzinnych.", "Charan leżał nad rzeką Balich, dopływem Eufratu, w północnej Mezopotamii. Przez to miasto przebiegały szlaki handlowe łączące Mezopotamię z Syrią i Anatolią, więc było ważnym ośrodkiem karawan. Odległość z Ur do Charanu wynosi w linii prostej ok. 900 km, a wędrówka wzdłuż Eufratu trwała wiele tygodni. Miasto było też centrum kultu boga księżyca, podobnie jak Ur. Dzisiaj leży przy granicy turecko-syryjskiej, a w okolicy stoją charakterystyczne domy w kształcie kopuł z cegły. W ten sposób to miasto staje się mostem między pradziejami z początków Biblii a historią patriarchów, której poświęcona jest następna część atlasu."], "j": "Rekonstrukcja artystyczna: wyobraź sobie otwartą równinę z miastem otoczonym murem, studnią i szlakiem, którym podążają karawany z osłami. Okolica jest sucha, ale zielona wzdłuż rzeki. Wokół miasta pasą się stada, a wieczorem kobiety czerpią wodę ze studni.", "d": "Droga z Ur do Charanu liczy w linii prostej ok. 900 km; Charan leży ok. 40 km od Szanliurfy.", "img": null}, {"id": "c2m1", "c": 2, "ct": "Patriarchowie", "n": "Ur w Chaldei", "lat": 30.96, "lon": 46.1, "ref": "Rdz 11,27–12,3", "sub": "Stąd Abram wyrusza za głosem, który obiecuje mu ziemię i wielki naród.", "s": "Abram mieszka w Ur, bogatym mieście nad Eufratem, gdy otrzymuje wezwanie do opuszczenia rodzinnego kraju. Wyrusza z ojcem Terachem i bliskimi, nie wiedząc dokładnie, dokąd go ta droga zaprowadzi.", "k": ["Rodzina Teracha pochodzi z Ur Chaldejskiego. Według Księgi Rodzaju Terach wyprowadza swoich bliskich, między innymi syna Abrama, wnuka Lota i synową Saraj, i kieruje się ku Kanaan. Wędrówka urywa się jednak w Charanie, gdzie rodzina się osiedla. Dopiero tam Abram słyszy wezwanie, by opuścić ziemię rodzinną i dom ojca, a w zamian otrzymuje obietnicę potomstwa, błogosławieństwa i kraju. Tekst nie opisuje powodów wyjazdu, lecz pokazuje, że decyzja oznaczała zerwanie z całym dotychczasowym zapleczem społecznym.", "Ur leżało w południowej Mezopotamii, w pobliżu starego koryta Eufratu, niedaleko dawnego wybrzeża Zatoki Perskiej. Okolica była płaska, nawadniana kanałami i bardzo urodzajna, więc miasto bogaciło się na handlu i rolnictwie. Droga na północny zachód prowadziła wzdłuż Eufratu, przez Babilonię i dalej ku Syrii. Taki szlak liczył ponad tysiąc kilometrów i dawał stały dostęp do wody, lecz oznaczał także mijanie osad władców, którzy pobierali opłaty od karawan. Dlatego wyprawa rodziny była przedsięwzięciem wymagającym planowania."], "j": "Rekonstrukcja artystyczna ukazuje miasto z cegły suszonej i wypalanej, otoczone polami zbóż i palmami daktylowymi. Ponad dachami wznosi się wielostopniowa wieża świątynna zwana zigguratem, widoczna z daleka na płaskiej równinie. Wąskie uliczki wiją się między domami z podwórzami, a kanały łączą dzielnice z rzeką. Przy nabrzeżu cumują trzcinowe i drewniane łodzie z towarami. Archeolodzy odkryli w Ur bogate groby i zabudowania z początku trzeciego i drugiego tysiąclecia przed Chrystusem.", "d": "Odległość Ur–Charan wzdłuż Eufratu: ok. 1000–1200 km.", "img": null}, {"id": "c2m2", "c": 2, "ct": "Patriarchowie", "n": "Charan", "lat": 36.87, "lon": 39.03, "ref": "Rdz 11,31–12,5", "sub": "Miasto na północy Mezopotamii, gdzie Abram zostaje do śmierci ojca i stąd rusza dalej.", "s": "W Charanie rodzina Teracha zatrzymuje się na dłużej, a Abram po śmierci ojca wyrusza w stronę Kanaan. Później do tego rejonu wracają Izaak i Jakub, aby szukać żon wśród krewnych.", "k": ["Charan jest miejscem postoju, które staje się punktem wyjścia. Gdy Terach umiera, Abram zabiera żonę Saraj, bratanka Lota, całe zgromadzone mienie oraz ludzi zdobytych w Charanie i rusza na południe. Tradycja biblijna nazywa okolice Aram Naharaim, czyli krainą u rzek. Sługa Abrahama szuka tutaj później żony dla Izaaka, a Jakub ucieka tu przed gniewem brata Ezawa. Rodzina więc przez pokolenia utrzymuje więzi z tym krajem i pamięta o swoich korzeniach.", "Charan leżał nad rzeką Belich, dopływem Eufratu, na północy dzisiejszej Syrii i południu Turcji. Okolica ma klimat półpustynny, jednak łagodne wzgórza i równiny dają dobre pastwiska dla owiec i kóz. Miasto stało na skrzyżowaniu szlaków prowadzących do Anatolii, Syrii i Mezopotamii, co czyniło je ważnym ośrodkiem handlu. Stąd do Kanaan wiodła droga przez Aleppo i Damaszek, licząca ok. 800–900 km. Dla stad poruszających się powoli oznaczało to wędrówkę trwającą kilka tygodni.", "Lokalizację Charanu ze współczesnym miastem Harran w Turcji uznaje większość badaczy."], "j": "Rekonstrukcja artystyczna pokazuje gród na lekko wzniesionej równinie, z murami z cegły i kamienia oraz skupiskiem domów wokół świątyni. Wokół rozciągają się pola i pastwiska, a przy studniach gromadzą się pasterze z owcami. Ścieżki zbiegają się przy bramie miejskiej, gdzie karawany osłów rozładowują towary. Zimą wieje tu chłodny wiatr, latem upał jest dotkliwy. Przez miasto przebiegały ważne trasy handlowe.", "d": "Charan do Sychem: ok. 700–800 km w linii prostej i więcej drogą.", "img": null}, {"id": "c2m3", "c": 2, "ct": "Patriarchowie", "n": "Sychem", "lat": 32.21, "lon": 35.28, "ref": "Rdz 12,6–7; 33,18–20; 34", "sub": "Pierwszy przystanek Abrama w Kanaan, między górami Garizim i Ebal.", "s": "Abram dociera do Sychem i tam otrzymuje obietnicę, że ta ziemia przypadnie jego potomstwu. Później Jakub kupuje tu kawałek pola, a w mieście dochodzi do tragicznych wydarzeń z udziałem jego rodziny.", "k": ["Po przybyciu do Kanaan Abram przechodzi przez kraj aż do miejsca zwanego Sychem, w pobliżu wielkiego drzewa More. Mieszkają tam wtedy Kananejczycy. W tym miejscu Bóg ponawia obietnicę ziemi dla potomstwa, a patriarcha buduje ołtarz. Wiele lat później Jakub, wracając z Charanu, rozbija obóz przed miastem i kupuje działkę od synów Chamora. Rozdział 34 opowiada o konflikcie, który wybucha po zhańbieniu Diny i prowadzi do przemocy synów Jakuba. Sychem pozostaje więc miejscem obietnicy i bolesnej pamięci.", "Sychem leży w dolinie między dwoma górami, Garizim i Ebal, które wznoszą się ponad nią na kilkaset metrów. Przez to miejsce biegnie główna północno-południowa droga grzbietem gór Efraima, wygodniejsza i bezpieczniejsza niż nizinne szlaki, gdzie panowały miasta-państwa. Obfite źródła zapewniały wodę, a stoki sprzyjały uprawom oliwek i zbóż. Dlatego było to naturalne miejsce na postój dla pasterzy. Z Sychem do Betel jest ok. 30 km na południe, czyli dzień lub dwa marszu ze stadami.", "Nazwa Sychem wiąże się z dzisiejszym Tell Balata koło Nablusu."], "j": "Rekonstrukcja artystyczna ukazuje wąską dolinę z dwiema stromymi górami po bokach. U podnóża rośnie gaj oliwny, a na pagórku stoi otoczone murem miasto z wieżą bramną. Obok drogi pasterze poją stada przy studni. W oddali na szczytach widać skaliste zbocza porośnięte rzadką roślinnością. Wiosną dolina jest zielona, a latem sucha i złocista. Namioty patriarchy stoją na uboczu, poza murami osady.", "d": "Wysokość gór: Garizim ok. 881 m n.p.m., Ebal ok. 940 m n.p.m.", "img": null}, {"id": "c2m4", "c": 2, "ct": "Patriarchowie", "n": "Mamre koło Hebronu", "lat": 31.55, "lon": 35.11, "ref": "Rdz 13,18; 18,1–15", "sub": "Pod wielkim drzewem Abraham przyjmuje trzech tajemniczych gości.", "s": "W Mamre Abraham zatrzymuje się na stałe i buduje ołtarz. Tam też gości trzech wędrowców, którzy zapowiadają narodziny syna.", "k": ["Po rozstaniu z Lotem Abram przenosi namioty do gaju Mamre koło Hebronu i buduje tam ołtarz. W upalne południe, gdy siedzi przy wejściu do namiotu, widzi trzech mężczyzn. Biegnie im naprzeciw, kłania się, każe przynieść wodę do obmycia stóp i prosi Sarę o upieczenie chleba. Posiłek składa się z mleka, masła i cielęciny. Goście zapowiadają, że za rok Sara urodzi syna. Sara, słysząc to przy namiocie, śmieje się, a imię Izaak będzie przypominać ten śmiech. Tradycja chrześcijańska widzi w scenie gościnność jako cnotę.", "Hebron leży na wysokości ok. 900 m n.p.m., na wododziale gór Judei, gdzie opady są wyższe niż na pustyni, a gleby nadają się do upraw winorośli i oliwek. Zimą bywa chłodno, latem upał łagodzi wysokość. Przez okolicę biegnie droga grzbietowa łącząca Beer-Szebę z Jerozolimą, długa na ok. 70 km. Wiekowe drzewa dawały cień, a studnie i pastwiska pozwalały utrzymać duże stada. Dlatego Mamre było idealnym miejscem na stały obóz rodziny, położonym bezpiecznie z dala od wielkich miast."], "j": "Rekonstrukcja artystyczna przedstawia upalne południe. Stary, rozłożysty dąb rzuca głęboki cień na namiot z czarnej koziej wełny. Przed nim siedzi starszy mężczyzna, w oddali nadchodzą trzy postacie. Wokół pasą się owce i kozy, a na stoku wzgórza rosną winnice i drzewa oliwne. Powietrze drga od gorąca, ziemia jest sucha, a niebo wyblakłe. Wszystko dzieje się w ciszy pasterskiego popołudnia.", "d": "Hebron leży ok. 900 m n.p.m., ok. 30 km na południe od Jerozolimy.", "img": "img/c2m4.webp"}, {"id": "c2m5", "c": 2, "ct": "Patriarchowie", "n": "Sodoma i Gomora nad Morzem Martwym", "lat": 31.2, "lon": 35.45, "ref": "Rdz 13,10–13; 18,16–19,29", "sub": "Dolina Jordanu, którą wybrał Lot, kończy się katastrofą miast równiny.", "s": "Lot wybiera urodzajną okolicę Jordanu i osiada w pobliżu Sodomy. Po zagładzie miast Abraham z oddali patrzy na dym unoszący się nad doliną.", "k": ["Gdy pasterze Abrama i Lota zaczynają się spierać o pastwiska, Abram proponuje rozstanie. Lot wybiera dobrze nawodnioną równinę Jordanu, która przypomina mu ogród, i rozbija namioty koło Sodomy. Mieszkańcy miasta są opisani jako okrutni wobec obcych. Abraham wstawia się za nimi u Boga, lecz sprawiedliwych jest za mało. Lot ucieka z córkami, a miasta Sodoma i Gomora ulegają zniszczeniu. Rankiem Abraham ogląda z góry dym unoszący się jak z pieca. Opowieść ma wymiar moralny, a nie turystyczny.", "Dolina Jordanu leży najniżej na świecie: brzeg Morza Martwego znajduje się ok. 430 m poniżej poziomu morza. Klimat jest tu gorący i suchy, a woda w morzu zawiera ok. dziesięciokrotnie więcej soli niż w oceanie. W okolicy występują naturalne bitum i siarka, co tłumaczy biblijne obrazy ognia i smoły. Z Hebronu do brzegu jezior jest ok. 40 km w dół zboczy, co tłumaczy, że Abraham mógł obserwować dolinę z wysokości. Dokładne położenie miast jest niepewne; tradycja umieszcza je na południu lub wschodzie akwenu."], "j": "Rekonstrukcja artystyczna ukazuje dolinę o poranku, widzianą z wysokiego grzbietu. W dole błyszczy gładka tafla słonego morza, otoczona białymi osadami soli i nagimi klifami. Z równiny unosi się smuga ciemnego dymu. Bliżej widać kamienistą ścieżkę, a na niej samotną postać patrzącą w dół, odwróconą plecami. Powietrze jest gęste od mgły, a światło wschodzącego słońca czerwieni skały po drugiej stronie.", "d": "Poziom Morza Martwego: ok. 430 m poniżej poziomu morza; długość akwenu ok. 50 km.", "img": "img/c2m5.webp"}, {"id": "c2m6", "c": 2, "ct": "Patriarchowie", "n": "Beer-Szeba", "lat": 31.25, "lon": 34.79, "ref": "Rdz 21,22–34; 22; 26,23–33", "sub": "Studnia przysięgi na skraju pustyni, ważny przystanek Abrahama i Izaaka.", "s": "W Beer-Szebie Abraham zawiera układ z Abimelekiem o studnię i sadzi tamaryszek. Później Izaak odnawia tu studnie i ponownie otrzymuje obietnicę.", "k": ["Nazwa Beer-Szeba kojarzy się ze studnią i przysięgą. Abimelek, władca z okolic Gerar, i jego dowódca zawierają z Abrahamem układ, w którym uznają jego prawo do studni wykopanej własnymi rękami. Patriarcha sadzi tamaryszek i wzywa imienia Pana. Stąd wyrusza na górę wskazaną przy ofierze Izaaka. Wiele lat później Izaak odnawia zasypane studnie i otrzymuje obietnicę wsparcia. Studnia oznacza tu życie, prawo własności i pokój z sąsiadami.", "Beer-Szeba leży na styku Negebu i pasa uprawnego, w miejscu, gdzie roczne opady wynoszą jedynie ok. 200 mm. Dlatego dostęp do studni decydował o przeżyciu stad. Ta okolica była południowym krańcem ziemi zamieszkanej w sposób stały, stąd późniejsze określenie „od Dan aż po Beer-Szebę”. Droga do Hebronu liczy ok. 45 km i wiedzie przez suche wzgórza. Pasterze przemierzali ją sezonowo, szukając trawy po zimowych deszczach. Stanowisko Tell es-Seba położone jest kilka kilometrów od współczesnego miasta."], "j": "Rekonstrukcja artystyczna ukazuje szeroką, jasną równinę pod bezchmurnym niebem. Pośrodku znajduje się kamienna studnia z drewnianym kołowrotem i korytami dla zwierząt. Obok rośnie samotny tamaryszek, a wokół pasą się owce. Na horyzoncie rysują się niskie wzgórza koloru piasku, a dalej suchy step. Pasterze czerpią wodę w skórzanych wiadrach i rozmawiają przy brzegu kamiennej cembrowiny.", "d": "Beer-Szeba do Hebronu: ok. 45 km; opady ok. 200 mm rocznie.", "img": null}, {"id": "c2m7", "c": 2, "ct": "Patriarchowie", "n": "Machpela w Hebronie", "lat": 31.52, "lon": 35.11, "ref": "Rdz 23; 25,7–10; 49,29–32", "sub": "Jedyny kawałek ziemi, który Abraham kupuje, by pochować Sarę.", "s": "Po śmierci Sary Abraham negocjuje z Hetytami zakup jaskini Machpela. Tu spoczną także Abraham, Izaak, Rebeka, Lea i Jakub.", "k": ["Sara umiera w Kiriat-Arba, czyli w Hebronie. Abraham, jako przybysz, nie ma własnego grobu. Staje przed zgromadzeniem mieszkańców miasta i prosi o możliwość zakupu. Efron proponuje pole wraz z jaskinią, lecz patriarcha nalega na ustalenie ceny, aby sprawa została uczciwie przypieczętowana. Płaci czterysta syklów srebra, a transakcja odbywa się publicznie, przy bramie miasta. Tak powstaje rodzinny grób, w którym później złożono także Abrahama, Izaaka, Rebekę, Leę i Jakuba.", "Hebron leży ok. 30 km na południe od Jerozolimy, na wysokości ok. 900 m, w jednym z najstarszych ośrodków osadniczych Judei. Okolica jest górzysta, kamienista i pełna naturalnych jaskiń wapiennych, które często służyły jako grobowce. Tradycja lokalizuje Machpelę pod budowlą z czasów Heroda, która do dziś otacza miejsce czczone przez żydów, chrześcijan i muzułmanów. Mur herodiański ma ok. 60 m długości i jest wyraźnie widoczny. Dokładny układ jaskiń pozostaje niedostępny dla pełnych badań archeologicznych."], "j": "Rekonstrukcja artystyczna przedstawia pole na zboczu wzgórza, z rzędem drzew oliwnych i niskim kamiennym murkiem. W skalnej ścianie otwiera się wąskie wejście do jaskini, zasłonięte płaskim głazem. Poniżej biegnie droga prowadząca do miasta o kamiennych, płaskich dachach. W zachodzącym słońcu wszystko nabiera złotej barwy. Atmosfera jest cicha, pełna powagi i żałoby.", "d": "Cena pola ok. 400 syklów srebra; Hebron ok. 900 m n.p.m.", "img": null}, {"id": "c2m8", "c": 2, "ct": "Patriarchowie", "n": "Betel – sen Jakuba", "lat": 31.93, "lon": 35.22, "ref": "Rdz 28,10–22; 35,1–15", "sub": "Uciekinier śpi na kamieniu i widzi niebo otwarte nad ziemią.", "s": "Jakub, uciekając przed Ezawem, nocuje w polu koło Luz i ma sen o drabinie sięgającej nieba. Nazywa to miejsce Betel, czyli domem Boga.", "k": ["Jakub wyrusza z Beer-Szeby do Charanu, aby uniknąć zemsty brata i znaleźć żonę wśród krewnych. Gdy zapada zmierzch, zatrzymuje się na noc, kładzie głowę na kamieniu i śni o drabinie. Aniołowie wchodzą i schodzą, a Bóg odnawia obietnicę daną Abrahamowi i Izaakowi. Po przebudzeniu Jakub stawia kamień jako pamiątkę, namaszcza go oliwą i nadaje miejscu nazwę Betel. Po latach wraca tu na wezwanie Boga, aby wypełnić ślub.", "Betel leży na grzbiecie gór środkowej Palestyny, ok. 17 km na północ od Jerozolimy, na wysokości ok. 880 m n.p.m. Kamienisty teren, rzadkie drzewa i brak wygodnych schronień sprawiały, że samotny wędrowiec spał pod gołym niebem. Droga grzbietowa łączyła Hebron z Sychem i była główną trasą Palestyny. Jakub przebył z Beer-Szeby do Betel ok. 100 km, co odpowiada kilku dniom marszu. Identyfikacja z wioską Bajtin jest powszechnie przyjmowana."], "j": "Rekonstrukcja artystyczna ukazuje wieczorne niebo nad kamienistym wzgórzem. Samotna postać śpi na ziemi, z głową na płaskim kamieniu, widziana z dużej odległości. Nad nią jasna smuga światła rozchyla chmury, tworząc schodzący ku ziemi wachlarz promieni. Dookoła leżą głazy, rośnie kilka kolczastych krzewów. Daleko w dole majaczy łagodna dolina. W powietrzu panuje ciepła noc po upalnym dniu.", "d": "Betel: ok. 880 m n.p.m., ok. 17 km na północ od Jerozolimy.", "img": "img/c2m8.webp"}, {"id": "c2m9", "c": 2, "ct": "Patriarchowie", "n": "Jabbok i Penuel", "lat": 32.19, "lon": 35.69, "ref": "Rdz 32,23–33", "sub": "Nocna walka nad brodem Jabboku zmienia imię Jakuba na Izrael.", "s": "Wracając do Kanaan, Jakub przeprawia rodzinę przez bród nad Jabbokiem i zostaje sam. W nocy zmaga się z tajemniczym przeciwnikiem i otrzymuje nowe imię.", "k": ["Wracając po latach z Charanu, Jakub dowiaduje się, że Ezaw idzie mu naprzeciw z czterystoma ludźmi. W nocy przeprawia żony, dzieci i dobytek przez bród Jabboku, sam zostaje po drugiej stronie. Tam zmaga się do świtu z tajemniczą postacią, która dotyka jego biodra i zmienia imię patriarchy na Izrael. Rano Jakub nazywa miejsce Penuel, bo widział Boga twarzą w twarz, i kuleje przez resztę życia. Następnego dnia spotyka brata w pojednaniu.", "Jabbok, dziś Nahr az-Zarqa, to dopływ Jordanu płynący z gór Gileadu na wschodzie. Rzeka wcina się w głęboki, skalisty jar, a w porze suchej można ją przejść w kilku miejscach. Penuel stało w pobliżu brodu, ok. 10 km na wschód od Jordanu. Z Charanu do Penuel jest ok. 600 km w linii prostej, więc podróż ze stadami zajęła wiele tygodni. Dokładne ustalenie położenia jest niepewne; często wskazuje się Tulul edh-Dhahab nad dolnym biegiem rzeki."], "j": "Rekonstrukcja artystyczna przedstawia głęboki jar o zmierzchu. Nad kamiennymi brzegami płynie płytka, bystra woda, a po drugiej stronie widać tabun zwierząt i kilka namiotów. Na pierwszym planie, w mroku, dwie ciemne sylwetki splecione w walce, widoczne z daleka. Niebo na wschodzie jaśnieje, zwiastując świt. Zbocza porastają krzewy oleandrów, a w powietrzu unosi się chłód nocy.", "d": "Jabbok ma ok. 100 km długości; Penuel leży ok. 10 km na wschód od Jordanu.", "img": "img/c2m9.webp"}, {"id": "c2m10", "c": 2, "ct": "Patriarchowie", "n": "Dotan", "lat": 32.41, "lon": 35.24, "ref": "Rdz 37,12–36", "sub": "W pobliżu cystern i szlaku karawan bracia sprzedają Józefa.", "s": "Józef szuka braci wypasających owce i znajduje ich w Dotanie. Zazdrośni wrzucają go do suchej cysterny, a potem sprzedają kupcom jadącym do Egiptu.", "k": ["Jakub wysyła Józefa z Hebronu, aby sprawdził, jak mają się bracia. Józef idzie przez Sychem i dowiaduje się, że stada przeszły do Dotanu. Bracia widzą go z daleka, ubranego w wyróżniającą szatę, i postanawiają się go pozbyć. Zrzucają go do pustej cysterny. Gdy przejeżdża karawana kupców ismaelickich, wyciągają Józefa i sprzedają za dwadzieścia srebrników. Ojcu przynoszą zakrwawioną szatę, a ten pogrąża się w żałobie.", "Dotan leży w dolinie na północ od Sychem, ok. 25 km w linii prostej. Przez nią przechodziła droga łącząca Dolinę Jezreel z wybrzeżem i dalej z Egiptem, więc karawany z balsamem i żywicą przejeżdżały tędy regularnie. Dolina ma urodzajne pastwiska otoczone wzgórzami, a w skałach wykuwano cysterny do gromadzenia wody. Z Hebronu do Dotanu jest ok. 100 km, a do Egiptu ponad 400 km. Tell Dotan został zbadany archeologicznie i wykazuje osadnictwo z epoki brązu."], "j": "Rekonstrukcja artystyczna przedstawia zieloną dolinę pod łagodnymi wzgórzami. Na zboczach pasą się stada owiec, a w oddali grupa pasterzy stoi pod drzewem. Z drugiej strony doliny nadciąga karawana wielbłądów obładowanych workami i naczyniami. Na pierwszym planie widać kamienny otwór cysterny, częściowo osłonięty krzakami. Światło jest ostre, popołudniowe, a cienie długie.", "d": "Dotan–Hebron: ok. 100 km; cena sprzedaży Józefa ok. 20 srebrników.", "img": "img/c2m10.webp"}, {"id": "c2m11", "c": 2, "ct": "Patriarchowie", "n": "Egipt i Memfis", "lat": 29.85, "lon": 31.25, "ref": "Rdz 39–41", "sub": "Niewolnik z Kanaan staje się zarządcą spichlerzy państwa nad Nilem.", "s": "Józef trafia do domu Potyfara, siedzi w więzieniu, a w końcu tłumaczy sny faraona. Zostaje zarządcą zapasów, aby przygotować kraj na siedem lat głodu.", "k": ["W Egipcie Józef pracuje w domu Potyfara, dworzanina faraona. Zostaje fałszywie oskarżony i trafia do więzienia, gdzie wyjaśnia sny dwóch urzędników. Kiedy faraon ma niepokojące sny o krowach i kłosach, wspomina się o Józefie. Młody Hebrajczyk wyjaśnia, że po siedmiu urodzajnych latach nadejdzie siedem lat głodu. Faraon powierza mu nadzór nad gromadzeniem zboża, nadaje mu egipskie imię i wprowadza go do wyższych urzędów. Tekst podkreśla, że wzrost Józefa wynika z mądrości i dobrej opieki Boga.", "Egipt zależał od corocznego wylewu Nilu, który nanosił żyzny muł na pola. Gdy powódź była zbyt niska lub zbyt wysoka, groziły głód i klęski. Memfis, położone u wierzchołka delty, było ważnym ośrodkiem administracji i handlu. Od niego do wybrzeża Śródziemnego jest ok. 200 km. Spichlerze przechowywały zboże w gliniano-ceglanych silosach, a urzędnicy spisywali zapasy. Tekst biblijny nie podaje imienia faraona, więc dokładne datowanie wydarzeń pozostaje przedmiotem badań."], "j": "Rekonstrukcja artystyczna ukazuje szeroki Nil, po którym suną żaglowe barki, i zielone pola po obu brzegach. Za nimi rozciąga się pustynia i niskie piramidy w mglistej dali. Przy nabrzeżu stoją długie spichlerze z glinianych cegieł, a robotnicy niosą kosze zboża. Na tarasie pałacu stoi mała postać odwrócona plecami, obserwująca pracę. Powietrze jest ciepłe i jasne, pachnie wodą i słomą.", "d": "Memfis–Morze Śródziemne: ok. 200 km; wylew Nilu trwał kilka miesięcy.", "img": "img/c2m11.webp"}, {"id": "c2m12", "c": 2, "ct": "Patriarchowie", "n": "Goszen", "lat": 30.55, "lon": 31.95, "ref": "Rdz 45,9–11; 46,28–34; 47,1–12", "sub": "Region we wschodniej delcie Nilu, gdzie osiada rodzina Jakuba.", "s": "Józef zaprasza ojca i braci do Egiptu, a faraon wyznacza im ziemię Goszen. Tam rodzina dobrze prosperuje jako pasterze.", "k": ["Po latach Józef objawia się braciom i prosi, aby sprowadzili ojca. Jakub z całą rodziną wyrusza z Beer-Szeby, a po drodze otrzymuje od Boga zapewnienie opieki. Józef wychodzi mu naprzeciw i przedstawia go faraonowi. Władca przydziela osadnikom ziemię Goszen jako najlepszą okolicę dla stad. Tak powstaje wspólnota, która z siedemdziesięciu osób rozrośnie się w naród. Księga Rodzaju kończy się śmiercią Józefa i obietnicą, że Bóg przeprowadzi potomków z powrotem do Kanaan.", "Goszen jest zwykle lokalizowane we wschodniej części delty Nilu, w dolinie Wadi Tumilat, ok. 100 km od Memfis w kierunku Półwyspu Synaj. Był to pas dobrze nawodnionych łąk, idealny dla owiec i bydła, a zarazem blisko granicy, więc łatwo było przemieszczać stada z Kanaan. Droga z Beer-Szeby przez Synaj liczy ok. 250 km, czyli kilkanaście dni marszu. Dokładne granice regionu są niepewne, a identyfikacja opiera się na tradycji i analizie szlaków."], "j": "Rekonstrukcja artystyczna przedstawia płaską, zieloną równinę poprzecinaną kanałami. Stada owiec i bydła pasą się przy rzędach palm, a w tle widać zagrody z trzciny i gliny. Pasterze noszą proste, jasne szaty. Powietrze jest wilgotne, a niebo szerokie. Na horyzoncie zarysowują się niskie wydmy pustyni, od której region oddziela ostry pas zieleni.", "d": "Goszen leży ok. 100 km od Memfis; droga z Beer-Szeby ok. 250 km.", "img": null}, {"id": "c3m1", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Pi-Ramzes, miasto Ramzesa", "lat": 30.8, "lon": 31.83, "ref": "Wj 1; 12", "sub": "Wielka stolica delty, w której Izraelici pracowali przy budowie spichlerzy i miast.", "s": "Księga Wyjścia wspomina o miastach spichrzowych, które Izraelici budowali dla faraona, wśród nich Ramzes. Z tej okolicy wyruszyła grupa uchodźców w noc paschalną.", "k": ["Wj 1,11 mówi, że Izraelici budowali dla faraona miasta zapasowe, Pitom i Ramzes. Praca przy cegle, glinie i polach była ciężka, a władca obawiał się, że rosnący lud stanie się zagrożeniem na wschodniej granicy. Wj 12 opisuje noc, w której po dramatycznych wydarzeniach faraon pozwolił ludowi odejść. Tekst podkreśla pośpiech: chleb bez zakwasu, odzież podróżna, rodziny zebrane razem. Wyjście zaczyna się więc nie w ciszy pustyni, ale w samym środku zatłoczonej, administracyjnej stolicy.", "Pi-Ramzes leżało na wschodnim skraju delty, w pobliżu dawnego ramienia Nilu, co dawało miastu port i dostęp do dróg handlowych na Synaj i do Kanaanu. Za identyfikację najczęściej uznaje się okolice dzisiejszego Qantir, choć część uczonych wskazuje pobliskie Tell el-Daba. Jest to więc spór o lokalizację, nie o samo istnienie miasta w czasach Ramzesa II. Bliskość granicy tłumaczy, dlaczego wojsko, warsztaty i magazyny zbudowano właśnie tutaj. Stąd do pustyni wiodły szlaki liczone w dniach, nie tygodniach. Pomyśl o skali takiej metropolii: liczne świątynie, dzielnice rzemieślników, stajnie dla koni i kanały, którymi barki dowoziły kamień i zboże. W takim miejscu przemoc systemu codziennej pracy była widoczna na każdym kroku, ale równie widoczna była potęga, której przeciwstawia się opowieść biblijna. Dlatego Wj 12 kończy się obrazem rodzin ruszających w drogę o świcie."], "j": "Wyobraź sobie szeroką, płaską równinę usianą polami i kanałami. Na horyzoncie rysują się bramy świątyń z oblicowaniem z jasnego kamienia, a niżej długie szeregi glinianych magazynów. Przy nabrzeżu cumują barki z drewna akacjowego. Powietrze jest gorące i pachnie mułem oraz dymem piekarni. Całość to rekonstrukcja artystyczna, oparta na znaleziskach z Qantir i Tell el-Daba, a nie dokładny plan miasta.", "d": "Odległość z Pi-Ramzes do Jeziora Timsah wynosi ok. 50 km w linii prostej (lokalizacja miasta jest dyskutowana: Qantir lub Tell el-Daba).", "img": "img/c3m1.webp"}, {"id": "c3m2", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Pitom, miasto spichrzowe", "lat": 30.55, "lon": 31.99, "ref": "Wj 1,11", "sub": "Druga z miast spichrzowych, budowanych w wąskiej dolinie Wadi Tumilat.", "s": "Pitom to egipskie miasto z zapasami, wzmiankowane razem z Ramzesem. Leżało w pasie żyznej doliny prowadzącej do Synaju.", "k": ["Wj 1,11 wymienia Pitom jako jedno z dwóch miast, które Izraelici budowali jako ośrodki zaopatrzenia. Imię Pitom pochodzi od egipskiej nazwy oznaczającej dom bóstwa Atum, co sugeruje ośrodek kultowy powiązany z magazynami. W tekście widać, jak praca przymusowa łączy się z gospodarką państwa: cegła, glina i słoma stają się fundamentem struktur, które mają utrwalić władzę. Księga nie podaje szczegółów architektury, ale sama wzmianka o zapasach pokazuje, że delta była również zapleczem logistycznym dla wypraw wojskowych.", "Najczęściej przyjmuje się, że Pitom leżał w Wadi Tumilat, wąskiej dolinie biegnącej od Nilu na wschód ku Jeziorom Gorzkim. Za kandydata uważa się Tell el-Retaba, choć część badaczy wybiera Tell el-Maskhuta, więc lokalizacja jest dyskutowana. Dolina była naturalnym korytarzem: miała wodę, pastwiska i drogi, którymi przemieszczały się karawany i armie. Dlatego umieszczono tam miasta z zapasami, a później właśnie tędy wiodła jedna z możliwych dróg ucieczki w stronę pustyni. Geografia tłumaczy więc, dlaczego opowieść koncentruje się na tym pasie ziemi. Dla czytelnika ważna jest różnica skali między dwoma miejscami: Pi-Ramzes było wielką stolicą, Pitom raczej ośrodkiem logistycznym. Razem tworzą obraz kraju, w którym praca nad zasobami była zorganizowana na szeroką skalę. Gdy patrzysz na mapę, widzisz oba miasta w odległości ok. 40 km, na jednym szlaku prowadzącym do granicy."], "j": "Wyobraź sobie rząd długich, niskich magazynów z surowej cegły, ustawionych wokół prostokątnego dziedzińca. Obok wznosi się niewielka świątynia z kolumnami, a przy kanale pracują ludzie, ugniatający glinę ze słomą. Pod murami stoją osły z workami zboża. To rekonstrukcja artystyczna, oparta na znaleziskach z miast spichrzowych delty, a nie portret konkretnego wykopaliska.", "d": "Wadi Tumilat ma ok. 50 km długości; lokalizacja Pitom (Tell el-Retaba lub Tell el-Maskhuta) jest dyskutowana.", "img": null}, {"id": "c3m3", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Sukkot, pierwszy postój", "lat": 30.55, "lon": 32.1, "ref": "Wj 12,37; 13,20", "sub": "Pierwszy obóz uchodźców, u progu pustyni.", "s": "Z Ramzesa lud dotarł do Sukkot, pierwszej stacji drogi. To tu zaczyna się właściwa wędrówka.", "k": ["Wj 12,37 podaje, że Izraelici wyruszyli z Ramzesa do Sukkot, a z nimi wielu mężczyzn, kobiety, dzieci i liczne stada. Tekst mówi także o mieszanym tłumie, który do nich dołączył. Wj 13,20 dodaje, że kolejnym postojem było Etam na skraju pustyni. Sukkot znaczy „szałasy” i dobrze oddaje charakter tego miejsca: prowizoryczne schronienia, w których ludzie zatrzymują się na pierwszy nocleg. Opowieść zwalnia tu tempo i pokazuje zmęczenie, niepewność oraz rodzącą się wspólnotę drogi.", "Sukkot utożsamia się zwykle z egipskim Tjeku, czyli z okolicą Tell el-Maskhuta w Wadi Tumilat, ale lokalizacja jest dyskutowana. Dolina prowadzi dokładnie w stronę Jezior Gorzkich i jeziora Timsah, więc to naturalny pierwszy etap ruchu na wschód. Odległość z Ramzesa wynosi ok. 50 km w linii prostej, co przy tempie dużej grupy z dziećmi i bydłem oznacza kilka dni marszu. Granica Egiptu nie była linią na mapie, lecz pasem fortec i studni, przez który przechodziło się za zgodą strażników. Warto zauważyć, że Księga Wyjścia nie wybiera najkrótszej drogi przez ziemię Filistynów (Wj 13,17), lecz kieruje lud ku pustyni. Powód jest praktyczny: tamtędy biegł wojskowy szlak pełen egipskich posterunków. Wybór drogi pokazuje więc, jak mocno geografia i polityka wpływają na przebieg opisanych wydarzeń."], "j": "Wyobraź sobie szeroki pas piasku i niskich krzewów na skraju doliny. Wzdłuż wąskiego kanału rozstawiono prowizoryczne szałasy z gałęzi i płótna, a obok pasą się owce. Dym z ognisk unosi się prosto w górę, bo nie ma wiatru. W oddali widać pierwsze skalne wzgórza. To rekonstrukcja artystyczna, a nie dokładny obraz konkretnego miejsca.", "d": "Z Pi-Ramzes do Sukkot (Tell el-Maskhuta) jest ok. 50 km w linii prostej; lokalizacja jest dyskutowana.", "img": null}, {"id": "c3m4", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Morze Trzcin", "lat": 30.58, "lon": 32.3, "ref": "Wj 14–15", "sub": "Miejsce przejścia, którego dokładne położenie pozostaje przedmiotem badań.", "s": "Wj 14 opisuje przejście przez wodę i ocalenie przed pościgiem. Miejsce jest dyskutowane: badacze rozważają kilka tras.", "k": ["Wj 14 opowiada o obozie nad wodą, o pościgu wojsk faraona i o przejściu, które Izraelici uznali za dzieło Boga. Hebrajska nazwa jam suf oznacza „morze trzcin” lub „morze sitowia”, a tradycja grecka przetłumaczyła ją jako Morze Czerwone. Wj 15 jest hymnem dziękczynnym po tym wydarzeniu. Tekst nie podaje współrzędnych, więc czytelnik musi opierać się na wskazówkach nazw: Pi-Hahirot, Migdol i Baal-Sefon (Wj 14,2). Ich lokalizacja jest niepewna.", "Badacze zaproponowali kilka hipotez. Trasa północna prowadzi nad jeziora w pobliżu Morza Śródziemnego, trasa środkowa nad Jezioro Timsah i Jeziora Gorzkie, a trasa południowa nad Zatokę Sueską. Każda ma zwolenników i argumenty, więc w tym atlasie podajemy Jezioro Timsah jako orientacyjny punkt, zaznaczając, że lokalizacja jest dyskutowana. W Wadi Tumilat teren zmienia się z żyznego na bagnisty, z trzcinami i płytkimi zbiornikami, które mogły tworzyć naturalną przeszkodę dla wojska na rydwanach. Dla czytelnika najważniejsze jest to, co mówi sam tekst: droga ku pustyni prowadziła przez miejsce, gdzie woda blokowała zarówno ucieczkę, jak i pościg. Rozważanie hipotez geograficznych nie osłabia przesłania, lecz pozwala dostrzec realistyczne tło. Szerokość płytkich zbiorników rzędu kilku kilometrów oraz sezonowe zmiany poziomu wody dobrze pasują do obrazu miejsca, w którym działają wiatr, ląd i woda."], "j": "Wyobraź sobie płytką, zimną o świcie wodę wśród gęstych zarośli trzcin, rozległą jak jezioro, bez wyraźnego brzegu po drugiej stronie. Niebo jest szare i różowe, a po wschodniej stronie wznosi się niska krawędź pustyni. Na brzegu widać z daleka grupki ludzi z zwierzętami. To rekonstrukcja artystyczna jednej z możliwych hipotez, a nie dokładne odtworzenie przebiegu wydarzeń.", "d": "Do przejścia przez wodę rozważa się trzy główne hipotezy tras (północną, środkową, południową); odległość Sukkot do Jeziora Timsah to ok. 20 km, a lokalizacja miejsca jest dyskutowana.", "img": "img/c3m4.webp"}, {"id": "c3m5", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Mara, gorzkie źródło", "lat": 29.43, "lon": 32.97, "ref": "Wj 15,22–26", "sub": "Pierwsza woda po trzech dniach marszu, ale gorzka w smaku.", "s": "Po trzech dniach na pustyni lud dotarł do źródła, którego woda była gorzka. Imię Mara oznacza właśnie „gorycz”.", "k": ["Wj 15,22–26 opowiada, że po przejściu przez wodę Izraelici szli trzy dni przez pustynię Szur i nie znaleźli wody. Gdy dotarli do Mara, woda okazała się niezdatna do picia, więc lud zaczął szemrać. Opowieść podkreśla, jak szybko radość z ocalenia ustępuje zmęczeniu i lękowi o podstawowe potrzeby. Następnie źródło zostaje uzdrowione, a lud otrzymuje pouczenie o słuchaniu głosu Boga. Mara staje się symbolem pierwszej próby na pustyni.", "Tradycyjnie utożsamia się Mara z Ain Hawara, źródłem o słonawej wodzie położonym ok. 80 km na południowy wschód od Suezu. Lokalizacja jest dyskutowana, bo część badaczy preferuje Ain Musa bliżej Suezu. Obraz słonawego źródła dobrze pasuje do tekstu: na wschodnim brzegu Zatoki Sueskiej wiele wód jest zasolonych przez wapienne podłoże i gorący klimat. Trzy dni marszu przy przeciętnym tempie grupy z dziećmi i zwierzętami to ok. 40–60 km, co mieści się w tym przedziale. Dla lektury wędrówki ważne jest, że woda decyduje o trasie. Na Synaju szlaki prowadzą od oazy do oazy, a między nimi rozciągają się odcinki wymagające dni marszu bez źródeł. Mara jest pierwszym takim testem, a Elim, następne miejsce, pokazuje drugą stronę pustyni: studnie i palmy. Cała opowieść ma więc rytm niedostatku i dostatku."], "j": "Wyobraź sobie niewielką, żwirową dolinę z kilkoma krzakami tamaryszku. W płytkim zagłębieniu stoi mętna woda z białym nalotem soli. Wokół leżą kamienie rozgrzane słońcem, a w tle wznosi się jasny wapienny płaskowyż. Nie ma tu cienia, więc ludzie kryją się pod płachtami. To rekonstrukcja artystyczna, a nie fotografia konkretnego źródła.", "d": "Ain Hawara leży ok. 80 km na południowy wschód od Suezu; lokalizacja Mara jest tradycyjna i dyskutowana.", "img": null}, {"id": "c3m6", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Elim, oaza dwunastu źródeł", "lat": 29.28, "lon": 32.98, "ref": "Wj 15,27; Lb 33,9", "sub": "Postój przy dwunastu źródłach i siedemdziesięciu palmach.", "s": "W Elim było dwanaście źródeł i siedemdziesiąt palm. Odpoczynek w oazie kontrastuje z surowością pustyni.", "k": ["Wj 15,27 oraz Lb 33,9 podają, że w Elim było dwanaście źródeł i siedemdziesiąt palm, a lud rozbił tam obóz nad wodą. Liczby w Biblii mają często znaczenie symboliczne, ale tutaj opisują realne bogactwo oazy. Po gorzkiej wodzie z Mara tekst przynosi ulgę i obraz stabilnego miejsca odpoczynku. Opowieść nie rozwija szczegółów, lecz sama krótkość relacji sugeruje chwilę wytchnienia przed kolejnymi próbami.", "Elim utożsamia się zwykle z Wadi Gharandel, doliną ok. 15–20 km na południe od Ain Hawara, choć lokalizacja jest dyskutowana. Wadi Gharandel ma stałą wodę, tamaryszki i palmy daktylowe, więc dobrze pasuje do opisu. W regionie Synaju takie oazy są rzadkie i to one wyznaczają praktyczne szlaki karawan. Dlatego uczeni często szukają miejsc postoju właśnie w pobliżu stałych źródeł, przy założeniu, że grupa z bydłem nie mogła iść długo bez wody. Palma daktylowa była w starożytnym świecie nie tylko źródłem cienia, lecz także pożywienia: owoce, włókna na liny i liście na dachy. Obraz siedemdziesięciu palm opisuje więc miejsce, w którym można naprawić odzież, uzupełnić zapasy i odpocząć. Na mapie widać, że Elim leży już dalej od Suezu, w stronę południa półwyspu, gdzie krajobraz zaczyna się wznosić ku granitowym masywom."], "j": "Wyobraź sobie wąską dolinę, w której z kamienistego dna wyrasta zielony pas palm i tamaryszków. Pod koronami drzew płynie strumyk, a obok stoją skromne namioty z koziej wełny. Dalej, na zboczach wadi, rysują się ostre ciemne skały. Powietrze jest tu wyraźnie chłodniejsze niż na otwartej pustyni. To rekonstrukcja artystyczna, a nie dokładne odtworzenie oazy.", "d": "Wadi Gharandel leży ok. 15–20 km na południe od Ain Hawara; lokalizacja Elim jest dyskutowana.", "img": null}, {"id": "c3m7", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Refidim, bitwa i woda ze skały", "lat": 28.7, "lon": 33.65, "ref": "Wj 17", "sub": "Brak wody, skała i pierwsza bitwa na pustyni.", "s": "W Refidim lud znów zmaga się z brakiem wody, a potem z atakiem Amalekitów. Wj 17 łączy oba wydarzenia w jednym miejscu.", "k": ["Wj 17 opisuje obóz w Refidim, gdzie brakowało wody, a lud domagał się pomocy. Mojżesz uderza laską w skałę pod przewodnictwem Boga i z kamienia wypływa woda. Tekst nazywa to miejsce Massa i Meriba, co oznacza „próba” i „spór”. Zaraz potem następuje atak Amalekitów, ludu pustyni. Opowieść pokazuje, że kryzys na szlaku ma wiele twarzy: pragnienie, sprzeczności wewnątrz grupy i zagrożenie z zewnątrz.", "Tradycja chrześcijańska od wieków lokalizuje Refidim w oazie Feiran, w Wadi Feiran, największej oazie południowego Synaju. Lokalizacja jest dyskutowana, bo Feiran leży ok. 25 km od Dżabal Musa, co tworzy napięcie z krótkim odstępem czasu opisanym w tekście. Feiran ma jednak palmy, wodę i strategiczne położenie na szlaku wiodącym ku górom. Dla grupy wędrującej przez pustynię zajęcie takiej oazy było kwestią przeżycia, więc spotkanie z lokalnym ludem jest bardzo prawdopodobne. Bitwa z Amalekitami toczy się w terenie otwartym, w wąskiej dolinie, gdzie przewaga liczebna nie zawsze decyduje. Wj 17,11–12 opisuje Mojżesza na wzgórzu z podniesionymi rękami, wspieranego przez Aarona i Chura. Obraz wzgórza jako punktu obserwacyjnego wiąże się z geografią: wysokie zbocza nad wadi pozwalały widzieć całe pole walki. Tak przyroda i historia ponownie splatają się w jednym miejscu."], "j": "Wyobraź sobie szeroką, rozjaśnioną słońcem dolinę z pasem zieleni wzdłuż wyschniętego koryta. Nad nią wznoszą się czerwonobrunatne zbocza z poszarpanymi grzbietami. W oddali, na wzgórzu, dwie niewielkie postaci wspierają trzecią z podniesionymi rękami, a poniżej gromadzą się grupy ludzi. To rekonstrukcja artystyczna, a nie dosłowny obraz tekstu.", "d": "Oaza Feiran leży ok. 25 km od Dżabal Musa w linii prostej; lokalizacja Refidim jest tradycyjna i dyskutowana.", "img": "img/c3m7.webp"}, {"id": "c3m8", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Synaj / Horeb (Dżabal Musa)", "lat": 28.54, "lon": 33.975, "ref": "Wj 19–20; 24; 31–34", "sub": "Góra przymierza, gdzie lud otrzymał Prawo.", "s": "Pod górą Synaj lud przebywał około roku. Wj 19–34 opisuje tu przymierze, Dekalog i budowę Przybytku.", "k": ["Wj 19 mówi, że po trzech miesiącach od wyjścia lud stanął pod górą Synaj. Następuje przygotowanie, grzmoty, ogień i trąby, a potem dar Dekalogu (Wj 20). W kolejnych rozdziałach pojawiają się przepisy prawa, zawarcie przymierza (Wj 24), epizod ze złotym cielcem oraz polecenia dotyczące Przybytku. Księga Liczb (Lb 1–10) dodaje spis ludu i organizację obozu. Pobyt pod górą trwa ok. roku i stanowi centralny punkt całej narracji.", "Tradycyjnie górę Synaj, zwaną też Horeb, utożsamia się z Dżabal Musa (Górą Mojżesza) w południowym Synaju, na wysokości ok. 2285 m n.p.m. To identyfikacja z czasów chrześcijańskich, związana z klasztorem św. Katarzyny u podnóża. Lokalizacja jest dyskutowana: proponowano także inne szczyty, w tym Dżabal Serbal, a nawet miejsca w Arabii czy Negewie. Przed górą rozciąga się płaska dolina Er-Raha, na której mógł rozbić obóz duży tłum. Granitowa góra wznosi się stromo nad doliną i widać ją z daleka, co tłumaczy opis granic wyznaczonych wokół niej (Wj 19,12). Pogoda w tej wysokości bywa nagła: burze z błyskawicami, silne wiatry, zimne noce nawet latem. Taki krajobraz dobrze współgra z obrazem teofanii w grzmotach i ogniu. W czytaniu tekstu pamiętaj jednak, że nie geografia, lecz spotkanie z Bogiem jest jego sednem."], "j": "Wyobraź sobie ogromną, nagą ścianę czerwonego granitu, która wznosi się nad rozległą żwirową doliną. Nad szczytem kłębią się ciemne chmury, a poniżej płoną ogniska obozu, rozproszone jak punkty światła. Na stokach brak drzew, tylko skały i cień. To rekonstrukcja artystyczna, a nie dokładne odtworzenie wydarzeń.", "d": "Dżabal Musa ma ok. 2285 m n.p.m.; identyfikacja z biblijnym Synajem jest tradycyjna i dyskutowana.", "img": "img/c3m8.webp"}, {"id": "c3m9", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Pustynia Parań", "lat": 29.6, "lon": 34.1, "ref": "Lb 10,12; 12,16; 13,3", "sub": "Rozległa pustynia, przez którą lud szedł ku Kadesz.", "s": "Po odejściu spod Synaju lud wkroczył na pustynię Parań. Stąd wyruszyli wywiadowcy do Kanaanu.", "k": ["Lb 10,12 mówi, że po opuszczeniu Synaju obłok zatrzymał się na pustyni Parań. Stąd, według Lb 13,3, Mojżesz wysłał dwunastu zwiadowców, aby zbadali kraj Kanaan. Opowieść ukazuje etap kolejnych postojów, takich jak Tabera i Kibrot-Hattawa, gdzie lud skarżył się na jedzenie i przywódców (Lb 11). Przejście przez ten obszar trwało dłuższy czas i przebiegało w ciągłej zależności od wody i pasz dla stad.", "Pustynia Parań to rozległy, surowy obszar w środkowym Synaju oraz w północnej części półwyspu, ze skalistymi wzgórzami, płaskowyżami i suchymi korytami wadi. Dokładne granice nie są ustalone, a lokalizacja poszczególnych postojów jest dyskutowana. Dla mapy przyjmujemy punkt orientacyjny w centralnej części, ok. 100–150 km od Dżabal Musa. Tędy prowadziły szlaki łączące Synaj z Negewem, więc obszar nie był zupełnie odcięty od świata. Dla czytelnika ważne jest, że Parań to nie jeden punkt, lecz region. Nazwa oznacza duże przestrzenie, na których ludzie i stada wędrowali od źródła do źródła. W Biblii miejsce to pojawia się też w historii Hagar i Ismaela (Rdz 21,21), co pokazuje, że była to znana strefa dla pasterskich ludów. Z perspektywy narracji Parań jest bramą między górą przymierza a krajem obietnicy."], "j": "Wyobraź sobie bezkresny, płaski płaskowyż pokryty żwirem i rzadkimi kępami krzewów. Tu i ówdzie wznoszą się niskie, jasne wzgórza, a w dolinach ciągną się wyschnięte koryta. Powietrze drga od upału, a na horyzoncie widać cienką linię karawany. To rekonstrukcja artystyczna, a nie portret konkretnego miejsca.", "d": "Punkt na mapie jest orientacyjny: pustynia Parań obejmuje obszar o średnicy ok. 100–150 km; jej granice są dyskutowane.", "img": null}, {"id": "c3m10", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Kadesz-Barnea", "lat": 30.63, "lon": 34.42, "ref": "Lb 13–14; 20,1–13", "sub": "Oaza u progu Kanaanu, w której lud zawahał się przed wejściem.", "s": "W Kadesz-Barnea zwiadowcy wrócili z Kanaanu, a lud ulękł się wejścia do kraju. To tu spędził kolejne lata.", "k": ["Lb 13–14 opowiada o dwunastu zwiadowcach, którzy przez czterdzieści dni badali kraj. Wrócili z owocami i opisami żyznej ziemi, ale większość przedstawiła mieszkańców jako zbyt silnych. Lud zaczął narzekać i odmówił wejścia, co Księga interpretuje jako brak zaufania. W konsekwencji pokolenie wychodzące z Egiptu miało przebywać na pustyni, a droga do kraju została odłożona. Lb 20,1–13 wspomina o śmierci Miriam w Kadesz oraz o nowym konflikcie o wodę.", "Kadesz-Barnea utożsamia się najczęściej z oazą Ain el-Kudeirat na północnym Synaju, ok. 80 km na południe od Beer Szeby. Lokalizacja jest dyskutowana, bo bywa też wskazywana Ain Kadis. Ain el-Kudeirat to jedno z największych źródeł w regionie, otoczone żyzną doliną, w której możliwa jest uprawa. Miejsce leży na skrzyżowaniu szlaków, więc zapewniało grupie wodę i dobrą pozycję, a jednocześnie pozwalało obserwować drogi prowadzące do Negewu. Z oazy do Beer Szeby jest ok. 80 km w linii prostej, co przy marszu rodzin i stad zajęłoby kilka dni. Oaza daje więc obraz miejsca, z którego widać cel, ale wciąż trzeba podjąć decyzję. Księga pokazuje, że przeszkodą nie jest sama odległość, lecz odwaga. Dlatego Kadesz-Barnea pozostaje w pamięci jako punkt zwrotny całej wędrówki."], "j": "Wyobraź sobie zielone, rozległe zagłębie pośród suchej, skalistej pustyni. Źródło tworzy kilka strumieni, wzdłuż których rosną krzewy i niskie drzewa. Wokół oazy stoją liczne namioty, a na wzgórzach widać ślady dawnych szlaków. To rekonstrukcja artystyczna, a nie dokładne odtworzenie obozu.", "d": "Ain el-Kudeirat leży ok. 80 km na południe od Beer Szeby; lokalizacja Kadesz-Barnea jest dyskutowana.", "img": "img/c3m10.webp"}, {"id": "c3m11", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Równiny Moabu", "lat": 31.78, "lon": 35.6, "ref": "Lb 22–36; Pwt 1–4", "sub": "Ostatni obóz przed Jordanem, naprzeciw Jerycha.", "s": "Po latach wędrówki lud zatrzymał się na równinach Moabu, po wschodniej stronie Jordanu. Stąd rozpoczął się ostatni etap przed wejściem do kraju.", "k": ["Lb 22–36 opisuje obóz Izraelitów na równinach Moabu, po wschodniej stronie Jordanu, naprzeciw Jerycha. Tutaj rozgrywają się epizody z Balaamem, nowy spis ludu (Lb 26) oraz przepisy dotyczące podziału ziemi. Księga Powtórzonego Prawa to z kolei seria przemówień Mojżesza, wygłoszonych właśnie na tym terenie. Opowieść zbliża się do końca, a czytelnik widzi, że celem jest nie tylko dotarcie do kraju, lecz także przygotowanie ludu do życia w nim.", "Równiny Moabu to szeroki pas niskiego terenu na wschód od Jordanu, tuż nad Morzem Martwym, na wysokości poniżej poziomu morza. Dokładne położenie obozu jest dyskutowane, bo Biblia podaje nazwy takie jak Szittim czy Bet-Peor, których nie umiemy jednoznacznie wskazać. Z równin widać na zachodzie Jerycho i palmową dolinę Jordanu. Pas ziemi ma kilka kilometrów szerokości, co wystarczało na tymczasowy obóz dużej wspólnoty. Klimat doliny Jordanu jest gorący i suchy w lecie, a wiosną rzeka wylewa, co zgodnie z Joz 3,15 utrudniało przeprawę. Lokalizacja tuż przed granicą kraju czyni z Moabu miejsce symboliczne: lud jest na progu, ale jeszcze nie w środku. Pwt 1–4 przypomina całą drogę i prowadzi do ostatnich pouczeń, które mają ukształtować życie wspólnoty."], "j": "Wyobraź sobie rozległą, gorącą nizinę z krzewami, tamaryszkami i pasami zieleni wzdłuż rzeki. Na zachodzie widać jasną linię Jordanu i palmy Jerycha, a na wschodzie wznoszą się wzgórza Moabu. Namioty rozstawiono w rzędach, a nad nimi unosi się biały dym ognisk. To rekonstrukcja artystyczna, a nie dokładny plan obozu.", "d": "Pas równin Moabu ma kilka kilometrów szerokości i leży poniżej poziomu morza; punkt na mapie jest orientacyjny, a położenie obozu dyskutowane.", "img": null}, {"id": "c3m12", "c": 3, "ct": "Egipt, Wyjście i pustynia", "n": "Góra Nebo", "lat": 31.767, "lon": 35.725, "ref": "Pwt 32,48–52; 34", "sub": "Widok na Ziemię Obiecaną i koniec drogi Mojżesza.", "s": "Z góry Nebo Mojżesz zobaczył kraj, do którego prowadził lud. Pwt 34 zamyka Pięcioksiąg wspomnieniem jego śmierci.", "k": ["Pwt 32,48–52 i Pwt 34 przedstawiają ostatni etap życia Mojżesza. Na polecenie Boga wchodzi on na górę Nebo, szczyt Pisga naprzeciw Jerycha, i stamtąd ogląda rozległy kraj: Gilead, Negew, dolinę Jordanu, aż po dalekie wzgórza. Tekst mówi, że nie wszedł do kraju, a jego grób pozostał nieznany. Opowieść kończy się wspomnieniem żałoby ludu i przekazaniem przywództwa Jozuemu. To zamknięcie Pięcioksięgu, pełne powagi i wdzięczności.", "Tradycyjnie górę Nebo identyfikuje się z Ras Siyagha, szczytem o wysokości ok. 800 m n.p.m., położonym w Jordanii, ok. 10 km na zachód od Madaby. Lokalizacja jest tradycyjna, a nie pewna. Z tego punktu przy dobrej pogodzie widać dolinę Jordanu, północną część Morza Martwego i okolice Jerycha. Wysokość względna nad doliną sięga ponad 1100 m, co daje szeroką panoramę, a jednocześnie wyraźnie oddziela obserwatora od kraju leżącego poniżej. Znaczenie geografii jest tu wyjątkowe: miejsce wybrano nie przez przypadek, lecz dlatego, że daje widok na cały kraj obietnicy. Z perspektywy czytelnika Nebo pokazuje, że wędrówka nie kończy się triumfem, lecz zaufaniem, że obietnica będzie spełniona w następnym pokoleniu. Pwt 34 przypomina również, że Mojżesz miał ok. 120 lat, a siły nie opuściły go aż do końca."], "j": "Wyobraź sobie szeroki, kamienisty szczyt z niskimi krzewami, z którego widać w dole błyszczącą linię Jordanu i rozległą żółtobrązową nizinę. Za nią rysują się łagodne zarysy gór Judei, a w oddali widać pas niebieskiej wody. Na szczycie stoi z daleka samotna postać, widziana od tyłu. To rekonstrukcja artystyczna, a nie dokładne odtworzenie sceny.", "d": "Ras Siyagha ma ok. 800 m n.p.m. i wznosi się ponad 1100 m nad Jordanem; identyfikacja z górą Nebo jest tradycyjna.", "img": "img/c3m12.webp"}, {"id": "c4m1", "c": 4, "ct": "Ziemia Obiecana", "n": "Przeprawa przez Jordan i Gilgal", "lat": 31.84, "lon": 35.54, "ref": "Joz 3–5", "sub": "Naród przechodzi rzekę po suchym dnie i rozbija pierwszy obóz w Kanaanie.", "s": "Wiosną, gdy Jordan wylewał, kapłani z Arką weszli do wody, a nurt się zatrzymał. W Gilgal ustawiono dwanaście kamieni na pamiątkę tego dnia.", "k": ["Księga Jozuego opisuje, że Izraelici obozowali w Szittim, a potem ruszyli ku rzece naprzeciw Jerycha, w porze wiosennych wylewów. Kapłani niosący Arkę Przymierza weszli pierwsi do wody, a nurt się zatrzymał, tak że cały lud przeszedł po suchym dnie. Z koryta zabrano dwanaście kamieni, po jednym dla każdego pokolenia, i ustawiono je w Gilgal. Miejsce stało się pierwszym obozem w Kanaanie, miejscem obrzezania i świętowania Paschy. Tradycja umieszcza Gilgal na wschód od Jerycha, choć dokładna lokalizacja pozostaje sporna.", "Jordan nie jest szeroką rzeką, ale w okresie wiosennych roztopów jego dolina zamienia się w gąszcz trzcin, błota i bystrego nurtu. Rzeka płynie głębokim rowem tektonicznym, poniżej poziomu morza, a jej brzegi porasta gęsta roślinność. Przejście całego ludu z dobytkiem było więc poważnym wyzwaniem. Po zachodniej stronie czekał pas pustynnych wzgórz, który prowadził ku Jerychu i dalej w górę, na płaskowyż. Dlatego przeprawa miała też wymiar strategiczny: kto kontrolował bród, ten kontrolował wejście do całego kraju."], "j": "Wyobraź sobie szeroką, żyzną dolinę, w której rzeka wije się między zielonymi zaroślami. Wiosną woda jest mętna i szybka, a po obu brzegach stoją tłumy ludzi ze zwierzętami. Na przedzie kapłani z wysoko niesioną Arką, za nimi rodziny. Na horyzoncie rysują się jasne wzgórza Judei, a daleko na zachodzie, w porannej mgle, widać zarys Jerycha. To rekonstrukcja artystyczna, oparta na opisie krajobrazu doliny.", "d": "Dolina Jordanu leży ok. 390 m poniżej poziomu morza, a rzeka ma tu zaledwie kilkadziesiąt metrów szerokości.", "img": "img/c4m1.webp"}, {"id": "c4m2", "c": 4, "ct": "Ziemia Obiecana", "n": "Jerycho", "lat": 31.871, "lon": 35.444, "ref": "Joz 2; 6", "sub": "Pierwsze miasto Kanaanu, które padło po siedmiu dniach marszu wokół murów.", "s": "Jerycho strzegło drogi z doliny Jordanu na płaskowyż. Po siedmiu dniach pochodu z Arką i dźwiękiem rogów mury miasta się zawaliły.", "k": ["Jozue wysłał do Jerycha dwóch zwiadowców, których ukryła Rachab, mieszkanka miasta. Później cały lud okrążał mury przez sześć dni, a siódmego dnia siedmiokrotnie, z kapłanami dmącymi w rogi. Na dźwięk wspólnego okrzyku mury runęły, a miasto wpadło w ręce Izraelitów. Rachab z rodziną ocalała i dołączyła do ludu. Opowieść podkreśla, że zwycięstwo jest darem, a nie owocem siły. Jerycho jest utożsamiane z tellem Tell es-Sultan, a datowanie jego warstw bywa przedmiotem dyskusji badaczy.", "Jerycho leżało przy obfitym źródle, w oazie pośród pustyni, i jest jednym z najstarszych znanych miast świata. Z tego powodu zwano je Miastem Palm. Stąd wiodły drogi na zachód, przez strome, suche wąwozy ku Jerozolimie i Betel, oraz na wschód, przez bród na Jordanie. Kto zajął Jerycho, otwierał sobie wejście na górskie płaskowyże Kanaanu. Dla przybyszów z pustyni było to więc naturalne pierwsze zadanie, a jednocześnie symboliczny początek zasiedlania ziemi."], "j": "Zobacz niewielkie, ale mocno obwarowane miasto na niskim wzgórzu, otoczone gajami palmowymi i polami nawadnianymi przez źródło. Mury z cegły suszonej na słońcu sięgają kilku metrów, a za nimi widać płaskie dachy domów. Wokół rozpościera się jasna, wyschnięta pustynia, a w oddali wznoszą się skaliste zbocza. Rekonstrukcja artystyczna łączy wiedzę o tellu z opisem oazy.", "d": "Jerycho leży ok. 250 m poniżej poziomu morza i należy do najniżej położonych miast świata.", "img": "img/c4m2.webp"}, {"id": "c4m3", "c": 4, "ct": "Ziemia Obiecana", "n": "Aj", "lat": 31.917, "lon": 35.267, "ref": "Joz 7–8", "sub": "Porażka z powodu grzechu Achana i zwycięstwo zasadzką.", "s": "Pierwszy atak na Aj zakończył się klęską, gdy ktoś złamał zakaz brania łupów. Drugi, z zasadzką ukrytą za miastem, przyniósł zwycięstwo.", "k": ["Po upadku Jerycha Jozue wysłał niewielki oddział przeciwko Aj, lecz Izraelici musieli uciekać. Przyczyną była tajemnicza wina Achana, który zatrzymał dla siebie przedmioty objęte zakazem. Gdy sprawa wyszła na jaw i winowajcę ukarano, Jozue przygotował drugi atak. Część wojska ukryto w zasadzce na zachód od miasta, a reszta udała ucieczkę. Mieszkańcy wypadli z bram w pościgu, a zasadzka zajęła i podpaliła miasto. Za lokalizację Aj uważa się tradycyjnie et-Tell, choć archeolodzy spierają się o to utożsamienie.", "Aj leżało wysoko na krawędzi górzystego płaskowyżu, blisko Betel, a droga z Jerycha prowadziła tam stromym, trudnym podejściem przez suche wąwozy. Różnica wysokości między doliną Jordanu a tym miejscem wynosi kilka setek metrów, co tłumaczy, dlaczego pierwsze podejście było tak wyczerpujące. Okolica pełna jest wąskich dolin i skalnych załomów, idealnych na ukrycie zasadzki. Dla dowódców oznaczało to konieczność wykorzystania terenu, a nie tylko siły liczebnej, i właśnie na tym opiera się taktyka drugiej bitwy."], "j": "Wyobraź sobie skalisty grzbiet pokryty krzakami, z niewielkim murowanym miasteczkiem na szczycie. Wokół ciągną się wąskie jary, w których łatwo ukryć oddział. Droga w górę wije się wśród kamieni, a nad całością wisi suche, jasne niebo. To rekonstrukcja artystyczna, oparta na ukształtowaniu terenu.", "d": "Odległość z Jerycha do Aj wynosi ok. 20 km, z podejściem o ok. 900 m w górę.", "img": null}, {"id": "c4m4", "c": 4, "ct": "Ziemia Obiecana", "n": "Sychem, Ebal i Garizim", "lat": 32.213, "lon": 35.28, "ref": "Joz 8,30–35; 24", "sub": "Dwie góry nad doliną, na których lud usłyszał błogosławieństwa i przestrogi.", "s": "Po zwycięstwie nad Aj lud zgromadził się między górami Ebal i Garizim, by wysłuchać Prawa. Na końcu życia Jozue odnowił tu przymierze.", "k": ["Księga Jozuego opisuje uroczystość w sercu kraju. Po zdobyciu Aj lud zebrał się między dwiema górami: część stanęła u stóp Garizim, część u stóp Ebal. Jozue zbudował ołtarz i odczytał słowa Prawa, w tym błogosławieństwa i przestrogi. Wiele lat później, pod koniec życia, ponownie zwołał wszystkie pokolenia do Sychem i poprosił je o wybór: komu chcą służyć. Lud odpowiedział, że Panu, a Jozue spisał to jako odnowienie przymierza.", "Sychem leży w naturalnym przesmyku między dwiema masywnymi górami i kontrolowało ważne skrzyżowanie dróg w centrum kraju. Dolina między Ebal a Garizim jest wąska, a dźwięk niesie się tu doskonale, co ułatwia wspólne zgromadzenie dużej liczby osób. Miejsce było też bliskie dawnych patriarchów, bo Abraham i Jakub zatrzymywali się tu przed wiekami. Dlatego Sychem stało się naturalnym miejscem przypomnienia, że obietnica sięga głębiej niż samo zdobycie ziemi."], "j": "Wyobraź sobie zielonkawą, żyzną dolinę, nad którą z dwóch stron wznoszą się łagodne, ale wysokie góry. Na zboczach pasą się owce, a między nimi biegnie droga z kupieckimi karawanami. Z jednej strony wzgórza pokrywają kamienne tarasy, z drugiej skały. Rekonstrukcja artystyczna łączy opis biblijny z wyglądem dzisiejszej doliny.", "d": "Góra Ebal wznosi się ok. 940 m n.p.m., a Garizim ok. 880 m n.p.m.; dolina między nimi ma szerokość zaledwie ok. 500 m.", "img": null}, {"id": "c4m5", "c": 4, "ct": "Ziemia Obiecana", "n": "Gibeon", "lat": 31.85, "lon": 35.185, "ref": "Joz 9–10", "sub": "Podstępny sojusz, bitwa pod Gibeonem i dzień, który się przedłużył.", "s": "Mieszkańcy Gibeonu zawarli układ z Izraelitami podstępem, a potem zostali zaatakowani przez koalicję królów. Jozue przybył im z pomocą w nocnym marszu.", "k": ["Gibeończycy, widząc los Jerycha i Aj, przybyli do obozu w Gilgal w znoszonych ubraniach, udając podróżnych z dalekiego kraju. Izraelici zawarli z nimi układ, a gdy podstęp wyszedł na jaw, nie złamali przysięgi. Wkrótce pięciu królów zaatakowało Gibeon. Jozue ruszył z Gilgal w nocnym marszu, zaskoczył wrogów i pokonał ich. Tradycja opisuje, że dzień się przedłużył, aż do końca pościgu, a gradobicie dopełniło porażki przeciwników. Autor podkreśla, że to nie siła, lecz Boża interwencja przesądziła o wyniku.", "Gibeon leżał na zachodnim skraju płaskowyżu, niedaleko Jerozolimy, przy ważnej drodze prowadzącej z gór ku nizinie. Z Gilgal trzeba było pokonać całą noc marszu w górę, co oznacza ok. 30 km po stromym, kamienistym szlaku. Dalszy pościg biegł w dół przez Bet-Choron, wąską przełęczą, na której uciekającym wrogom trudno było się rozproszyć. Region ten stanowił pas przejściowy między górami a nizinną Szefelą, więc kto go kontrolował, miał klucz do obu światów."], "j": "Zobacz wzgórze zwieńczone miastem z kamiennymi murami, otoczone terasami winnic i oliwek. Dookoła tętni życie: wozy, stada, kupcy. W dole, w dolinie, widać kłęby kurzu, gdy nadciąga wojsko. Niebo jest rozjaśnione, a światło długo pada na zbocza. To rekonstrukcja artystyczna, oparta na opisie i badaniach terenu.", "d": "Gibeon leży ok. 9 km na północny zachód od Jerozolimy i ok. 800 m n.p.m.", "img": "img/c4m5.webp"}, {"id": "c4m6", "c": 4, "ct": "Ziemia Obiecana", "n": "Szilo", "lat": 32.055, "lon": 35.29, "ref": "Joz 18–19; 1 Sm 1–4", "sub": "Miejsce Przybytku i losowanie działów dla dwunastu pokoleń.", "s": "W Szilo ustawiono Przybytek, a Jozue przydzielił resztę ziemi siedmiu pokoleniom. Miejsce stało się religijnym centrum kraju na wiele pokoleń.", "k": ["Gdy wojsko osiadło w kraju, w Szilo ustawiono Namiot Spotkania i tam odbyło się zgromadzenie całego ludu. Jozue zauważył, że siedem pokoleń wciąż nie ma wyznaczonych działów. Wysłał więc trzech ludzi z każdego z nich, by opisali ziemię, a następnie, przed Panem, rzucono losy i każdemu pokoleniu przypadł swój obszar. Juda i Józef (Efraim i Manasses) dostali swoje działy wcześniej, a Lewici otrzymali miasta wśród innych pokoleń. Później w Szilo służył Heli, a Samuel jako chłopiec.", "Szilo leży w sercu kraju, w górach Efraima, w dolinie ukrytej wśród niskich wzgórz, niedaleko głównego szlaku północ–południe. Z Szilo do Sychem jest ok. 18 km, a do Jerozolimy ok. 31 km. Taka środkowa pozycja ułatwiała pielgrzymom z różnych stron dotarcie na coroczne święta. Podział ziemi odzwierciedlał geografię: północ miała żyzne doliny, góry Efraima pastwiska i winnice, południe suchsze wzgórza. Dwanaście pokoleń otrzymało więc bardzo różne warunki życia."], "j": "Wyobraź sobie niewielkie wzgórze nad zielonkawą doliną, na którym stoi duży namiot przykryty skórami, otoczony dziedzińcem. Wokół rozstawione są mniejsze namioty pielgrzymów i kamienne zagrody. Wiosną i jesienią zbierają się tu tłumy. To rekonstrukcja artystyczna, bo dokładny wygląd Przybytku w Szilo znamy tylko z opisów.", "d": "Szilo leży ok. 600 m n.p.m. i ok. 31 km na północ od Jerozolimy.", "img": null}, {"id": "c4m7", "c": 4, "ct": "Ziemia Obiecana", "n": "Taanach i Megiddo", "lat": 32.585, "lon": 35.185, "ref": "Sdz 4–5", "sub": "Bitwa nad potokiem Kiszon i zwycięstwo Debory oraz Baraka nad wozami bojowymi Sisery.", "s": "Debora wezwała Baraka do walki przeciw Siserze, dowódcy kananejskich wozów bojowych. Ulewa zamieniła dolinę w błoto i uniemożliwiła wrogowi manewry.", "k": ["Prorokini i sędzia Debora z góry Efraim wezwała Baraka, by zebrał ludzi z Neftalego i Zabulona. Sisera, dowódca króla Jabina, dysponował dziewięcioma setkami żelaznych wozów i zebrał je nad Kiszonem. Gdy Barak ruszył z Taboru, Pan wprawił wrogów w zamieszanie, a dolina zamieniła się w błoto. Pieśń Debory wspomina o rozlewającym się potoku, który porwał wozy. Sisera uciekł pieszo i zginął w namiocie Jael. W tekście Taanach i Megiddo są opisane jako miejsce bitwy.", "Taanach i Megiddo strzegły przejść z Doliny Jizreel w stronę wybrzeża. Przez Megiddo biegła jedna z najważniejszych dróg starożytnego świata, łącząca Egipt z Mezopotamią, co sprawiało, że to miejsce wielokrotnie stawało się polem bitew. Dolina Jizreel jest rozległą równiną z żyzną, ciężką glebą, która po ulewie zamienia się w błoto. Wozy bojowe, groźne na twardym gruncie, ugrzęzły tu bezradnie. Geografia stała się zatem sprzymierzeńcem słabszej strony."], "j": "Zobacz rozległą, zieloną równinę pod ciężkim, ciemnym niebem. Na jej skraju wznoszą się dwa umocnione wzgórza z miastami, a w dolinie ugrzęzły drewniane wozy z końmi. Strumienie błota płyną ku potokowi, a w oddali widać górę Tabor. To rekonstrukcja artystyczna, oparta na opisie krajobrazu doliny.", "d": "Taanach i Megiddo dzieli ok. 8 km, a Dolina Jizreel ma szerokość ok. 20 km.", "img": "img/c4m7.webp"}, {"id": "c4m8", "c": 4, "ct": "Ziemia Obiecana", "n": "Góra Tabor", "lat": 32.687, "lon": 35.39, "ref": "Sdz 4,6–14", "sub": "Samotna, kopulasta góra, z której Barak ruszył do bitwy.", "s": "Na górze Tabor Barak zgromadził dziesięć tysięcy ludzi z Neftalego i Zabulona. Stąd, w deszczu, zszedł do doliny na spotkanie z wozami Sisery.", "k": ["Debora poleciła Barakowi zgromadzić dziesięć tysięcy ludzi na górze Tabor. Gdy Sisera dowiedział się o tym, ściągnął swoje wozy nad Kiszon. Wtedy Debora powiedziała Barakowi, że nadszedł dzień, w którym Pan wydaje wrogów w jego ręce. Barak zszedł ze zbocza z oddziałem i uderzył na wroga. Tabor wyznaczał granicę między terytoriami Zabulona, Neftalego i Issachara, więc służył jako naturalne miejsce zbiórki pokoleń.", "Tabor wyrasta samotnie z równiny, jak ogromna, zaokrąglona kopuła. Z jego szczytu widać całą dolinę Jizreel, wzgórza Galilei i przedpola Karmelu. Takie położenie zapewniało doskonały punkt obserwacyjny, a stok chronił wojsko przed szarżą wozów, które nie mogły w ten sposób wjechać pod górę. Schodzenie z góry dawało Izraelitom przewagę rozpędu, a błoto na dole pogłębiało zamieszanie wroga."], "j": "Wyobraź sobie symetryczną, porośniętą dębami i krzewami górę, która majestatycznie wznosi się nad płaską doliną. Na zboczach widać ścieżki i niewielkie zgromadzenie ludzi. Daleko w dole przewijają się kłęby kurzu lub deszczu. Rekonstrukcja artystyczna opiera się na dzisiejszym wyglądzie góry.", "d": "Tabor wznosi się ok. 588 m n.p.m. i ok. 400 m ponad otaczaj
